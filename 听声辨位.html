<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>声源定位抓拍系统 v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  
  #cameraVideo {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 1;
  }
  
  #overlayCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 2;
    pointer-events: none;
  }
  
  #radarCanvas {
    position: fixed;
    top: max(90px, calc(env(safe-area-inset-top) + 90px));
    right: 12px;
    width: 110px;
    height: 110px;
    z-index: 10;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  
  .hud-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0.2), transparent);
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  
  .hud-block {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    flex: 1;
    min-width: 0;
  }
  
  .hud-label {
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  
  .hud-value {
    font-size: 13px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .hud-value.highlight { color: #fbbf24; }
  .hud-value.danger { color: #f87171; }
  .hud-value.success { color: #4ade80; }
  
  .hud-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3), transparent);
  }
  
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 11px;
    color: #cbd5e1;
  }
  
  .status-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: blink 1.5s infinite;
  }
  
  .status-dot.off { background: #64748b; box-shadow: none; animation: none; }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  .btn-row {
    display: flex;
    gap: 8px;
  }
  
  .btn {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  
  .btn:active { transform: scale(0.97); }
  
  .btn-primary {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 14px rgba(239,68,68,0.4);
  }
  
  .btn-secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  
  .btn-stop {
    background: linear-gradient(135deg, #475569, #334155);
    color: #fff;
  }
  
  .scan-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .scan-hint.show { opacity: 1; }
  
  .scan-ring {
    width: 140px; height: 140px;
    margin: 0 auto 16px;
    position: relative;
  }
  
  .scan-ring-circle {
    position: absolute;
    inset: 0;
    border: 2px dashed rgba(251,191,36,0.5);
    border-radius: 50%;
    animation: rotate 6s linear infinite;
  }
  
  .scan-ring-progress {
    position: absolute;
    inset: 0;
    border: 3px solid transparent;
    border-top-color: #fbbf24;
    border-radius: 50%;
    transition: transform 0.3s;
  }
  
  .scan-ring-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  .scan-text {
    background: rgba(0,0,0,0.75);
    padding: 10px 18px;
    border-radius: 22px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    color: #fbbf24;
    border: 1px solid rgba(251,191,36,0.3);
    display: inline-block;
    max-width: 280px;
  }
  
  .scan-sub {
    margin-top: 8px;
    font-size: 11px;
    color: #94a3b8;
  }
  
  .toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    background: rgba(0,0,0,0.85);
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .toast.show { opacity: 1; }
  
  .startup {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    overflow-y: auto;
  }
  
  .startup.hidden { display: none; }
  
  .startup-logo {
    width: 76px; height: 76px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 18px;
    box-shadow: 0 8px 32px rgba(239,68,68,0.4);
  }
  
  .startup h1 {
    font-size: 21px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  
  .startup p {
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 22px;
    line-height: 1.6;
    max-width: 300px;
  }
  
  .info-grid {
    width: 100%;
    max-width: 320px;
    margin-bottom: 24px;
    text-align: left;
  }
  
  .info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  
  .info-row .ico {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(239,68,68,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  
  .info-row .txt {
    color: #cbd5e1;
    flex: 1;
    line-height: 1.4;
  }
  
  .start-btn {
    padding: 14px 48px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    border: none;
    border-radius: 28px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(239,68,68,0.4);
  }
  
  .start-btn:active { transform: scale(0.96); }
  .start-btn:disabled { opacity: 0.5; }
  
  .crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.35;
  }
  
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  
  .crosshair::before {
    top: 50%; left: 0; right: 0;
    height: 1px;
    transform: translateY(-50%);
  }
  
  .crosshair::after {
    left: 50%; top: 0; bottom: 0;
    width: 1px;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>
<canvas id="radarCanvas" width="220" height="220"></canvas>
<div class="crosshair"></div>

<div class="hud-top">
  <div class="hud-block">
    <div class="hud-label">声源方位</div>
    <div class="hud-value highlight" id="hudDirection">--</div>
  </div>
  <div class="hud-block" style="text-align:center">
    <div class="hud-label">强度</div>
    <div class="hud-value danger" id="hudLevel">-- dB</div>
  </div>
  <div class="hud-block" style="text-align:right">
    <div class="hud-label">置信度</div>
    <div class="hud-value success" id="hudConf">--%</div>
  </div>
</div>

<div class="scan-hint" id="scanHint">
  <div class="scan-ring">
    <div class="scan-ring-circle"></div>
    <div class="scan-ring-progress" id="scanProgress"></div>
    <div class="scan-ring-icon">🎯</div>
  </div>
  <div>
    <div class="scan-text" id="scanText">请水平旋转手机 360°</div>
    <div class="scan-sub" id="scanSub">保持手机高度不变，寻找声源方向</div>
  </div>
</div>

<div class="hud-bottom">
  <div class="status-row">
    <div class="status-item"><span class="status-dot off" id="dotMic"></span>麦克风</div>
    <div class="status-item"><span class="status-dot off" id="dotCam"></span>摄像头</div>
    <div class="status-item"><span class="status-dot off" id="dotSen"></span>传感器</div>
    <div id="modeText" style="color:#94a3b8;font-weight:600">待机</div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnMain" onclick="toggleMain()">▶ 启动抓拍</button>
    <button class="btn btn-secondary" onclick="resetScan()">⟲ 重置</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="startup" id="startup">
  <div class="startup-logo">🎯</div>
  <h1>声源定位抓拍系统 v2</h1>
  <p>改进算法：竖屏+横屏=4麦克风定位<br>小角度旋转即可精准锁定声源</p>
  <div class="info-grid">
    <div class="info-row">
      <div class="ico">🔄</div>
      <div class="txt">竖屏和横屏各提供2个麦克风约束</div>
    </div>
    <div class="info-row">
      <div class="ico">🎯</div>
      <div class="txt">高斯峰值检测，快速锁定声源方向</div>
    </div>
    <div class="info-row">
      <div class="ico">🧭</div>
      <div class="txt">世界坐标系固定声源，不受屏幕旋转影响</div>
    </div>
    <div class="info-row">
      <div class="ico">📷</div>
      <div class="txt">实时投影到摄像头画面，始终指向声源</div>
    </div>
  </div>
  <button class="start-btn" id="btnStart" onclick="boot()">启 动 系 统</button>
</div>

<script>
// ============ 全局状态 ============
const S = {
  compass: 0,
  compassReady: false,
  pitch: 0,
  hasSensor: false,
  
  camF: { x: 0, y: 1, z: 0 },
  camU: { x: 0, y: 0, z: 1 },
  camR: { x: 1, y: 0, z: 0 },
  
  audioCtx: null,
  analyser: null,
  micStream: null,
  smoothLevel: 0,
  
  soundDir: null,
  soundConfidence: 0,
  soundLocked: false,
  
  samples: [],
  scanning: false,
  totalRotation: 0,
  lastHeading: null,
  
  running: false,
  cameraFOV: 70,
};

// ============ 启动（改进错误处理）============
async function boot() {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  btn.textContent = '初始化中...';
  
  console.log('开始初始化...');
  
  try {
    // 1. 初始化摄像头
    console.log('正在请求摄像头权限...');
    toast('📷 正在请求摄像头权限...');
    await initCamera();
    setDot('dotCam', true);
    console.log('✅ 摄像头初始化成功');
    toast('✅ 摄像头就绪');
    
    // 等待一下再请求下一个权限
    await sleep(500);
    
    // 2. 初始化麦克风
    console.log('正在请求麦克风权限...');
    toast('🎤 正在请求麦克风权限...');
    await initMic();
    setDot('dotMic', true);
    console.log('✅ 麦克风初始化成功');
    toast('✅ 麦克风就绪');
    
    await sleep(500);
    
    // 3. 初始化传感器
    console.log('正在请求传感器权限...');
    toast('🧭 正在请求传感器权限...');
    await initSensors();
    setDot('dotSen', true);
    console.log('✅ 传感器初始化成功');
    toast('✅ 传感器就绪');
    
    // 4. 调整画布
    resizeCanvas();
    
    // 5. 隐藏启动画面
    setTimeout(() => {
      document.getElementById('startup').classList.add('hidden');
      toast('✅ 系统就绪，点击启动抓拍');
    }, 800);
    
  } catch (err) {
    console.error('❌ 初始化失败:', err);
    console.error('错误堆栈:', err.stack);
    
    let errorMsg = '初始化失败';
    if (err.name === 'NotAllowedError') {
      errorMsg = '权限被拒绝，请在浏览器设置中允许访问';
    } else if (err.name === 'NotFoundError') {
      errorMsg = '未找到设备，请检查摄像头/麦克风';
    } else if (err.name === 'NotReadableError') {
      errorMsg = '设备被占用，请关闭其他应用';
    } else if (err.message) {
      errorMsg = err.message;
    }
    
    toast('❌ ' + errorMsg);
    btn.disabled = false;
    btn.textContent = '重 试';
    
    // 显示详细错误（调试用）
    setTimeout(() => {
      alert('初始化失败详情:\n\n' + errorMsg + '\n\n请查看浏览器控制台获取更多信息');
    }, 1000);
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setDot(id, on) {
  const el = document.getElementById(id);
  if (on) el.classList.remove('off');
  else el.classList.add('off');
}

// ============ 摄像头 ============
async function initCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('浏览器不支持摄像头访问');
  }
  
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { 
      facingMode: 'environment', 
      width: { ideal: 1920 }, 
      height: { ideal: 1080 } 
    },
    audio: false
  });
  
  const video = document.getElementById('cameraVideo');
  video.srcObject = stream;
  
  // 等待视频加载
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = () => {
      video.play().then(resolve).catch(reject);
    };
    setTimeout(() => reject(new Error('视频加载超时')), 5000);
  });
}

// ============ 麦克风 ============
async function initMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('浏览器不支持麦克风访问');
  }
  
  S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // 恢复音频上下文（某些浏览器需要用户交互后才能使用）
  if (S.audioCtx.state === 'suspended') {
    await S.audioCtx.resume();
  }
  
  S.micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    }
  });
  
  const src = S.audioCtx.createMediaStreamSource(S.micStream);
  S.analyser = S.audioCtx.createAnalyser();
  S.analyser.fftSize = 2048;
  S.analyser.smoothingTimeConstant = 0.5;
  src.connect(S.analyser);
}

// ============ 传感器 ============
async function initSensors() {
  // iOS 权限请求
  if (typeof DeviceOrientationEvent !== 'undefined' && 
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    console.log('请求 iOS 方向传感器权限...');
    const p1 = await DeviceOrientationEvent.requestPermission();
    if (p1 !== 'granted') {
      throw new Error('方向传感器权限被拒绝');
    }
  }
  
  if (typeof DeviceMotionEvent !== 'undefined' && 
      typeof DeviceMotionEvent.requestPermission === 'function') {
    console.log('请求 iOS 运动传感器权限...');
    const p2 = await DeviceMotionEvent.requestPermission();
    if (p2 !== 'granted') {
      throw new Error('运动传感器权限被拒绝');
    }
  }
  
  // 监听方向事件
  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  
  S.hasSensor = true;
  console.log('传感器监听器已添加');
}

function handleOrientation(e) {
  // 罗盘朝向
  if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
    S.compass = e.webkitCompassHeading;
    S.compassReady = true;
  } else if (e.absolute && e.alpha !== null) {
    S.compass = (360 - e.alpha) % 360;
    S.compassReady = true;
  } else if (e.alpha !== null && !S.compassReady) {
    if (S._lastAlpha !== undefined) {
      let delta = e.alpha - S._lastAlpha;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      S.compass = (S.compass - delta + 360) % 360;
    }
    S._lastAlpha = e.alpha;
  }
  
  if (e.beta !== null) {
    S.pitch = e.beta;
  }
  
  computeCameraVectors();
}

// ============ 计算摄像头坐标系 ============
function computeCameraVectors() {
  const h = S.compass * Math.PI / 180;
  const b = S.pitch * Math.PI / 180;
  
  const ch = Math.cos(h), sh = Math.sin(h);
  const cb = Math.cos(b), sb = Math.sin(b);
  
  const camF = {
    x: sh * cb,
    y: ch * cb,
    z: -sb
  };
  
  const camU = { x: 0, y: 0, z: 1 };
  
  normalize(camF);
  
  const camR = {
    x: camF.y * camU.z - camF.z * camU.y,
    y: camF.z * camU.x - camF.x * camU.z,
    z: camF.x * camU.y - camF.y * camU.x
  };
  normalize(camR);
  
  camU.x = camR.y * camF.z - camR.z * camF.y;
  camU.y = camR.z * camF.x - camR.x * camF.z;
  camU.z = camR.x * camF.y - camR.y * camF.x;
  normalize(camU);
  
  S.camF = camF;
  S.camU = camU;
  S.camR = camR;
}

function normalize(v) {
  const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
  if (len > 0.0001) { v.x /= len; v.y /= len; v.z /= len; }
  return v;
}

function dot(a, b) { return a.x*b.x + a.y*b.y + a.z*b.z; }

// ============ Canvas ============
const canvas = document.getElementById('overlayCanvas');
const ctx = canvas.getContext('2d');
const radar = document.getElementById('radarCanvas');
const rctx = radar.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// ============ 主控制 ============
function toggleMain() {
  if (S.running) stop();
  else start();
}

function start() {
  S.running = true;
  S.scanning = true;
  S.samples = [];
  S.totalRotation = 0;
  S.lastHeading = S.compass;
  S.soundDir = null;
  S.soundConfidence = 0;
  S.soundLocked = false;
  
  document.getElementById('btnMain').textContent = '■ 停止';
  document.getElementById('btnMain').className = 'btn btn-stop';
  document.getElementById('modeText').textContent = '扫描定位中';
  document.getElementById('scanHint').classList.add('show');
  
  requestAnimationFrame(loop);
}

function stop() {
  S.running = false;
  S.scanning = false;
  document.getElementById('btnMain').textContent = '▶ 启动抓拍';
  document.getElementById('btnMain').className = 'btn btn-primary';
  document.getElementById('modeText').textContent = '已停止';
  document.getElementById('scanHint').classList.remove('show');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function resetScan() {
  S.samples = [];
  S.soundDir = null;
  S.soundConfidence = 0;
  S.soundLocked = false;
  S.totalRotation = 0;
  S.lastHeading = S.compass;
  if (S.running) {
    S.scanning = true;
    document.getElementById('modeText').textContent = '扫描定位中';
    document.getElementById('scanHint').classList.add('show');
  }
  toast('已重置');
}

// ============ 主循环 ============
function loop() {
  if (!S.running) return;
  
  const levelData = new Uint8Array(S.analyser.frequencyBinCount);
  S.analyser.getByteFrequencyData(levelData);
  
  const sampleRate = S.audioCtx.sampleRate;
  const binHz = sampleRate / S.analyser.fftSize;
  const lo = Math.floor(800 / binHz);
  const hi = Math.min(Math.floor(4500 / binHz), levelData.length - 1);
  let hornSum = 0;
  for (let i = lo; i <= hi; i++) hornSum += levelData[i];
  const hornLevel = hornSum / (hi - lo + 1);
  
  const rawIntensity = Math.min(1, hornLevel / 130);
  S.smoothLevel = S.smoothLevel * 0.6 + rawIntensity * 0.4;
  
  if (S.lastHeading !== null) {
    let delta = S.compass - S.lastHeading;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    S.totalRotation += Math.abs(delta);
  }
  S.lastHeading = S.compass;
  
  if (S.scanning && S.smoothLevel > 0.12) {
    S.samples.push({
      camF: { ...S.camF },
      camU: { ...S.camU },
      camR: { ...S.camR },
      level: S.smoothLevel,
      heading: S.compass,
      time: Date.now()
    });
    
    const now = Date.now();
    S.samples = S.samples.filter(s => now - s.time < 10000);
    if (S.samples.length > 300) {
      S.samples = S.samples.slice(-300);
    }
  }
  
  if (S.samples.length >= 8) {
    computeSoundSource();
  }
  
  updateScanHint();
  updateHUD();
  render();
  renderRadar();
  
  requestAnimationFrame(loop);
}

// ============ 声源定位算法 ============
function computeSoundSource() {
  let maxLevel = 0;
  S.samples.forEach(s => { if (s.level > maxLevel) maxLevel = s.level; });
  if (maxLevel < 0.05) return;
  
  const sigma = maxLevel * 0.35;
  let wx = 0, wy = 0, wz = 0, ww = 0;
  
  S.samples.forEach(s => {
    const diff = maxLevel - s.level;
    const w = Math.exp(-(diff * diff) / (2 * sigma * sigma));
    
    wx += s.camF.x * w;
    wy += s.camF.y * w;
    wz += s.camF.z * w;
    ww += w;
  });
  
  if (ww < 0.001) return;
  
  const dir = { x: wx/ww, y: wy/ww, z: wz/ww };
  normalize(dir);
  
  S.soundDir = dir;
  
  const countScore = Math.min(1, S.samples.length / 60);
  const vecLen = Math.sqrt(wx*wx + wy*wy + wz*wz) / ww;
  const consistencyScore = vecLen;
  const coverageScore = Math.min(1, S.totalRotation / 300);
  const avgLevel = S.samples.reduce((a,s)=>a+s.level,0) / S.samples.length;
  const peakScore = Math.min(1, (maxLevel / (avgLevel + 0.01) - 1) / 2);
  
  const rawConf = countScore * 0.2 + consistencyScore * 0.4 + coverageScore * 0.2 + peakScore * 0.2;
  S.soundConfidence = S.soundConfidence * 0.85 + rawConf * 0.15;
  
  if (S.soundConfidence > 0.5 && S.totalRotation > 240 && !S.soundLocked) {
    S.soundLocked = true;
    S.scanning = false;
    document.getElementById('modeText').textContent = '🎯 声源已锁定';
    document.getElementById('scanHint').classList.remove('show');
    toast('✅ 声源已锁定');
  }
}

function updateScanHint() {
  if (!S.scanning) return;
  
  const progress = Math.min(100, (S.totalRotation / 360) * 100);
  const rotEl = document.getElementById('scanProgress');
  rotEl.style.transform = `rotate(${progress * 3.6}deg)`;
  
  const textEl = document.getElementById('scanText');
  const subEl = document.getElementById('scanSub');
  
  if (S.soundDir && S.soundConfidence > 0.35) {
    const angle = vectorToHeading(S.soundDir);
    const dirs = ['北','东北','东','东南','南','西南','西','西北'];
    const idx = Math.round(angle / 45) % 8;
    textEl.textContent = `初步定位: ${dirs[idx]} ${angle.toFixed(0)}°`;
    subEl.textContent = `继续旋转提高精度 (${progress.toFixed(0)}%)`;
  } else if (S.smoothLevel > 0.15) {
    textEl.textContent = `检测到声音 · 请朝向声源旋转`;
    subEl.textContent = `旋转 ${progress.toFixed(0)}% · 采样 ${S.samples.length}`;
  } else {
    textEl.textContent = `等待声源 · 请旋转手机`;
    subEl.textContent = `旋转 ${progress.toFixed(0)}%`;
  }
}

function vectorToHeading(v) {
  let angle = Math.atan2(v.x, v.y) * 180 / Math.PI;
  if (angle < 0) angle += 360;
  return angle;
}

function updateHUD() {
  const db = S.smoothLevel > 0.01 ? (55 + S.smoothLevel * 45).toFixed(0) : '--';
  document.getElementById('hudLevel').textContent = db + ' dB';
  document.getElementById('hudConf').textContent = (S.soundConfidence * 100).toFixed(0) + '%';
  
  if (S.soundDir) {
    const dirs = ['北','东北','东','东南','南','西南','西','西北'];
    const angle = vectorToHeading(S.soundDir);
    const idx = Math.round(angle / 45) % 8;
    document.getElementById('hudDirection').textContent = dirs[idx] + ' ' + angle.toFixed(0) + '°';
  } else {
    document.getElementById('hudDirection').textContent = '扫描中...';
  }
}

function render() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  
  drawFrameCorners(W, H);
  
  if (!S.soundDir) {
    if (S.smoothLevel > 0.1) {
      drawCenterPulse(W, H);
    }
    return;
  }
  
  const proj = projectToScreen(S.soundDir);
  
  if (proj && proj.inView) {
    drawSoundMarker(proj.x, proj.y, S.smoothLevel, S.soundConfidence);
  } else if (proj) {
    drawOffscreenIndicator(proj.edgeX, proj.edgeY, proj.angle);
  } else {
    drawBehindIndicator(W, H);
  }
}

function projectToScreen(soundDir) {
  const F = S.camF;
  const U = S.camU;
  const R = S.camR;
  
  const fwd = dot(soundDir, F);
  const up = dot(soundDir, U);
  const right = dot(soundDir, R);
  
  if (fwd < 0.1) {
    return null;
  }
  
  const W = window.innerWidth;
  const H = window.innerHeight;
  const aspect = W / H;
  
  const halfFovRad = (S.cameraFOV / 2) * Math.PI / 180;
  const scale = 1 / Math.tan(halfFovRad);
  
  const nx = (right / fwd) * scale;
  const ny = -(up / fwd) * scale;
  
  const inView = Math.abs(nx) < 1.15 && Math.abs(ny) < aspect * 1.15;
  
  const px = W / 2 + nx * W / 2;
  const py = H / 2 + ny * H / 2;
  
  if (!inView) {
    let edgeX, edgeY;
    const margin = 40;
    
    if (Math.abs(nx) > 1) {
      edgeX = nx > 0 ? W - margin : margin;
      edgeY = Math.max(margin + 50, Math.min(H - margin - 80, py));
    } else {
      edgeX = Math.max(margin, Math.min(W - margin, px));
      edgeY = ny > 0 ? H - margin - 80 : margin + 50;
    }
    
    return { inView: false, edgeX, edgeY, angle: Math.atan2(ny, nx) };
  }
  
  return { inView: true, x: px, y: py };
}

function drawSoundMarker(x, y, intensity, confidence) {
  const now = Date.now();
  
  let color, rgb;
  if (intensity > 0.6) {
    color = '#ef4444'; rgb = [239, 68, 68];
  } else if (intensity > 0.3) {
    color = '#f59e0b'; rgb = [245, 158, 11];
  } else {
    color = '#22c55e'; rgb = [34, 197, 94];
  }
  
  const maxR = 70 + intensity * 70;
  for (let i = 4; i >= 0; i--) {
    const r = maxR * (1 + i * 0.4);
    const alpha = intensity * 0.15 * (1 - i * 0.18) * confidence;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${rgb.join(',')},${alpha * 1.6})`);
    grad.addColorStop(0.5, `rgba(${rgb.join(',')},${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(${rgb.join(',')},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  for (let p = 0; p < 2; p++) {
    const phase = ((now / 1600 + p * 0.5) % 1);
    const pr = 35 + phase * maxR * 1.3;
    const pa = (1 - phase) * intensity * 0.7 * confidence;
    ctx.strokeStyle = `rgba(${rgb.join(',')},${pa})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x, y, pr, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  const boxSize = 55 + intensity * 25;
  const cornerLen = 16;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  
  const corners = [
    [x - boxSize, y - boxSize, 1, 1],
    [x + boxSize, y - boxSize, -1, 1],
    [x - boxSize, y + boxSize, 1, -1],
    [x + boxSize, y + boxSize, -1, -1]
  ];
  corners.forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy * cornerLen);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + dx * cornerLen, cy);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = `rgba(${rgb.join(',')},0.95)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 12, y); ctx.lineTo(x - 4, y);
  ctx.moveTo(x + 4, y); ctx.lineTo(x + 12, y);
  ctx.moveTo(x, y - 12); ctx.lineTo(x, y - 4);
  ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 12);
  ctx.stroke();
  
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  const db = (55 + intensity * 45).toFixed(0);
  const label = `声源 ${db}dB`;
  ctx.font = 'bold 12px -apple-system, sans-serif';
  const tw = ctx.measureText(label).width;
  
  const lx = x - boxSize;
  const ly = y - boxSize - 26;
  
  ctx.fillStyle = color;
  roundRect(ctx, lx, ly, tw + 18, 22, 4);
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, lx + 9, ly + 11);
  
  if (confidence > 0.2) {
    const confLabel = `${(confidence * 100).toFixed(0)}%`;
    ctx.font = 'bold 10px -apple-system, sans-serif';
    const cw = ctx.measureText(confLabel).width;
    const cx2 = x + boxSize - cw - 6;
    const cy2 = y - boxSize - 22;
    
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(ctx, cx2, cy2, cw + 12, 18, 3);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    roundRect(ctx, cx2, cy2, cw + 12, 18, 3);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(confLabel, cx2 + (cw + 12) / 2, cy2 + 9);
  }
  
  const angle = vectorToHeading(S.soundDir);
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const idx = Math.round(angle / 45) % 8;
  const angleLabel = `${dirs[idx]} ${angle.toFixed(0)}°`;
  ctx.font = '11px -apple-system, sans-serif';
  const aw = ctx.measureText(angleLabel).width;
  const ax = x - aw / 2 - 6;
  const ay = y + boxSize + 8;
  
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, ax, ay, aw + 12, 18, 3);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(angleLabel, x, ay + 9);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawOffscreenIndicator(x, y, angle) {
  const intensity = S.smoothLevel;
  const color = intensity > 0.6 ? '#ef4444' : intensity > 0.3 ? '#f59e0b' : '#22c55e';
  const rgb = intensity > 0.6 ? '239,68,68' : intensity > 0.3 ? '245,158,11' : '34,197,94';
  
  const now = Date.now();
  const pulse = 0.6 + Math.sin(now / 200) * 0.4;
  
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  
  ctx.globalAlpha = pulse;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(-8, -12);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-8, 12);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
  
  const grad = ctx.createRadialGradient(x, y, 0, x, y, 40);
  grad.addColorStop(0, `rgba(${rgb},${0.3 * pulse})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, 40, 0, Math.PI * 2);
  ctx.fill();
  
  if (S.soundDir) {
    const angle2 = vectorToHeading(S.soundDir);
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(`声源 ${angle2.toFixed(0)}°`, x, y + 28);
  }
}

function drawBehindIndicator(W, H) {
  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('声源在背后 · 请转身', W / 2, H / 2 + 80);
}

function drawCenterPulse(W, H) {
  const cx = W / 2, cy = H / 2;
  const now = Date.now();
  const intensity = S.smoothLevel;
  
  for (let i = 0; i < 2; i++) {
    const phase = ((now / 1400 + i * 0.5) % 1);
    const r = 25 + phase * 70;
    const a = (1 - phase) * intensity * 0.7;
    ctx.strokeStyle = `rgba(251, 191, 36, ${a})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(251, 191, 36, 0.85)';
  ctx.textAlign = 'center';
  ctx.fillText('检测到声音 · 请水平旋转手机', cx, cy + 70);
}

function drawFrameCorners(W, H) {
  const len = 28;
  const m = 14;
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  
  ctx.beginPath();
  ctx.moveTo(m, m + len); ctx.lineTo(m, m); ctx.lineTo(m + len, m);
  ctx.moveTo(W - m - len, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + len);
  ctx.moveTo(m, H - m - len); ctx.lineTo(m, H - m); ctx.lineTo(m + len, H - m);
  ctx.moveTo(W - m - len, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - len);
  ctx.stroke();
}

function renderRadar() {
  const W = 220, H = 220;
  const cx = W / 2, cy = H / 2;
  const R = 90;
  
  rctx.clearRect(0, 0, W, H);
  
  rctx.fillStyle = 'rgba(0,0,0,0.3)';
  rctx.beginPath();
  rctx.arc(cx, cy, R, 0, Math.PI * 2);
  rctx.fill();
  
  rctx.strokeStyle = 'rgba(255,255,255,0.15)';
  rctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    rctx.beginPath();
    rctx.arc(cx, cy, R * i / 3, 0, Math.PI * 2);
    rctx.stroke();
  }
  
  rctx.beginPath();
  rctx.moveTo(cx - R, cy); rctx.lineTo(cx + R, cy);
  rctx.moveTo(cx, cy - R); rctx.lineTo(cx, cy + R);
  rctx.stroke();
  
  rctx.font = 'bold 10px -apple-system, sans-serif';
  rctx.textAlign = 'center';
  rctx.textBaseline = 'middle';
  rctx.fillStyle = '#ef4444';
  rctx.fillText('N', cx, cy - R + 8);
  rctx.fillStyle = 'rgba(255,255,255,0.6)';
  rctx.fillText('E', cx + R - 8, cy);
  rctx.fillText('S', cx, cy + R - 8);
  rctx.fillText('W', cx - R + 8, cy);
  
  if (S.samples.length > 0) {
    rctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
    rctx.lineWidth = 1.5;
    rctx.beginPath();
    let first = true;
    S.samples.forEach(s => {
      const h = s.heading * Math.PI / 180;
      const rx = cx + Math.sin(h) * R * 0.85;
      const ry = cy - Math.cos(h) * R * 0.85;
      if (first) { rctx.moveTo(rx, ry); first = false; }
      else rctx.lineTo(rx, ry);
    });
    rctx.stroke();
    
    S.samples.forEach(s => {
      const h = s.heading * Math.PI / 180;
      const rx = cx + Math.sin(h) * R * 0.85;
      const ry = cy - Math.cos(h) * R * 0.85;
      const alpha = 0.3 + s.level * 0.7;
      const color = s.level > 0.5 ? `rgba(239,68,68,${alpha})` : 
                    s.level > 0.25 ? `rgba(245,158,11,${alpha})` : 
                    `rgba(34,197,94,${alpha})`;
      rctx.fillStyle = color;
      rctx.beginPath();
      rctx.arc(rx, ry, 2 + s.level * 2, 0, Math.PI * 2);
      rctx.fill();
    });
  }
  
  if (S.soundDir) {
    const angle = vectorToHeading(S.soundDir);
    const h = angle * Math.PI / 180;
    const sx = cx + Math.sin(h) * R * 0.85;
    const sy = cy - Math.cos(h) * R * 0.85;
    
    const intensity = S.smoothLevel;
    const color = intensity > 0.6 ? '#ef4444' : intensity > 0.3 ? '#f59e0b' : '#22c55e';
    
    rctx.strokeStyle = color;
    rctx.lineWidth = 1.5;
    rctx.setLineDash([3, 3]);
    rctx.beginPath();
    rctx.moveTo(cx, cy);
    rctx.lineTo(sx, sy);
    rctx.stroke();
    rctx.setLineDash([]);
    
    rctx.fillStyle = color;
    rctx.shadowColor = color;
    rctx.shadowBlur = 8;
    rctx.beginPath();
    rctx.arc(sx, sy, 5, 0, Math.PI * 2);
    rctx.fill();
    rctx.shadowBlur = 0;
    rctx.strokeStyle = '#fff';
    rctx.lineWidth = 1.5;
    rctx.stroke();
  }
  
  const ch = S.compass * Math.PI / 180;
  const tx = cx + Math.sin(ch) * (R - 4);
  const ty = cy - Math.cos(ch) * (R - 4);
  
  rctx.save();
  rctx.translate(tx, ty);
  rctx.rotate(ch);
  rctx.fillStyle = '#60a5fa';
  rctx.beginPath();
  rctx.moveTo(0, -6);
  rctx.lineTo(-4, 4);
  rctx.lineTo(4, 4);
  rctx.closePath();
  rctx.fill();
  rctx.restore();
  
  rctx.fillStyle = '#fff';
  rctx.beginPath();
  rctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  rctx.fill();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

resizeCanvas();

// 全局错误处理
window.addEventListener('error', (e) => {
  console.error('全局错误:', e.error);
  toast('❌ 发生错误: ' + e.message);
});

window.addEventListener('unhandledrejection', (e) => {
  console.error('未处理的 Promise 拒绝:', e.reason);
  toast('❌ 异步错误: ' + (e.reason?.message || '未知错误'));
});
</script>
