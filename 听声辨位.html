<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>声源定位抓拍系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    touch-action: none;
  }
  
  #cameraVideo {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: cover;
    z-index: 1;
  }
  
  #overlayCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 2;
    pointer-events: none;
  }
  
  /* 顶部信息栏 - 类似执法抓拍 */
  .hud-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0.3), transparent);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  
  .hud-block {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  
  .hud-label {
    font-size: 9px;
    color: #94a3b8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  
  .hud-value {
    font-size: 14px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  
  .hud-value.highlight {
    color: #fbbf24;
  }
  
  .hud-value.danger {
    color: #f87171;
  }
  
  /* 底部控制栏 */
  .hud-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  }
  
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 11px;
  }
  
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 5px;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: blink 1.5s infinite;
  }
  
  .status-dot.off { background: #64748b; box-shadow: none; animation: none; }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  .btn-row {
    display: flex;
    gap: 8px;
  }
  
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 12px rgba(239,68,68,0.4);
  }
  
  .btn-primary:active { transform: scale(0.97); }
  
  .btn-secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
  }
  
  .btn-stop {
    background: linear-gradient(135deg, #64748b, #475569);
    color: #fff;
  }
  
  /* 启动画面 */
  .startup {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  
  .startup.hidden { display: none; }
  
  .startup-logo {
    width: 80px; height: 80px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(239,68,68,0.4);
  }
  
  .startup h1 {
    font-size: 22px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  
  .startup p {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 300px;
  }
  
  .info-grid {
    width: 100%;
    max-width: 320px;
    margin-bottom: 28px;
    text-align: left;
  }
  
  .info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  
  .info-row .ico {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(239,68,68,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  
  .info-row .txt {
    color: #cbd5e1;
    flex: 1;
  }
  
  .info-row .val {
    color: #fbbf24;
    font-weight: 600;
    font-size: 11px;
  }
  
  .start-btn {
    padding: 14px 48px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    border: none;
    border-radius: 28px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(239,68,68,0.4);
  }
  
  .start-btn:active { transform: scale(0.96); }
  .start-btn:disabled { opacity: 0.5; }
  
  /* 扫描提示 */
  .scan-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .scan-hint.show { opacity: 1; }
  
  .scan-hint .ring {
    width: 120px; height: 120px;
    border: 2px dashed rgba(251,191,36,0.6);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: rotate 4s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  .scan-hint .txt {
    background: rgba(0,0,0,0.7);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    color: #fbbf24;
  }
  
  /* Toast */
  .toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    background: rgba(0,0,0,0.85);
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .toast.show { opacity: 1; }
  
  /* 十字准心 */
  .crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.4;
  }
  
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  
  .crosshair::before {
    top: 50%; left: 0; right: 0;
    height: 1px;
    transform: translateY(-50%);
  }
  
  .crosshair::after {
    left: 50%; top: 0; bottom: 0;
    width: 1px;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="overlayCanvas"></canvas>
<div class="crosshair"></div>

<div class="hud-top">
  <div class="hud-block">
    <div class="hud-label">方位</div>
    <div class="hud-value highlight" id="hudDirection">--</div>
  </div>
  <div class="hud-block" style="text-align:center">
    <div class="hud-label">声源强度</div>
    <div class="hud-value danger" id="hudLevel">-- dB</div>
  </div>
  <div class="hud-block" style="text-align:right">
    <div class="hud-label">朝向</div>
    <div class="hud-value" id="hudHeading">--°</div>
  </div>
</div>

<div class="scan-hint" id="scanHint">
  <div class="ring">🎯</div>
  <div class="txt" id="scanText">请缓慢水平旋转手机 360°</div>
</div>

<div class="hud-bottom">
  <div class="status-row">
    <span><span class="status-dot off" id="dotMic"></span>麦克风</span>
    <span><span class="status-dot off" id="dotCam"></span>摄像头</span>
    <span><span class="status-dot off" id="dotSen"></span>传感器</span>
    <span id="modeText" style="color:#94a3b8">待机</span>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnMain" onclick="toggleMain()">▶ 启动抓拍</button>
    <button class="btn btn-secondary" onclick="resetScan()">⟲ 重置</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="startup" id="startup">
  <div class="startup-logo">🎯</div>
  <h1>声源定位抓拍系统</h1>
  <p>类似交通鸣笛抓拍摄像头<br>实时标记画面中的声源位置</p>
  <div class="info-grid">
    <div class="info-row">
      <div class="ico">🎤</div>
      <div class="txt">通过声音强度与手机朝向定位声源</div>
    </div>
    <div class="info-row">
      <div class="ico">📷</div>
      <div class="txt">在摄像头画面上叠加声源热力标记</div>
    </div>
    <div class="info-row">
      <div class="ico">🧭</div>
      <div class="txt">手机旋转时标记自动跟踪真实声源</div>
    </div>
    <div class="info-row">
      <div class="ico">🔴</div>
      <div class="txt">红/黄/绿三色表示声源强度等级</div>
    </div>
  </div>
  <button class="start-btn" id="btnStart" onclick="boot()">启 动 系 统</button>
</div>

<script>
// ========== 全局状态 ==========
const S = {
  // 传感器
  heading: 0,           // 手机朝向 (0-360, 北=0)
  pitch: 0,             // 俯仰角
  roll: 0,
  hasSensor: false,
  
  // 音频
  audioCtx: null,
  analyser: null,
  micStream: null,
  
  // 声源（真实世界方位，固定不变）
  soundWorldAngle: null,    // 声源在真实世界的方位角（度）
  soundConfidence: 0,       // 定位置信度 0-1
  soundIntensity: 0,        // 当前强度 0-1
  soundPitchOffset: 0,      // 声源相对水平面的俯仰偏移
  
  // 扫描数据
  scanSamples: [],          // {heading, level, pitch}
  scanning: false,
  lastScanHeading: null,
  totalRotation: 0,
  
  // 状态
  running: false,
  cameraReady: false,
  
  // 摄像头 FOV（水平视角，度）
  cameraFOV: 65,
};

// ========== 启动 ==========
async function boot() {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  btn.textContent = '初始化中...';
  
  try {
    await initCamera();
    setDot('dotCam', true);
    
    await initMic();
    setDot('dotMic', true);
    
    await initSensors();
    setDot('dotSen', true);
    
    resizeCanvas();
    
    setTimeout(() => {
      document.getElementById('startup').classList.add('hidden');
      toast('✅ 系统就绪，点击启动抓拍');
    }, 400);
    
  } catch (err) {
    console.error(err);
    toast('❌ ' + err.message);
    btn.disabled = false;
    btn.textContent = '重 试';
  }
}

function setDot(id, on) {
  const el = document.getElementById(id);
  if (on) el.classList.remove('off');
  else el.classList.add('off');
}

// ========== 摄像头 ==========
async function initCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  });
  document.getElementById('cameraVideo').srcObject = stream;
  S.cameraReady = true;
}

// ========== 麦克风 ==========
async function initMic() {
  S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  S.micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    }
  });
  const src = S.audioCtx.createMediaStreamSource(S.micStream);
  S.analyser = S.audioCtx.createAnalyser();
  S.analyser.fftSize = 2048;
  S.analyser.smoothingTimeConstant = 0.6;
  src.connect(S.analyser);
}

// ========== 传感器 ==========
async function initSensors() {
  // iOS 权限请求
  if (typeof DeviceOrientationEvent !== 'undefined' && 
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    const p1 = await DeviceOrientationEvent.requestPermission();
    if (p1 !== 'granted') throw new Error('方向传感器权限被拒绝');
  }
  if (typeof DeviceMotionEvent !== 'undefined' && 
      typeof DeviceMotionEvent.requestPermission === 'function') {
    const p2 = await DeviceMotionEvent.requestPermission();
    if (p2 !== 'granted') throw new Error('运动传感器权限被拒绝');
  }
  
  window.addEventListener('deviceorientationabsolute', handleOrientation, true);
  window.addEventListener('deviceorientation', handleOrientation, true);
  window.addEventListener('devicemotion', handleMotion, true);
  
  S.hasSensor = true;
}

function handleOrientation(e) {
  // webkitCompassHeading 是 iOS 上真正的罗盘朝向（顺时针，0=北）
  if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
    S.heading = e.webkitCompassHeading;
  } else if (e.absolute && e.alpha !== null) {
    // Android: alpha 是逆时针，需要转换
    S.heading = (360 - e.alpha) % 360;
  } else if (e.alpha !== null) {
    // 非绝对方向，仅用于相对变化
    if (S._lastAlpha !== undefined) {
      const delta = e.alpha - S._lastAlpha;
      S.heading = (S.heading - delta + 360) % 360;
    }
    S._lastAlpha = e.alpha;
  }
  
  if (e.beta !== null) S.pitch = e.beta;
  if (e.gamma !== null) S.roll = e.gamma;
}

function handleMotion(e) {
  // 可用于检测快速旋转
}

// ========== Canvas ==========
const canvas = document.getElementById('overlayCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// ========== 主控制 ==========
function toggleMain() {
  if (S.running) {
    stop();
  } else {
    start();
  }
}

function start() {
  S.running = true;
  S.scanning = true;
  S.scanSamples = [];
  S.totalRotation = 0;
  S.lastScanHeading = S.heading;
  S.soundWorldAngle = null;
  S.soundConfidence = 0;
  
  document.getElementById('btnMain').textContent = '■ 停止';
  document.getElementById('btnMain').className = 'btn btn-stop';
  document.getElementById('modeText').textContent = '扫描定位中';
  document.getElementById('scanHint').classList.add('show');
  
  requestAnimationFrame(loop);
}

function stop() {
  S.running = false;
  S.scanning = false;
  document.getElementById('btnMain').textContent = '▶ 启动抓拍';
  document.getElementById('btnMain').className = 'btn btn-primary';
  document.getElementById('modeText').textContent = '已停止';
  document.getElementById('scanHint').classList.remove('show');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function resetScan() {
  S.scanSamples = [];
  S.soundWorldAngle = null;
  S.soundConfidence = 0;
  S.totalRotation = 0;
  S.lastScanHeading = S.heading;
  toast('已重置扫描数据');
}

// ========== 主循环 ==========
function loop() {
  if (!S.running) return;
  
  // 1. 读取音频强度
  const levelData = new Uint8Array(S.analyser.frequencyBinCount);
  S.analyser.getByteFrequencyData(levelData);
  
  // 计算总体强度
  let sum = 0;
  for (let i = 0; i < levelData.length; i++) sum += levelData[i];
  const avgLevel = sum / levelData.length;
  
  // 计算鸣笛频段强度 (1000Hz - 5000Hz)
  const sampleRate = S.audioCtx.sampleRate;
  const binHz = sampleRate / S.analyser.fftSize;
  const lo = Math.floor(1000 / binHz);
  const hi = Math.min(Math.floor(5000 / binHz), levelData.length - 1);
  let hornSum = 0;
  for (let i = lo; i <= hi; i++) hornSum += levelData[i];
  const hornLevel = hornSum / (hi - lo + 1);
  
  // 归一化强度 (0-1)
  const intensity = Math.min(1, hornLevel / 140);
  S.soundIntensity = S.soundIntensity * 0.7 + intensity * 0.3; // 平滑
  
  // 2. 扫描阶段：收集数据，确定声源世界方位
  if (S.scanning) {
    // 跟踪旋转量
    if (S.lastScanHeading !== null) {
      let delta = S.heading - S.lastScanHeading;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      S.totalRotation += Math.abs(delta);
    }
    S.lastScanHeading = S.heading;
    
    // 只在有显著声音时采样
    if (S.soundIntensity > 0.15) {
      S.scanSamples.push({
        heading: S.heading,
        level: S.soundIntensity,
        pitch: S.pitch,
        time: Date.now()
      });
      // 只保留最近 6 秒
      const now = Date.now();
      S.scanSamples = S.scanSamples.filter(s => now - s.time < 6000);
    }
    
    // 计算声源方位
    if (S.scanSamples.length >= 8) {
      computeSoundSource();
    }
    
    // 更新扫描提示
    const progress = Math.min(100, (S.totalRotation / 360) * 100);
    if (S.soundWorldAngle !== null && S.soundConfidence > 0.5) {
      document.getElementById('scanText').textContent = 
        `✓ 声源已锁定 (${(S.soundConfidence * 100).toFixed(0)}%)`;
    } else {
      document.getElementById('scanText').textContent = 
        `旋转 ${progress.toFixed(0)}% · 请朝向声源方向转动`;
    }
    
    // 扫描足够后退出扫描模式
    if (S.totalRotation > 330 && S.soundWorldAngle !== null) {
      S.scanning = false;
      document.getElementById('modeText').textContent = '实时跟踪中';
      document.getElementById('scanHint').classList.remove('show');
      toast('🎯 声源已锁定，跟踪中');
    }
  }
  
  // 3. 更新 HUD
  updateHUD();
  
  // 4. 渲染叠加层
  render();
  
  requestAnimationFrame(loop);
}

// ========== 计算声源世界方位 ==========
function computeSoundSource() {
  // 加权平均：用强度的平方作为权重，计算声源方位
  let wx = 0, wy = 0, ww = 0;
  let wpitch = 0;
  
  S.scanSamples.forEach(s => {
    const rad = s.heading * Math.PI / 180;
    const w = Math.pow(s.level, 2);
    wx += Math.sin(rad) * w;
    wy += Math.cos(rad) * w;
    wpitch += s.pitch * w;
    ww += w;
  });
  
  if (ww < 0.01) return;
  
  wx /= ww;
  wy /= ww;
  wpitch /= ww;
  
  let angle = Math.atan2(wx, wy) * 180 / Math.PI;
  if (angle < 0) angle += 360;
  
  // 平滑
  if (S.soundWorldAngle === null) {
    S.soundWorldAngle = angle;
    S.soundPitchOffset = wpitch - 45; // 相对水平
  } else {
    // 处理环绕
    let diff = angle - S.soundWorldAngle;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    S.soundWorldAngle = (S.soundWorldAngle + diff * 0.25 + 360) % 360;
    S.soundPitchOffset = S.soundPitchOffset * 0.8 + (wpitch - 45) * 0.2;
  }
  
  // 置信度：基于采样数量与强度一致性
  const levels = S.scanSamples.map(s => s.level);
  const avgL = levels.reduce((a,b)=>a+b,0) / levels.length;
  const variance = levels.reduce((a,b)=>a+Math.pow(b-avgL,2),0) / levels.length;
  const consistency = Math.max(0, 1 - variance * 4);
  const coverage = Math.min(1, S.scanSamples.length / 40);
  S.soundConfidence = S.soundConfidence * 0.9 + (consistency * 0.6 + coverage * 0.4) * 0.1 + S.soundConfidence * 0.9;
  S.soundConfidence = Math.min(1, S.soundConfidence);
}

// ========== HUD 更新 ==========
function updateHUD() {
  document.getElementById('hudHeading').textContent = S.heading.toFixed(0) + '°';
  
  const db = S.soundIntensity > 0.01 ? (60 + S.soundIntensity * 40).toFixed(0) : '--';
  document.getElementById('hudLevel').textContent = db + ' dB';
  
  if (S.soundWorldAngle !== null) {
    const dirs = ['北','东北','东','东南','南','西南','西','西北'];
    const idx = Math.round(S.soundWorldAngle / 45) % 8;
    document.getElementById('hudDirection').textContent = 
      dirs[idx] + ' ' + S.soundWorldAngle.toFixed(0) + '°';
  } else {
    document.getElementById('hudDirection').textContent = '扫描中...';
  }
}

// ========== 渲染 ==========
function render() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  
  // 绘制瞄准框边角
  drawFrameCorners(W, H);
  
  // 如果没有声源信息，只绘制弱信号提示
  if (S.soundWorldAngle === null) {
    if (S.soundIntensity > 0.1) {
      drawCenterPulse(W, H, S.soundIntensity);
    }
    return;
  }
  
  // 计算声源相对于画面中心的角度差
  let relAngle = S.soundWorldAngle - S.heading;
  if (relAngle > 180) relAngle -= 360;
  if (relAngle < -180) relAngle += 360;
  
  // 判断是否在画面内（考虑 FOV）
  const halfFOV = S.cameraFOV / 2;
  const inView = Math.abs(relAngle) < halfFOV + 15; // 稍大于 FOV 时显示边缘指示
  
  if (inView) {
    // 计算屏幕位置
    // relAngle = 0 在中心，±halfFOV 在边缘
    const aspect = W / H;
    const horizFOV = S.cameraFOV;
    const vertFOV = horizFOV / aspect;
    
    const screenX = W / 2 + (relAngle / halfFOV) * (W / 2);
    
    // 垂直位置：基于声源俯仰与当前手机俯仰的差
    const pitchDiff = S.soundPitchOffset - (S.pitch - 45); // 45 是典型手持角度
    const screenY = H / 2 - (pitchDiff / (vertFOV / 2)) * (H / 2);
    
    // 限制在屏幕内
    const clampedX = Math.max(40, Math.min(W - 40, screenX));
    const clampedY = Math.max(100, Math.min(H - 140, screenY));
    
    // 绘制声源标记
    drawSoundMarker(clampedX, clampedY, S.soundIntensity, S.soundConfidence, W, H);
    
    // 如果在边缘，绘制方向指示箭头
    if (Math.abs(relAngle) > halfFOV - 5) {
      drawEdgeArrow(relAngle > 0 ? 1 : -1, W, H, S.soundIntensity);
    }
  } else {
    // 声源在画面外，绘制边缘指示
    drawOffscreenIndicator(relAngle, W, H);
  }
  
  // 绘制底部方向条
  drawDirectionBar(W, H);
}

// ========== 绘制声源标记（核心） ==========
function drawSoundMarker(x, y, intensity, confidence, W, H) {
  const now = Date.now();
  
  // 颜色：根据强度
  let color, colorRGB;
  if (intensity > 0.65) {
    color = '#ef4444';
    colorRGB = [239, 68, 68];
  } else if (intensity > 0.35) {
    color = '#f59e0b';
    colorRGB = [245, 158, 11];
  } else {
    color = '#22c55e';
    colorRGB = [34, 197, 94];
  }
  
  // 1. 外层热力扩散圈（多层）
  const maxR = 60 + intensity * 60;
  for (let i = 4; i >= 0; i--) {
    const r = maxR * (1 + i * 0.4);
    const alpha = intensity * 0.12 * (1 - i * 0.18) * confidence;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${colorRGB.join(',')},${alpha * 1.5})`);
    grad.addColorStop(0.5, `rgba(${colorRGB.join(',')},${alpha * 0.6})`);
    grad.addColorStop(1, `rgba(${colorRGB.join(',')},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // 2. 脉冲波纹
  const pulsePhase = (now % 1800) / 1800;
  for (let p = 0; p < 2; p++) {
    const phase = (pulsePhase + p * 0.5) % 1;
    const pr = 30 + phase * maxR * 1.2;
    const pa = (1 - phase) * intensity * 0.6 * confidence;
    ctx.strokeStyle = `rgba(${colorRGB.join(',')},${pa})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, pr, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // 3. 定位框（类似抓拍的方框）
  const boxSize = 50 + intensity * 30;
  const cornerLen = 14;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  
  // 四个角
  const corners = [
    [x - boxSize, y - boxSize, 1, 1],
    [x + boxSize, y - boxSize, -1, 1],
    [x - boxSize, y + boxSize, 1, -1],
    [x + boxSize, y + boxSize, -1, -1]
  ];
  corners.forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy * cornerLen);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + dx * cornerLen, cy);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;
  
  // 4. 中心十字
  ctx.strokeStyle = `rgba(${colorRGB.join(',')},0.9)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 10, y); ctx.lineTo(x - 3, y);
  ctx.moveTo(x + 3, y); ctx.lineTo(x + 10, y);
  ctx.moveTo(x, y - 10); ctx.lineTo(x, y - 3);
  ctx.moveTo(x, y + 3); ctx.lineTo(x, y + 10);
  ctx.stroke();
  
  // 5. 中心点
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
  
  // 6. 标签
  const db = (60 + intensity * 40).toFixed(0);
  const label = `声源 ${db}dB`;
  ctx.font = 'bold 12px -apple-system, sans-serif';
  const tw = ctx.measureText(label).width;
  
  // 标签背景
  ctx.fillStyle = color;
  const lx = x - boxSize;
  const ly = y - boxSize - 24;
  roundRect(ctx, lx, ly, tw + 16, 20, 4);
  ctx.fill();
  
  // 标签文字
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, lx + 8, ly + 10);
  
  // 置信度小标签
  if (confidence > 0.3) {
    const confLabel = `${(confidence * 100).toFixed(0)}%`;
    ctx.font = 'bold 10px -apple-system, sans-serif';
    const cw = ctx.measureText(confLabel).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(ctx, x + boxSize - cw - 8, y - boxSize - 20, cw + 12, 16, 3);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    roundRect(ctx, x + boxSize - cw - 8, y - boxSize - 20, cw + 12, 16, 3);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(confLabel, x + boxSize - cw/2 - 2, y - boxSize - 12);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ========== 画面边角框 ==========
function drawFrameCorners(W, H) {
  const len = 30;
  const m = 16;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  
  // 左上
  ctx.beginPath();
  ctx.moveTo(m, m + len); ctx.lineTo(m, m); ctx.lineTo(m + len, m);
  // 右上
  ctx.moveTo(W - m - len, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + len);
  // 左下
  ctx.moveTo(m, H - m - len); ctx.lineTo(m, H - m); ctx.lineTo(m + len, H - m);
  // 右下
  ctx.moveTo(W - m - len, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - len);
  ctx.stroke();
}

// ========== 中心脉冲（未定位时） ==========
function drawCenterPulse(W, H, intensity) {
  const cx = W / 2, cy = H / 2;
  const now = Date.now();
  const phase = (now % 1500) / 1500;
  const r = 20 + phase * 60;
  const a = (1 - phase) * intensity * 0.6;
  
  ctx.strokeStyle = `rgba(251, 191, 36, ${a})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(251, 191, 36, 0.8)';
  ctx.textAlign = 'center';
  ctx.fillText('检测到声音 · 请旋转手机定位', cx, cy + 60);
}

// ========== 边缘箭头 ==========
function drawEdgeArrow(dir, W, H, intensity) {
  const y = H / 2;
  const x = dir > 0 ? W - 30 : 30;
  const color = intensity > 0.65 ? '#ef4444' : intensity > 0.35 ? '#f59e0b' : '#22c55e';
  
  ctx.fillStyle = color;
  ctx.beginPath();
  if (dir > 0) {
    ctx.moveTo(x + 10, y);
    ctx.lineTo(x - 6, y - 10);
    ctx.lineTo(x - 6, y + 10);
  } else {
    ctx.moveTo(x - 10, y);
    ctx.lineTo(x + 6, y - 10);
    ctx.lineTo(x + 6, y + 10);
  }
  ctx.closePath();
  ctx.fill();
}

// ========== 画面外指示器 ==========
function drawOffscreenIndicator(relAngle, W, H) {
  // 在屏幕边缘绘制指向声源的箭头
  const cx = W / 2, cy = H / 2;
  
  // 将角度转换为屏幕方向（relAngle 是水平角度）
  // 正 = 声源在右边，负 = 左边
  const margin = 40;
  let ax, ay;
  
  if (relAngle > 0) {
    ax = W - margin;
    ay = Math.max(margin + 40, Math.min(H - margin - 80, cy));
  } else {
    ax = margin;
    ay = Math.max(margin + 40, Math.min(H - margin - 80, cy));
  }
  
  const intensity = S.soundIntensity;
  const color = intensity > 0.65 ? '#ef4444' : intensity > 0.35 ? '#f59e0b' : '#22c55e';
  
  // 箭头
  const now = Date.now();
  const pulse = 0.7 + Math.sin(now / 200) * 0.3;
  
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(relAngle > 0 ? 0 : Math.PI);
  
  ctx.fillStyle = color;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-8, -12);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-8, 12);
  ctx.closePath();
  ctx.fill();
  
  ctx.globalAlpha = 1;
  ctx.restore();
  
  // 文字
  ctx.font = 'bold 11px -apple-system, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(`声源 ${Math.abs(relAngle).toFixed(0)}°`, ax, ay + 26);
}

// ========== 底部方向条 ==========
function drawDirectionBar(W, H) {
  if (S.soundWorldAngle === null) return;
  
  const barY = H - 90;
  const barH = 4;
  const barW = W - 40;
  const barX = 20;
  
  // 背景
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, barX - 4, barY - 14, barW + 8, barH + 28, 6);
  ctx.fill();
  
  // 刻度
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '9px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  
  for (let a = 0; a < 360; a += 45) {
    const px = barX + (a / 360) * barW;
    ctx.beginPath();
    ctx.moveTo(px, barY);
    ctx.lineTo(px, barY + barH);
    ctx.stroke();
    
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    ctx.fillText(dirs[a/45], px, barY - 4);
  }
  
  // 当前朝向（白色三角）
  const headX = barX + (S.heading / 360) * barW;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(headX, barY + barH + 2);
  ctx.lineTo(headX - 4, barY + barH + 8);
  ctx.lineTo(headX + 4, barY + barH + 8);
  ctx.closePath();
  ctx.fill();
  
  // FOV 范围（半透明）
  const fovLeft = barX + (((S.heading - S.cameraFOV/2 + 360) % 360) / 360) * barW;
  const fovRight = barX + (((S.heading + S.cameraFOV/2) % 360) / 360) * barW;
  ctx.fillStyle = 'rgba(96, 165, 250, 0.2)';
  if (fovRight > fovLeft) {
    ctx.fillRect(fovLeft, barY, fovRight - fovLeft, barH);
  } else {
    ctx.fillRect(fovLeft, barY, barX + barW - fovLeft, barH);
    ctx.fillRect(barX, barY, fovRight - barX, barH);
  }
  
  // 声源位置（彩色圆点）
  const srcX = barX + (S.soundWorldAngle / 360) * barW;
  const intensity = S.soundIntensity;
  const color = intensity > 0.65 ? '#ef4444' : intensity > 0.35 ? '#f59e0b' : '#22c55e';
  
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(srcX, barY + barH / 2, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(srcX, barY + barH / 2, 5, 0, Math.PI * 2);
  ctx.stroke();
}

// ========== Toast ==========
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// 初始化 canvas
resizeCanvas();
</script>
