<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全频段噪音检测 · 频段可调版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    line-height: 1.6;
    padding: 16px;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; color: #00ff88; letter-spacing: .5px; }
  .subtitle { color: #666; font-size: .85rem; margin-bottom: 20px; }
  .card {
    background: #12121a;
    border: 1px solid #1e1e2e;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  h2 {
    font-size: 1.05rem;
    margin-bottom: 6px;
    color: #00ff88;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2 .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: #00ff88;
    color: #0a0a0f;
    border-radius: 50%;
    font-size: .8rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .hint { color: #777; font-size: .83rem; margin-bottom: 12px; line-height: 1.6; }

  /* ---- 频段选择 ---- */
  .band-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .band-btn {
    padding: 8px 14px;
    border-radius: 20px;
    background: #0f0f17;
    border: 1px solid #1e1e2e;
    color: #999;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .band-btn:hover { border-color: #2a2a4e; color: #ccc; }
  .band-btn.active {
    background: #00ff88;
    border-color: #00ff88;
    color: #0a0a0f;
  }
  .band-btn.active .band-range { color: rgba(10,10,15,.7); }
  .band-range {
    font-size: .68rem;
    color: #555;
    margin-left: 5px;
    font-weight: 500;
    font-family: 'SF Mono', monospace;
  }
  .custom-row {
    display: none;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .custom-row.show { display: flex; }
  .custom-row label {
    flex: 1;
    min-width: 100px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: .78rem;
    color: #888;
    font-weight: 500;
  }
  .custom-row input {
    background: #0a0a0f;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 9px 12px;
    color: #e0e0e0;
    font-size: .95rem;
    font-family: 'SF Mono', monospace;
    width: 100%;
  }
  .custom-row input:focus { outline: none; border-color: #00ff88; }
  .custom-error {
    font-size: .75rem;
    color: #ff3366;
    margin-bottom: 10px;
    display: none;
  }
  .custom-error.show { display: block; }
  .band-info {
    font-size: .82rem;
    color: #00ff88;
    background: rgba(0,255,136,.06);
    border: 1px solid rgba(0,255,136,.15);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .band-info strong { color: #00ff88; }
  .band-info .freq-range {
    font-family: 'SF Mono', monospace;
    font-weight: 700;
  }

  .button-row { display: flex; gap: 10px; margin-bottom: 14px; }
  button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  button.primary { background: #00ff88; color: #0a0a0f; flex: 1; }
  button.primary:hover:not(:disabled) { background: #00cc6a; }
  button.primary:active:not(:disabled) { transform: scale(.97); }
  button.primary:disabled { background: #1e1e2e; color: #555; cursor: not-allowed; }
  button.secondary { background: #1e1e2e; color: #ccc; flex: 1; }
  button.secondary:hover:not(:disabled) { background: #2a2a3e; }
  button.secondary:disabled { opacity: .4; cursor: not-allowed; }
  canvas {
    width: 100%;
    display: block;
    background: #0a0a0f;
    border-radius: 10px;
    border: 1px solid #1a1a2e;
  }
  .status-text {
    font-size: .8rem;
    color: #666;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background .3s;
    flex-shrink: 0;
  }
  .status-dot.active {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }
  .timer {
    font-family: 'SF Mono', 'Consolas', monospace;
    color: #00ff88;
    font-weight: 700;
    font-size: .9rem;
  }
  .live-peaks {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
    align-items: center;
  }
  .live-tag {
    background: #1a1a2e;
    border: 1px solid #2a2a4e;
    color: #00ff88;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: .75rem;
    font-family: 'SF Mono', monospace;
    font-weight: 600;
    transition: all .3s;
  }
  .live-tag.hot {
    background: #ff3366;
    border-color: #ff3366;
    color: #fff;
  }
  .report-header {
    font-size: .85rem;
    color: #888;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1a1a2e;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .report-header .band-badge {
    color: #00ff88;
    font-family: 'SF Mono', monospace;
  }
  .peak-item {
    padding: 14px;
    background: #0f0f17;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #1a1a2e;
  }
  .peak-item:last-child { margin-bottom: 0; }
  .peak-item.critical { border-color: #ff3366; }
  .peak-item.warn { border-color: #ffaa00; }
  .peak-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .peak-freq {
    font-size: 1.3rem;
    font-weight: 800;
    font-family: 'SF Mono', monospace;
    color: #ff3366;
  }
  .peak-freq.warn { color: #ffaa00; }
  .peak-freq.info { color: #00aaff; }
  .peak-db {
    font-size: .78rem;
    color: #888;
    font-family: 'SF Mono', monospace;
  }
  .persist-bar {
    height: 8px;
    background: #1a1a2e;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .persist-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .5s ease;
  }
  .peak-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .meta-chip {
    font-size: .72rem;
    padding: 3px 8px;
    border-radius: 10px;
    background: #1a1a2e;
    color: #aaa;
  }
  .meta-chip.ok { color: #00ff88; }
  .meta-chip.warn { color: #ffaa00; }
  .meta-chip.blue { color: #00aaff; }
  .meta-chip.red { color: #ff3366; }
  .peak-source {
    font-size: .82rem;
    color: #bbb;
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .peak-source strong { color: #ddd; }
  .peak-advice {
    font-size: .8rem;
    color: #777;
    line-height: 1.5;
    padding-left: 10px;
    border-left: 2px solid #2a2a4e;
  }
  .modal-grid {
    margin-top: 12px;
    padding: 12px;
    background: #0a0a0f;
    border-radius: 10px;
    border: 1px solid #1a1a2e;
  }
  .modal-title {
    font-size: .75rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .modal-row {
    display: flex;
    justify-content: space-between;
    font-size: .82rem;
    padding: 5px 0;
    border-bottom: 1px solid #15151f;
    font-family: 'SF Mono', monospace;
    gap: 8px;
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row .axis { color: #888; flex-shrink: 0; }
  .modal-row .val { color: #00ff88; text-align: right; }
  .modal-row .val.match { color: #ff3366; font-weight: 700; }
  .disclaimer {
    font-size: .75rem;
    color: #555;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #1a1a2e;
    line-height: 1.6;
  }
  .empty {
    color: #555;
    font-size: .85rem;
    text-align: center;
    padding: 20px 0;
    line-height: 1.7;
  }
  .notice {
    padding: 12px;
    background: rgba(255,170,0,.08);
    border-radius: 10px;
    border: 1px solid rgba(255,170,0,.2);
    font-size: .82rem;
    color: #ffaa00;
    line-height: 1.6;
  }
  @media (max-width: 480px) {
    body { padding: 10px; }
    h1 { font-size: 1.3rem; }
    .card { padding: 14px; }
    button { padding: 11px 16px; font-size: .9rem; }
    .peak-freq { font-size: 1.15rem; }
    .band-btn { padding: 7px 12px; font-size: .78rem; }
    .custom-row label { min-width: 80px; }
  }
</style>
</head>
<body>
<div class="container">

  <h1>🔊 全频段噪音检测</h1>
  <p class="subtitle">频段可调 · 持续性追踪 · 声源推测 · 房间驻波匹配</p>

  <!-- 步骤 1：选择频段 -->
  <section class="card">
    <h2><span class="num">1</span>选择检测频段</h2>
    <p class="hint">不同频段对应不同声源类型。不确定时先用「全频」快速扫一遍，再切到可疑频段细看。</p>

    <div class="band-grid" id="bandGrid">
      <button class="band-btn active" data-band="full">
        全频<span class="band-range">20–20k</span>
      </button>
      <button class="band-btn" data-band="low">
        低频<span class="band-range">20–200</span>
      </button>
      <button class="band-btn" data-band="mid">
        中频<span class="band-range">200–2k</span>
      </button>
      <button class="band-btn" data-band="high">
        高频<span class="band-range">2k–20k</span>
      </button>
      <button class="band-btn" data-band="human">
        人耳敏感<span class="band-range">1k–4k</span>
      </button>
      <button class="band-btn" data-band="custom">
        自定义<span class="band-range">自定</span>
      </button>
    </div>

    <div class="custom-row" id="customRow">
      <label>最低频率 (Hz)<input type="number" id="customMin" min="20" max="20000" value="20" step="1"></label>
      <label>最高频率 (Hz)<input type="number" id="customMax" min="20" max="20000" value="20000" step="1"></label>
    </div>
    <div class="custom-error" id="customError">频率范围无效：最低频率需小于最高频率，范围 20–20000 Hz。</div>

    <div class="band-info" id="bandInfo"></div>
  </section>

  <!-- 步骤 2：检测 -->
  <section class="card">
    <h2><span class="num">2</span>检测环境声音</h2>
    <p class="hint">将手机放在你听到噪音的位置（如床头），保持环境相对安静，点击开始。建议检测 20 秒以上。</p>
    <div class="status-text">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未开始检测</span>
      <span class="timer" id="timerDisplay" style="margin-left:auto">00:00</span>
    </div>
    <div class="button-row">
      <button id="startBtn" class="primary">开始检测</button>
      <button id="stopBtn" class="secondary" disabled>停止并总结</button>
    </div>
    <canvas id="spectrum"></canvas>
    <div class="live-peaks" id="livePeaks">
      <span style="color:#555;font-size:.8rem">等待检测…</span>
    </div>
  </section>

  <!-- 步骤 3：报告 -->
  <section class="card" id="reportCard" style="display:none;">
    <h2><span class="num">3</span>检测总结报告</h2>
    <div id="reportContent"></div>
  </section>

  <!-- 步骤 4：房间驻波 -->
  <section class="card" id="roomCard" style="display:none;">
    <h2><span class="num">4</span>房间驻波分析（可选）</h2>
    <p class="hint">输入房间尺寸，工具会计算房间自身容易放大的低频频率，并与检测结果比对。</p>
    <div class="custom-row show" style="display:flex;">
      <label>长（米）<input type="number" id="roomLength" step="0.01" min="1" max="30" placeholder="3.65"></label>
      <label>宽（米）<input type="number" id="roomWidth" step="0.01" min="1" max="30" placeholder="4.20"></label>
      <label>高（米）<input type="number" id="roomHeight" step="0.01" min="1" max="10" placeholder="3.10"></label>
    </div>
    <button id="analyzeBtn" class="primary" disabled>分析房间驻波</button>
    <div id="roomResult"></div>
  </section>

</div>

<script>
(function() {
  'use strict';

  // ==================== 频段定义 ====================
  var FREQ_BANDS = {
    full:   { label: '全频',     min: 20,   max: 20000, desc: '手机能检测的全部频率。适合初次排查，快速了解环境中有哪些突出的声音。' },
    low:    { label: '低频',     min: 20,   max: 200,   desc: '低频嗡鸣、驻波、变压器、水泵、电梯、工厂设备等。视频案例中的 47Hz 就在这个区间。' },
    mid:    { label: '中频',     min: 200,  max: 2000,  desc: '人声、环境噪音、家电、管道共振等。' },
    high:   { label: '高频',     min: 2000, max: 20000, desc: '电子设备啸叫、报警器、开关电源、金属摩擦、蚊虫等。' },
    human:  { label: '人耳敏感', min: 1000, max: 4000,  desc: '人耳最敏感的频率范围。这个区间的声音会让人觉得特别刺耳。' },
    custom: { label: '自定义',   min: 20,   max: 20000, desc: '自定义频率范围，最小 20Hz，最大 20000Hz。' }
  };

  var HARD_MIN = 20;
  var HARD_MAX = 20000;

  // ==================== DOM ====================
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var analyzeBtn = document.getElementById('analyzeBtn');
  var canvas = document.getElementById('spectrum');
  var ctx = canvas.getContext('2d');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var timerDisplay = document.getElementById('timerDisplay');
  var livePeaks = document.getElementById('livePeaks');
  var reportCard = document.getElementById('reportCard');
  var reportContent = document.getElementById('reportContent');
  var roomCard = document.getElementById('roomCard');
  var roomResult = document.getElementById('roomResult');
  var bandGrid = document.getElementById('bandGrid');
  var customRow = document.getElementById('customRow');
  var customMin = document.getElementById('customMin');
  var customMax = document.getElementById('customMax');
  var customError = document.getElementById('customError');
  var bandInfo = document.getElementById('bandInfo');

  // ==================== 状态 ====================
  var currentBand = 'full';
  var freqMin = 20;
  var freqMax = 20000;

  var audioContext = null;
  var analyser = null;
  var source = null;
  var stream = null;
  var isRunning = false;
  var animationId = null;
  var timerInterval = null;
  var detectionStartTime = 0;

  var latestSpectrum = null;
  var latestSampleRate = 0;
  var latestFftSize = 0;
  var latestPeaks = [];

  var trackedPeaks = [];
  var totalFrames = 0;

  var lastAnalysisTime = 0;
  var lastPeakDisplayTime = 0;

  var canvasW = 0, canvasH = 0;

  var lastElapsed = 0; // 用于切换频段时重渲染报告

  // ==================== 事件 ====================
  startBtn.addEventListener('click', startDetection);
  stopBtn.addEventListener('click', stopDetection);
  analyzeBtn.addEventListener('click', analyzeRoom);
  ['roomLength', 'roomWidth', 'roomHeight'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', updateAnalyzeBtn);
  });
  window.addEventListener('resize', function() {
    resizeCanvas();
    if (!isRunning && latestSpectrum) drawSpectrum();
  });

  // 频段按钮
  bandGrid.addEventListener('click', function(e) {
    var btn = e.target.closest('.band-btn');
    if (!btn) return;
    setBand(btn.dataset.band);
  });

  // 自定义频率输入
  customMin.addEventListener('input', onCustomChange);
  customMax.addEventListener('input', onCustomChange);

  // ==================== 频段切换 ====================
  function setBand(bandKey) {
    if (!FREQ_BANDS[bandKey]) return;

    // 更新按钮状态
    var btns = bandGrid.querySelectorAll('.band-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].dataset.band === bandKey);
    }

    currentBand = bandKey;

    // 显示/隐藏自定义输入
    customRow.classList.toggle('show', bandKey === 'custom');

    if (bandKey === 'custom') {
      onCustomChange();
      return;
    }

    // 使用预设频段
    var b = FREQ_BANDS[bandKey];
    freqMin = b.min;
    freqMax = b.max;
    customError.classList.remove('show');
    updateBandInfo();

    // 如果已有报告，重新渲染
    if (!isRunning && totalFrames > 0) {
      var summarized = summarizePeaks(totalFrames);
      renderReport(summarized, lastElapsed);
    }
    // 重绘画布
    if (!isRunning && latestSpectrum) drawSpectrum();
  }

  function onCustomChange() {
    var minV = parseFloat(customMin.value);
    var maxV = parseFloat(customMax.value);
    var valid = true;
    var errMsg = '';

    if (isNaN(minV) || isNaN(maxV)) {
      valid = false;
      errMsg = '请输入有效的数字。';
    } else if (minV < HARD_MIN || minV > HARD_MAX || maxV < HARD_MIN || maxV > HARD_MAX) {
      valid = false;
      errMsg = '频率范围需在 ' + HARD_MIN + '–' + HARD_MAX + ' Hz 之间。';
    } else if (minV >= maxV) {
      valid = false;
      errMsg = '最低频率必须小于最高频率。';
    } else if (maxV / minV < 1.05) {
      valid = false;
      errMsg = '频率范围太窄，至少需要 5% 的跨度。';
    }

    if (!valid) {
      customError.textContent = errMsg;
      customError.classList.add('show');
      return;
    }
    customError.classList.remove('show');

    freqMin = minV;
    freqMax = maxV;
    updateBandInfo();

    if (!isRunning && totalFrames > 0) {
      var summarized = summarizePeaks(totalFrames);
      renderReport(summarized, lastElapsed);
    }
    if (!isRunning && latestSpectrum) drawSpectrum();
  }

  function updateBandInfo() {
    var b = FREQ_BANDS[currentBand];
    var rangeText;
    if (currentBand === 'custom') {
      rangeText = freqMin + ' – ' + freqMax + ' Hz';
    } else {
      rangeText = b.min + ' – ' + b.max + ' Hz';
    }
    bandInfo.innerHTML =
      '<strong>' + b.label + '：</strong>' +
      '<span class="freq-range">' + rangeText + '</span><br>' +
      b.desc;
  }

  // ==================== 画布尺寸 ====================
  function resizeCanvas() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var w = Math.floor(rect.width - 36);
    if (w < 100) w = 300;
    var h = 260;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvasW = w;
    canvasH = h;
  }

  // ==================== 频率 → X 坐标 ====================
  function freqToX(freq, W) {
    var lmin = Math.log10(freqMin);
    var lmax = Math.log10(freqMax);
    return ((Math.log10(freq) - lmin) / (lmax - lmin)) * W;
  }

  // ==================== 开始检测 ====================
  async function startDetection() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('您的浏览器不支持麦克风访问。\n\n请使用最新版 Chrome / Edge / Safari，并确保通过 HTTPS 访问。');
      return;
    }

    // 自定义频段先校验
    if (currentBand === 'custom' && customError.classList.contains('show')) {
      alert('自定义频率范围有误，请修正后再开始检测。');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 32768;
      analyser.smoothingTimeConstant = 0.75;
      source.connect(analyser);

      trackedPeaks = [];
      totalFrames = 0;
      latestSpectrum = null;
      latestPeaks = [];
      reportCard.style.display = 'none';
      roomCard.style.display = 'none';
      roomResult.innerHTML = '';

      isRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      analyzeBtn.disabled = true;
      statusDot.classList.add('active');
      statusText.textContent = '检测中…（' + FREQ_BANDS[currentBand].label + '）';
      timerDisplay.textContent = '00:00';

      detectionStartTime = performance.now();
      lastAnalysisTime = 0;
      lastPeakDisplayTime = 0;

      timerInterval = setInterval(function() {
        var elapsed = (performance.now() - detectionStartTime) / 1000;
        lastElapsed = elapsed;
        var m = Math.floor(elapsed / 60);
        var s = Math.floor(elapsed % 60);
        timerDisplay.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }, 250);

      resizeCanvas();
      loop(performance.now());
    } catch (err) {
      alert('无法访问麦克风：' + (err.message || '未知错误') +
        '\n\n请确保：\n1. 使用 HTTPS 访问\n2. 允许浏览器麦克风权限');
    }
  }

  // ==================== 主循环 ====================
  function loop(timestamp) {
    if (!isRunning) return;

    if (timestamp - lastAnalysisTime > 50) {
      analyzeFrame();
      lastAnalysisTime = timestamp;
    }
    if (timestamp - lastPeakDisplayTime > 250) {
      updateLivePeakDisplay();
      lastPeakDisplayTime = timestamp;
    }

    drawSpectrum();
    animationId = requestAnimationFrame(loop);
  }

  // ==================== 单帧分析 ====================
  function analyzeFrame() {
    if (!analyser || !audioContext) return;

    var data = new Float32Array(analyser.frequencyBinCount);
    analyser.getFloatFrequencyData(data);

    latestSpectrum = data;
    latestSampleRate = audioContext.sampleRate;
    latestFftSize = analyser.fftSize;

    var peaks = detectPeaks(data, latestSampleRate, latestFftSize);
    latestPeaks = peaks;
    totalFrames++;
    trackPeaks(peaks, totalFrames);

    if (totalFrames % 400 === 0) {
      trackedPeaks = trackedPeaks.filter(function(t) {
        return totalFrames - t.lastSeen < 150;
      });
    }
  }

  // ==================== 峰值检测（限定当前频段） ====================
  function detectPeaks(data, sampleRate, fftSize) {
    var freqPerBin = sampleRate / fftSize;
    var minBin = Math.max(1, Math.floor(freqMin / freqPerBin));
    var maxBin = Math.min(data.length - 2, Math.ceil(freqMax / freqPerBin));

    if (maxBin <= minBin) return [];

    var sum = 0, count = 0;
    for (var i = minBin; i <= maxBin; i++) {
      if (isFinite(data[i])) { sum += data[i]; count++; }
    }
    if (count === 0) return [];
    var mean = sum / count;
    var threshold = mean + 7;

    var peaks = [];
    for (var j = minBin + 1; j < maxBin; j++) {
      var prev = data[j - 1];
      var curr = data[j];
      var next = data[j + 1];
      if (!isFinite(prev) || !isFinite(curr) || !isFinite(next)) continue;

      if (curr > prev && curr > next && curr > threshold) {
        var denom = prev - 2 * curr + next;
        var delta = denom !== 0 ? 0.5 * (prev - next) / denom : 0;
        var freq = (j + delta) * freqPerBin;
        if (freq >= freqMin && freq <= freqMax) {
          peaks.push({ freq: freq, level: curr });
        }
      }
    }

    return peaks.sort(function(a, b) { return b.level - a.level; }).slice(0, 8);
  }

  // ==================== 跨帧峰值追踪 ====================
  function trackPeaks(peaks, frameIndex) {
    peaks.forEach(function(p) {
      var merged = false;
      for (var i = 0; i < trackedPeaks.length; i++) {
        var t = trackedPeaks[i];
        if (Math.abs(Math.log(p.freq / t.freq)) < 0.02) {
          t.count++;
          t.totalLevel += p.level;
          if (p.level > t.maxLevel) t.maxLevel = p.level;
          t.lastSeen = frameIndex;
          t.freq = (t.freq * (t.count - 1) + p.freq) / t.count;
          merged = true;
          break;
        }
      }
      if (!merged) {
        trackedPeaks.push({
          freq: p.freq,
          count: 1,
          totalLevel: p.level,
          maxLevel: p.level,
          firstSeen: frameIndex,
          lastSeen: frameIndex
        });
      }
    });
  }

  // ==================== 实时峰值显示 ====================
  function updateLivePeakDisplay() {
    if (latestPeaks.length === 0) {
      livePeaks.innerHTML = '<span style="color:#555;font-size:.8rem">当前频段未检测到明显峰值…</span>';
      return;
    }
    var html = '';
    for (var i = 0; i < Math.min(4, latestPeaks.length); i++) {
      var p = latestPeaks[i];
      var cls = i === 0 ? 'live-tag hot' : 'live-tag';
      var label = p.freq < 100 ? p.freq.toFixed(1) : p.freq.toFixed(0);
      html += '<span class="' + cls + '">' + label + ' Hz</span>';
    }
    livePeaks.innerHTML = html;
  }

  // ==================== 绘制频谱 ====================
  function drawSpectrum() {
    if (!latestSpectrum || !canvasW) return;

    var W = canvasW;
    var H = canvasH;
    var data = latestSpectrum;
    var freqPerBin = latestSampleRate / latestFftSize;
    var minBin = Math.max(1, Math.floor(freqMin / freqPerBin));
    var maxBin = Math.min(data.length - 1, Math.ceil(freqMax / freqPerBin));
    var lmin = Math.log10(freqMin);
    var lmax = Math.log10(freqMax);

    // dB 范围
    var maxDb = -Infinity, minDb = Infinity;
    for (var i = minBin; i <= maxBin; i++) {
      var d = data[i];
      if (isFinite(d)) {
        if (d > maxDb) maxDb = d;
        if (d < minDb) minDb = d;
      }
    }
    if (!isFinite(maxDb)) { maxDb = -20; minDb = -100; }
    var dbRange = Math.max(maxDb - minDb, 40);
    var topDb = maxDb + 5;
    var bottomDb = topDb - dbRange;

    // 背景
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // 网格
    var gridFreqs = [20, 30, 50, 70, 100, 150, 200, 300, 500, 700, 1000, 1500,
                     2000, 3000, 5000, 7000, 10000, 15000, 20000];
    ctx.strokeStyle = '#15151f';
    ctx.lineWidth = 1;
    ctx.font = '9px monospace';
    ctx.fillStyle = '#444';
    ctx.textAlign = 'center';

    var labelCount = 0;
    for (var g = 0; g < gridFreqs.length; g++) {
      var f = gridFreqs[g];
      if (f < freqMin || f > freqMax) continue;
      var x = ((Math.log10(f) - lmin) / (lmax - lmin)) * W;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H - 16);
      ctx.stroke();
      // 避免标签太挤
      if (labelCount % 1 === 0) {
        var label = f >= 1000 ? (f / 1000) + 'k' : f + '';
        ctx.fillText(label, x, H - 4);
      }
      labelCount++;
    }

    // 频谱曲线
    ctx.beginPath();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    var started = false;
    for (var k = minBin; k <= maxBin; k++) {
      var db = data[k];
      if (!isFinite(db)) continue;
      var freq = k * freqPerBin;
      if (freq < freqMin) continue;
      var px = ((Math.log10(freq) - lmin) / (lmax - lmin)) * W;
      var py = (H - 16) - ((db - bottomDb) / dbRange) * (H - 16);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else { ctx.lineTo(px, py); }
    }
    ctx.stroke();

    // 渐变填充
    if (started) {
      ctx.lineTo(W, H - 16);
      ctx.lineTo(0, H - 16);
      ctx.closePath();
      var grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, 'rgba(0,255,136,0.12)');
      grad.addColorStop(1, 'rgba(0,255,136,0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 峰值标记
    for (var m = 0; m < Math.min(3, latestPeaks.length); m++) {
      var pk = latestPeaks[m];
      var mx = ((Math.log10(pk.freq) - lmin) / (lmax - lmin)) * W;
      var my = (H - 16) - ((pk.level - bottomDb) / dbRange) * (H - 16);

      ctx.beginPath();
      ctx.arc(mx, my, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = m === 0 ? '#ff3366' : '#ffaa00';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      var pLabel = pk.freq < 100 ? pk.freq.toFixed(1) : pk.freq.toFixed(0);
      pLabel += 'Hz';
      ctx.fillStyle = m === 0 ? '#ff3366' : '#ffaa00';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'left';
      var lx = Math.min(mx + 7, W - 55);
      ctx.fillText(pLabel, lx, my - 7);
    }
    ctx.textAlign = 'left';
  }

  // ==================== 停止 & 报告 ====================
  function stopDetection() {
    isRunning = false;

    if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
    if (audioContext) { audioContext.close(); audioContext = null; analyser = null; }

    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusDot.classList.remove('active');
    statusText.textContent = '检测结束';

    var summarized = summarizePeaks(totalFrames);
    renderReport(summarized, lastElapsed);

    reportCard.style.display = 'block';
    roomCard.style.display = 'block';

    setTimeout(function() {
      reportCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }

  // ==================== 峰值总结（只保留当前频段内） ====================
  function summarizePeaks(total) {
    if (total === 0) return [];

    return trackedPeaks
      .filter(function(t) {
        return t.freq >= freqMin && t.freq <= freqMax;
      })
      .filter(function(t) {
        return t.count >= total * 0.05 || t.count >= 5;
      })
      .map(function(t) {
        return {
          freq: t.freq,
          persistence: t.count / total,
          avgLevel: t.totalLevel / t.count,
          maxLevel: t.maxLevel,
          count: t.count
        };
      })
      .sort(function(a, b) {
        var scoreA = a.persistence * 2 + (a.avgLevel + 100) / 100;
        var scoreB = b.persistence * 2 + (b.avgLevel + 100) / 100;
        return scoreB - scoreA;
      })
      .slice(0, 6);
  }

  // ==================== 声源推测 ====================
  function getSourceInfo(freq) {
    // 次声 / 极低频
    if (freq < 25) return {
      category: '次声 / 极低频', color: 'blue',
      possible: ['大型工业设备', '地震活动', '极端天气', '远处爆炸'],
      advice: '普通人难以控制，建议专业检测'
    };
    // 超低频
    if (freq < 40) return {
      category: '超低频', color: 'blue',
      possible: ['工厂重型机械', '大型压缩机', '远处空调主机', '地铁/铁路'],
      advice: '穿透力极强，需专业隔声处理'
    };
    // 47Hz 左右
    if (freq < 60) return {
      category: '低频嗡鸣', color: 'red',
      possible: ['变压器', '水泵', '电梯', '工厂设备', '房间驻波放大'],
      advice: '常见于变压器/水泵，也可能是房间驻波。先排查设备，再测房间尺寸'
    };
    if (freq < 100) return {
      category: '低频', color: 'orange',
      possible: ['空调外机', '冰箱', '风扇', '水泵', '汽车发动机'],
      advice: '常见家电频率。关闭可疑设备逐个排查'
    };
    if (freq < 200) return {
      category: '中低频', color: 'orange',
      possible: ['空调', '风扇', '电机', '管道共振', '低音音箱'],
      advice: '检查空调、风扇、管道固定情况'
    };
    if (freq < 500) return {
      category: '中频', color: 'green',
      possible: ['家电', '风扇', '电机', '人声基频', '环境噪音'],
      advice: '一般环境噪音，注意是否持续'
    };
    if (freq < 1000) return {
      category: '中高频', color: 'green',
      possible: ['说话声', '电视', '一般环境噪声', '乐器'],
      advice: '通常是正常生活声音'
    };
    if (freq < 2000) return {
      category: '中高频', color: 'green',
      possible: ['人声', '电话铃声', '乐器泛音', '环境噪声'],
      advice: '正常生活声音居多'
    };
    if (freq < 4000) return {
      category: '人耳敏感', color: 'blue',
      possible: ['婴儿哭闹', '报警器', '高音喇叭', '金属尖锐声', '电话铃声'],
      advice: '人耳最敏感范围，容易感到刺耳，检查附近声源'
    };
    if (freq < 6000) return {
      category: '高频', color: 'blue',
      possible: ['电子设备啸叫', '金属摩擦', '蟋蟀', '鸟鸣', '开关电源'],
      advice: '检查附近电子设备、机械摩擦'
    };
    if (freq < 10000) return {
      category: '高频', color: 'blue',
      possible: ['开关电源', '电子噪声', '老式显示器', '蚊虫', '金属摩擦'],
      advice: '检查电子设备、开关电源'
    };
    if (freq < 16000) return {
      category: '超高频', color: 'blue',
      possible: ['开关电源啸叫', '电子干扰', '蚊虫', '高频电子噪声'],
      advice: '多为电子设备产生，检查附近电源和电子产品'
    };
    return {
      category: '超声波边缘', color: 'blue',
      possible: ['驱鼠器', '超声波设备', '电子干扰', '蝙蝠'],
      advice: '可能来自驱鼠器、超声波设备，检查电子设备'
    };
  }

  // ==================== 渲染报告 ====================
  function renderReport(peaks, elapsed) {
    var bandLabel = FREQ_BANDS[currentBand].label;
    var rangeText = freqMin + '–' + freqMax + ' Hz';

    if (totalFrames === 0) {
      reportContent.innerHTML = '<div class="empty">还没有检测数据。<br>请先完成一次检测。</div>';
      return;
    }

    if (peaks.length === 0) {
      reportContent.innerHTML =
        '<div class="report-header">' +
          '<span>频段：<span class="band-badge">' + bandLabel + '（' + rangeText + '）</span></span>' +
          '<span>时长：<strong style="color:#00ff88">' + elapsed.toFixed(1) + ' 秒</strong></span>' +
        '</div>' +
        '<div class="empty">当前频段内未检测到持续性的明显峰值。<br><br>' +
        '可以尝试：<br>' +
        '· 切换到「全频」看整体情况<br>' +
        '· 换到其他频段再检测<br>' +
        '· 将手机放到更靠近声源的位置</div>';
      return;
    }

    var html = '';
    html += '<div class="report-header">';
    html += '<span>频段：<span class="band-badge">' + bandLabel + '（' + rangeText + '）</span></span>';
    html += '<span>时长 <strong style="color:#00ff88">' + elapsed.toFixed(1) + 's</strong> · 帧 ' + totalFrames + '</span>';
    html += '</div>';

    for (var i = 0; i < peaks.length; i++) {
      var p = peaks[i];
      var info = getSourceInfo(p.freq);
      var persistPct = Math.round(p.persistence * 100);

      var itemClass = 'peak-item';
      var freqClass = 'peak-freq';
      if (persistPct >= 70) { itemClass += ' critical'; freqClass = 'peak-freq'; }
      else if (persistPct >= 35) { itemClass += ' warn'; freqClass = 'peak-freq warn'; }
      else { freqClass = 'peak-freq info'; }

      var barColor = persistPct >= 70 ? '#ff3366' : (persistPct >= 35 ? '#ffaa00' : '#00aaff');
      var freqLabel = p.freq < 100 ? p.freq.toFixed(1) : p.freq.toFixed(0);

      html += '<div class="' + itemClass + '">';
      html += '<div class="peak-top">';
      html += '<span class="' + freqClass + '">' + freqLabel + ' Hz</span>';
      html += '<span class="peak-db">平均 ' + p.avgLevel.toFixed(1) + ' dB · 峰值 ' + p.maxLevel.toFixed(1) + ' dB</span>';
      html += '</div>';

      html += '<div class="persist-bar"><div class="persist-fill" style="width:' + persistPct + '%;background:' + barColor + '"></div></div>';

      html += '<div class="peak-meta">';
      html += '<span class="meta-chip ' + (persistPct >= 70 ? 'warn' : 'ok') + '">持续性 ' + persistPct + '%</span>';
      html += '<span class="meta-chip ' + info.color + '">' + info.category + '</span>';
      html += '<span class="meta-chip">出现 ' + p.count + ' 次</span>';
      html += '</div>';

      html += '<div class="peak-source"><strong>可能声源：</strong>' + info.possible.join('、') + '</div>';
      html += '<div class="peak-advice">' + info.advice + '</div>';
      html += '</div>';
    }

    html += '<div class="disclaimer">' +
      '⚠️ 本工具仅供初步排查参考。手机麦克风在 50Hz 以下衰减严重，结果不能替代专业声级计。' +
      '如需法律用途，请委托专业机构检测。' +
      '</div>';

    reportContent.innerHTML = html;
  }

  // ==================== 房间驻波分析 ====================
  function updateAnalyzeBtn() {
    var L = parseFloat(document.getElementById('roomLength').value);
    var W = parseFloat(document.getElementById('roomWidth').value);
    var H = parseFloat(document.getElementById('roomHeight').value);
    analyzeBtn.disabled = !(L > 0 && W > 0 && H > 0 && trackedPeaks.length > 0);
  }

  function calcRoomModes(L, W, H) {
    var c = 343;
    var modes = [];
    for (var n = 1; n <= 6; n++) {
      var fL = n * c / (2 * L);
      var fW = n * c / (2 * W);
      var fH = n * c / (2 * H);
      if (fL <= 200) modes.push({ freq: fL, axis: '长', dim: L, n: n });
      if (fW <= 200) modes.push({ freq: fW, axis: '宽', dim: W, n: n });
      if (fH <= 200) modes.push({ freq: fH, axis: '高', dim: H, n: n });
    }
    return modes.sort(function(a, b) { return a.freq - b.freq; });
  }

  function analyzeRoom() {
    var L = parseFloat(document.getElementById('roomLength').value);
    var W = parseFloat(document.getElementById('roomWidth').value);
    var H = parseFloat(document.getElementById('roomHeight').value);
    if (!L || !W || !H) return;

    // 房间驻波只对低频有意义
    if (freqMin > 200) {
      roomResult.innerHTML = '<div class="notice">房间驻波分析只对 200Hz 以下的低频有意义。' +
        '当前频段（' + FREQ_BANDS[currentBand].label + '）不包含低频范围。' +
        '请切换到「低频」或「全频」后再进行分析。</div>';
      return;
    }

    var modes = calcRoomModes(L, W, H);

    var lowPeaks = trackedPeaks
      .filter(function(t) {
        return t.freq >= 20 && t.freq <= 200 &&
               t.freq >= freqMin && t.freq <= freqMax &&
               (t.count >= totalFrames * 0.05 || t.count >= 5);
      })
      .map(function(t) {
        return {
          freq: t.freq,
          persistence: t.count / totalFrames,
          avgLevel: t.totalLevel / t.count
        };
      })
      .sort(function(a, b) { return b.persistence - a.persistence; })
      .slice(0, 4);

    if (lowPeaks.length === 0) {
      roomResult.innerHTML = '<div class="empty">当前频段内未检测到 20–200Hz 的持续低频峰值，无法与房间驻波匹配。<br>请切换到「低频」或「全频」重新检测。</div>';
      return;
    }

    var html = '<div class="modal-grid">';
    html += '<div class="modal-title">房间尺寸与驻波频率</div>';
    html += '<div class="modal-row"><span class="axis">长度 ' + L.toFixed(2) + ' m</span><span class="val">' +
      modes.filter(function(m) { return m.axis === '长'; }).map(function(m) { return m.freq.toFixed(1) + 'Hz(' + m.n + '次)'; }).join(' / ') +
      '</span></div>';
    html += '<div class="modal-row"><span class="axis">宽度 ' + W.toFixed(2) + ' m</span><span class="val">' +
      modes.filter(function(m) { return m.axis === '宽'; }).map(function(m) { return m.freq.toFixed(1) + 'Hz(' + m.n + '次)'; }).join(' / ') +
      '</span></div>';
    html += '<div class="modal-row"><span class="axis">高度 ' + H.toFixed(2) + ' m</span><span class="val">' +
      modes.filter(function(m) { return m.axis === '高'; }).map(function(m) { return m.freq.toFixed(1) + 'Hz(' + m.n + '次)'; }).join(' / ') +
      '</span></div>';
    html += '</div>';

    html += '<div class="modal-grid" style="margin-top:10px;">';
    html += '<div class="modal-title">检测峰值与驻波匹配</div>';

    var matchedCount = 0;
    for (var i = 0; i < lowPeaks.length; i++) {
      var p = lowPeaks[i];
      var best = null;
      var bestDiff = Infinity;
      for (var j = 0; j < modes.length; j++) {
        var diff = Math.abs(p.freq - modes[j].freq);
        if (diff < bestDiff) { bestDiff = diff; best = modes[j]; }
      }
      var isMatch = bestDiff < 2.5;
      if (isMatch) matchedCount++;
      var matchText = isMatch
        ? '✅ 匹配 ' + best.axis + '度 ' + best.n + '次驻波（' + best.freq.toFixed(1) + 'Hz）'
        : '❌ 未匹配，可能来自外部声源';

      html += '<div class="modal-row">';
      html += '<span class="axis">' + p.freq.toFixed(1) + ' Hz（持续性 ' + Math.round(p.persistence * 100) + '%）</span>';
      html += '<span class="val' + (isMatch ? ' match' : '') + '">' + matchText + '</span>';
      html += '</div>';
    }
    html += '</div>';

    if (matchedCount > 0) {
      html += '<div style="margin-top:12px;padding:12px;background:rgba(255,51,102,.08);border-radius:10px;border:1px solid rgba(255,51,102,.2);">';
      html += '<div style="color:#ff3366;font-weight:700;font-size:.85rem;margin-bottom:4px;">🔊 房间驻波可能正在放大声音</div>';
      html += '<div style="font-size:.82rem;color:#bbb;line-height:1.6;">检测到的低频峰值与房间尺寸产生的驻波频率吻合。驻波是声波在两面墙之间来回反射、叠加增强的现象，会导致房间某些位置声音特别大（比如贴墙的床头），换个位置就减弱。</div>';
      html += '</div>';
    } else {
      html += '<div style="margin-top:12px;padding:12px;background:rgba(0,170,255,.08);border-radius:10px;border:1px solid rgba(0,170,255,.2);">';
      html += '<div style="color:#00aaff;font-weight:700;font-size:.85rem;margin-bottom:4px;">📡 峰值与房间驻波不吻合</div>';
      html += '<div style="font-size:.82rem;color:#bbb;line-height:1.6;">检测到的低频峰值与当前房间尺寸的驻波频率不匹配。声音更可能来自外部声源，建议拿着手机往不同方向走动，观察哪个方向声音变强。</div>';
      html += '</div>';
    }

    roomResult.innerHTML = html;
  }

  // ==================== 初始化 ====================
  resizeCanvas();
  updateBandInfo();

})();
</script>
</body>
</html>
