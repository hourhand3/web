<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>低频噪音检测助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    line-height: 1.6;
    padding: 16px;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 6px;
    color: #00ff88;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: #777;
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .card {
    background: #12121a;
    border: 1px solid #1e1e2e;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 {
    font-size: 1.1rem;
    margin-bottom: 6px;
    color: #00ff88;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2 .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: #00ff88;
    color: #0a0a0f;
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .hint {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .button-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  button {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary {
    background: #00ff88;
    color: #0a0a0f;
    flex: 1;
  }
  button.primary:hover:not(:disabled) { background: #00cc6a; }
  button.primary:active:not(:disabled) { transform: scale(0.97); }
  button.primary:disabled {
    background: #1e1e2e;
    color: #555;
    cursor: not-allowed;
  }
  button.secondary {
    background: #1e1e2e;
    color: #ccc;
    flex: 1;
  }
  button.secondary:hover:not(:disabled) { background: #2a2a3e; }
  button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }
  canvas {
    width: 100%;
    height: auto;
    background: #0a0a0f;
    border-radius: 10px;
    border: 1px solid #1a1a2e;
    display: block;
  }
  .peaks-display {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 30px;
    align-items: center;
  }
  .peak-tag {
    background: #ff3366;
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: 'SF Mono', monospace;
    font-weight: 600;
    animation: pulse 0.6s ease;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }
  .input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .input-row label {
    flex: 1;
    min-width: 90px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
    color: #888;
    font-weight: 500;
  }
  .input-row input {
    background: #0a0a0f;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e0e0e0;
    font-size: 1rem;
    font-family: inherit;
    width: 100%;
    transition: border-color 0.2s;
  }
  .input-row input:focus {
    outline: none;
    border-color: #00ff88;
  }
  .input-row input::placeholder { color: #444; }
  .result-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffaa00;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .result-desc {
    color: #bbb;
    margin-bottom: 16px;
    line-height: 1.7;
    font-size: 0.92rem;
  }
  .match-box {
    margin: 16px 0;
    padding: 14px;
    background: #0a0a0f;
    border-radius: 10px;
    border: 1px solid #1a1a2e;
  }
  .match-box-title {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .match-detail {
    font-size: 0.85rem;
    color: #aaa;
    padding: 6px 0;
    border-bottom: 1px solid #15151f;
    line-height: 1.5;
  }
  .match-detail:last-child { border-bottom: none; }
  .match-detail .freq {
    color: #ff3366;
    font-family: 'SF Mono', monospace;
    font-weight: 700;
  }
  .match-detail .ok { color: #00ff88; }
  .match-detail .no { color: #ffaa00; }
  .suggestions {
    list-style: none;
    padding: 0;
    margin: 8px 0 0 0;
  }
  .suggestions li {
    padding: 10px 0;
    border-bottom: 1px solid #1a1a2e;
    color: #ccc;
    font-size: 0.9rem;
    line-height: 1.6;
    display: flex;
    gap: 8px;
  }
  .suggestions li:last-child { border-bottom: none; }
  .suggestions li::before {
    content: '→';
    color: #00ff88;
    font-weight: 700;
    flex-shrink: 0;
  }
  .disclaimer {
    font-size: 0.78rem;
    color: #555;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #1a1a2e;
    line-height: 1.6;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    margin-right: 6px;
    transition: background 0.3s;
  }
  .status-dot.active {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status-text {
    font-size: 0.8rem;
    color: #666;
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  @media (max-width: 480px) {
    body { padding: 12px; }
    h1 { font-size: 1.35rem; }
    .card { padding: 16px; }
    button { padding: 11px 18px; font-size: 0.9rem; }
    .input-row label { min-width: 70px; }
  }
</style>
</head>
<body>
<div class="container">

  <h1>🔊 低频噪音检测助手</h1>
  <p class="subtitle">用手机检测房间低频嗡鸣，结合房间尺寸找出问题源头</p>

  <!-- 步骤 1：检测 -->
  <section class="card">
    <h2><span class="num">1</span>检测低频噪音</h2>
    <p class="hint">将手机放在你听到嗡鸣声的位置（比如床头），保持安静，点击开始检测。等待 10–20 秒让数据稳定。</p>
    <div class="status-text">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未开始检测</span>
    </div>
    <div class="button-row">
      <button id="startBtn" class="primary">开始检测</button>
      <button id="stopBtn" class="secondary" disabled>停止</button>
    </div>
    <canvas id="spectrum" width="800" height="300"></canvas>
    <div id="peaksDisplay" class="peaks-display">
      <span style="color:#555;font-size:0.85rem">等待检测…</span>
    </div>
  </section>

  <!-- 步骤 2：房间尺寸 -->
  <section class="card">
    <h2><span class="num">2</span>输入房间尺寸</h2>
    <p class="hint">用卷尺测量房间的长、宽、高（单位：米）。这是计算驻波的关键。</p>
    <div class="input-row">
      <label>长（米）<input type="number" id="roomLength" step="0.01" min="1" max="30" placeholder="例如 3.65"></label>
      <label>宽（米）<input type="number" id="roomWidth" step="0.01" min="1" max="30" placeholder="例如 4.20"></label>
      <label>高（米）<input type="number" id="roomHeight" step="0.01" min="1" max="10" placeholder="例如 3.10"></label>
    </div>
    <button id="analyzeBtn" class="primary" disabled>分析</button>
  </section>

  <!-- 步骤 3：结果 -->
  <section class="card" id="resultCard" style="display:none;">
    <h2><span class="num">3</span>分析结果</h2>
    <div id="resultContent"></div>
  </section>

</div>

<script>
(function() {
  'use strict';

  // ========== DOM ==========
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var analyzeBtn = document.getElementById('analyzeBtn');
  var peaksDisplay = document.getElementById('peaksDisplay');
  var canvas = document.getElementById('spectrum');
  var ctx = canvas.getContext('2d');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');

  // ========== 状态 ==========
  var audioContext = null;
  var analyser = null;
  var source = null;
  var stream = null;
  var isRunning = false;
  var currentPeaks = [];
  var savedPeaks = [];
  var savedSampleRate = 0;
  var savedFftSize = 0;
  var animationId = null;
  var lastPeakUpdate = 0;

  // 频率范围（Hz）
  var MIN_FREQ = 20;
  var MAX_FREQ = 200;

  // ========== 事件 ==========
  startBtn.addEventListener('click', startDetection);
  stopBtn.addEventListener('click', stopDetection);
  analyzeBtn.addEventListener('click', analyze);
  ['roomLength', 'roomWidth', 'roomHeight'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', updateAnalyzeButton);
  });

  // ========== 开始检测 ==========
  async function startDetection() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('您的浏览器不支持麦克风访问。\n\n请使用最新版 Chrome / Edge / Safari，并确保通过 HTTPS 访问。');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();

      source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 32768;
      analyser.smoothingTimeConstant = 0.8;
      source.connect(analyser);

      savedSampleRate = audioContext.sampleRate;
      savedFftSize = analyser.fftSize;

      isRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      analyzeBtn.disabled = true;

      statusDot.classList.add('active');
      statusText.textContent = '检测中… 请保持安静';

      draw();
    } catch (err) {
      var msg = err.message || '未知错误';
      alert('无法访问麦克风：' + msg + '\n\n请确保：\n1. 使用 HTTPS 访问\n2. 允许浏览器麦克风权限');
    }
  }

  // ========== 停止检测 ==========
  function stopDetection() {
    isRunning = false;

    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    if (stream) {
      stream.getTracks().forEach(function(t) { t.stop(); });
      stream = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }

    savedPeaks = currentPeaks.slice();

    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusDot.classList.remove('active');
    statusText.textContent = savedPeaks.length > 0
      ? '检测已停止，检测到 ' + savedPeaks.length + ' 个低频峰值'
      : '检测已停止，未检测到明显峰值';

    updateAnalyzeButton();
  }

  // ========== 绘制循环 ==========
  function draw() {
    if (!isRunning || !analyser) return;

    var data = new Float32Array(analyser.frequencyBinCount);
    analyser.getFloatFrequencyData(data);

    var peaks = detectPeaks(data, savedSampleRate, savedFftSize);
    currentPeaks = peaks;

    drawSpectrum(data, savedSampleRate, savedFftSize, peaks);

    var now = performance.now();
    if (now - lastPeakUpdate > 120) {
      updatePeaksDisplay(peaks);
      lastPeakUpdate = now;
    }

    animationId = requestAnimationFrame(draw);
  }

  // ========== 峰值检测 ==========
  function detectPeaks(data, sampleRate, fftSize) {
    var freqPerBin = sampleRate / fftSize;
    var minBin = Math.max(1, Math.floor(MIN_FREQ / freqPerBin));
    var maxBin = Math.min(data.length - 2, Math.ceil(MAX_FREQ / freqPerBin));

    var values = [];
    for (var i = minBin; i <= maxBin; i++) {
      var db = data[i];
      if (isFinite(db)) {
        values.push({ bin: i, freq: i * freqPerBin, db: db });
      }
    }

    if (values.length < 5) return [];

    // 中位数作为噪声底
    var sortedDb = values.map(function(v) { return v.db; }).sort(function(a, b) { return a - b; });
    var median = sortedDb[Math.floor(sortedDb.length / 2)];
    var threshold = median + 6; // 高于噪声底 6dB

    var peaks = [];
    for (var j = 1; j < values.length - 1; j++) {
      var prev = values[j - 1].db;
      var curr = values[j].db;
      var next = values[j + 1].db;

      if (curr > prev && curr > next && curr > threshold) {
        // 抛物线插值，提高频率精度
        var denom = prev - 2 * curr + next;
        var delta = denom !== 0 ? 0.5 * (prev - next) / denom : 0;
        var freq = (values[j].bin + delta) * freqPerBin;

        peaks.push({
          freq: Math.max(MIN_FREQ, Math.min(MAX_FREQ, freq)),
          level: curr,
          prominence: curr - median
        });
      }
    }

    // 按强度排序，取前 5 个
    return peaks.sort(function(a, b) { return b.level - a.level; }).slice(0, 5);
  }

  // ========== 绘制频谱 ==========
  function drawSpectrum(data, sampleRate, fftSize, peaks) {
    var W = canvas.width;
    var H = canvas.height;
    var freqPerBin = sampleRate / fftSize;
    var minBin = Math.floor(MIN_FREQ / freqPerBin);
    var maxBin = Math.ceil(MAX_FREQ / freqPerBin);

    // 计算 dB 范围
    var minDb = Infinity, maxDb = -Infinity;
    for (var i = minBin; i <= maxBin; i++) {
      var db = data[i];
      if (isFinite(db)) {
        if (db > maxDb) maxDb = db;
        if (db < minDb) minDb = db;
      }
    }
    if (!isFinite(minDb)) { minDb = -100; maxDb = -20; }

    var dbRange = Math.max(maxDb - minDb, 30);
    minDb = maxDb - dbRange;

    // 清空
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = '#15151f';
    ctx.lineWidth = 1;
    ctx.font = '10px monospace';
    ctx.fillStyle = '#444';
    ctx.textAlign = 'center';

    for (var f = 20; f <= 200; f += 20) {
      var x = ((f - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)) * W;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H - 18);
      ctx.stroke();
      ctx.fillText(f + '', x, H - 5);
    }
    ctx.fillText('Hz', W - 15, H - 5);

    // 频谱曲线
    ctx.beginPath();
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';

    var started = false;
    for (var k = minBin; k <= maxBin; k++) {
      var d = data[k];
      if (!isFinite(d)) continue;
      var px = ((k * freqPerBin - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)) * W;
      var py = H - 18 - ((d - minDb) / dbRange) * (H - 18);
      if (!started) { ctx.moveTo(px, py); started = true; }
      else { ctx.lineTo(px, py); }
    }
    ctx.stroke();

    // 峰值标记
    for (var p = 0; p < peaks.length; p++) {
      var pk = peaks[p];
      var mx = ((pk.freq - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)) * W;
      var my = H - 18 - ((pk.level - minDb) / dbRange) * (H - 18);

      ctx.beginPath();
      ctx.arc(mx, my, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ff3366';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      var label = pk.freq.toFixed(1) + 'Hz';
      ctx.fillStyle = '#ff3366';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'left';
      var labelX = Math.min(mx + 8, W - 60);
      ctx.fillText(label, labelX, my - 8);
    }
    ctx.textAlign = 'left';
  }

  // ========== 更新峰值标签 ==========
  function updatePeaksDisplay(peaks) {
    if (peaks.length === 0) {
      peaksDisplay.innerHTML = '<span style="color:#555;font-size:0.85rem">未检测到明显峰值，请保持安静…</span>';
      return;
    }
    var html = '';
    for (var i = 0; i < peaks.length; i++) {
      html += '<span class="peak-tag">' + peaks[i].freq.toFixed(1) + ' Hz</span>';
    }
    peaksDisplay.innerHTML = html;
  }

  // ========== 分析按钮状态 ==========
  function updateAnalyzeButton() {
    var L = parseFloat(document.getElementById('roomLength').value);
    var W = parseFloat(document.getElementById('roomWidth').value);
    var H = parseFloat(document.getElementById('roomHeight').value);
    var peaks = isRunning ? currentPeaks : savedPeaks;
    var hasPeaks = peaks.length > 0;
    var hasDims = L > 0 && W > 0 && H > 0;
    analyzeBtn.disabled = !(hasPeaks && hasDims);
  }

  // ========== 分析 ==========
  function analyze() {
    var L = parseFloat(document.getElementById('roomLength').value);
    var W = parseFloat(document.getElementById('roomWidth').value);
    var H = parseFloat(document.getElementById('roomHeight').value);
    var peaks = isRunning ? currentPeaks : savedPeaks;

    if (!L || !W || !H || !peaks.length) {
      alert('请先完成检测并输入房间尺寸');
      return;
    }

    var modes = calcRoomModes(L, W, H);
    var matched = matchPeaks(peaks, modes);
    var diagnosis = diagnose(matched);

    displayResult(matched, modes, diagnosis, L, W, H);
  }

  // ========== 计算房间驻波 ==========
  function calcRoomModes(L, W, H) {
    var c = 343; // 声速 m/s
    var modes = [];

    for (var n = 1; n <= 5; n++) {
      var fL = n * c / (2 * L);
      var fW = n * c / (2 * W);
      var fH = n * c / (2 * H);

      if (fL <= MAX_FREQ) modes.push({ freq: fL, axis: '长', dim: L, n: n });
      if (fW <= MAX_FREQ) modes.push({ freq: fW, axis: '宽', dim: W, n: n });
      if (fH <= MAX_FREQ) modes.push({ freq: fH, axis: '高', dim: H, n: n });
    }

    return modes.sort(function(a, b) { return a.freq - b.freq; });
  }

  // ========== 匹配峰值与驻波 ==========
  function matchPeaks(peaks, modes) {
    return peaks.map(function(peak) {
      var best = null;
      var bestDiff = Infinity;

      for (var i = 0; i < modes.length; i++) {
        var diff = Math.abs(peak.freq - modes[i].freq);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = modes[i];
        }
      }

      return {
        freq: peak.freq,
        level: peak.level,
        match: bestDiff < 2 ? best : null,
        diff: bestDiff
      };
    });
  }

  // ========== 诊断 ==========
  function diagnose(matched) {
    var matchedList = matched.filter(function(p) { return p.match; });
    var unmatchedList = matched.filter(function(p) { return !p.match; });

    if (matchedList.length === 0 && unmatchedList.length === 0) {
      return {
        title: '未检测到明显低频',
        description: '当前没有检测到突出的低频峰值。请在听到嗡鸣声的位置重新检测。',
        suggestions: [
          '确保在听到噪音的位置、安静时段检测',
          '检测时保持环境安静，避免说话和走动',
          '可以尝试夜间复测，外部噪音更少'
        ]
      };
    }

    if (matchedList.length > 0 && unmatchedList.length > 0) {
      var mf = matchedList.map(function(p) { return p.freq.toFixed(1) + 'Hz'; }).join('、');
      var uf = unmatchedList.map(function(p) { return p.freq.toFixed(1) + 'Hz'; }).join('、');
      return {
        title: '🔊 室内驻波 + 外部声源',
        description: '检测到 ' + mf + ' 与房间驻波吻合，' + uf + ' 可能来自外部。两者可能叠加，导致问题更严重。建议先排查外部声源，再处理房间声学。',
        suggestions: [
          '拿着手机往不同方向走动，观察哪个方向低频变强',
          '排查自家设备：关总闸、关水泵、关空调，逐项复测',
          '将床头移离墙面 30–50cm，再在原来位置复测',
          '在床尾墙面放置书架、衣柜或厚织物，打散声波反射'
        ]
      };
    }

    if (matchedList.length > 0) {
      var freqs = matchedList.map(function(p) { return p.freq.toFixed(1) + 'Hz'; }).join('、');
      return {
        title: '🔊 疑似室内驻波放大',
        description: '检测到 ' + freqs + ' 与房间尺寸产生的驻波频率吻合。驻波是声波在两面墙之间来回反射、叠加增强的现象，会导致房间某些位置声音特别大（比如贴墙的床头），换个位置就减弱。',
        suggestions: [
          '将床头移离墙面 30–50cm，再在原来位置复测，看峰值是否下降',
          '在床尾墙面放置书架、衣柜或厚织物，打散声波反射',
          '如果问题持续，考虑在墙角放置针对 50Hz 以下的低频陷阱',
          '换到其他房间复测，确认是否为该房间的声学问题'
        ]
      };
    }

    var ufreqs = unmatchedList.map(function(p) { return p.freq.toFixed(1) + 'Hz'; }).join('、');
    return {
      title: '📡 疑似外部低频声源',
      description: '检测到 ' + ufreqs + '，与当前房间尺寸的驻波频率不吻合。这可能是外部设备（如工厂、水泵、变压器、光伏逆变器）传来的低频。',
      suggestions: [
        '拿着手机往不同方向走动，观察哪个方向声音变强',
        '排查自家设备：关总闸、关水泵、关空调，逐项复测',
        '如果确认是外部声源，可向环保部门投诉或要求第三方检测',
        '窗户加装隔音层，但低频需要专业方案，普通隔音棉效果有限'
      ]
    };
  }

  // ========== 展示结果 ==========
  function displayResult(matched, modes, diagnosis, L, W, H) {
    var resultCard = document.getElementById('resultCard');
    var content = document.getElementById('resultContent');

    var peakDetails = matched.map(function(p) {
      if (p.match) {
        return '<div class="match-detail">' +
          '<span class="freq">● ' + p.freq.toFixed(1) + ' Hz</span> ' +
          '<span class="ok">匹配：' + p.match.axis + '度驻波</span> ' +
          '（' + p.match.n + '次，' + p.match.dim.toFixed(2) + 'm → ' + p.match.freq.toFixed(1) + 'Hz）' +
          '</div>';
      } else {
        return '<div class="match-detail">' +
          '<span class="freq">● ' + p.freq.toFixed(1) + ' Hz</span> ' +
          '<span class="no">未匹配到房间驻波</span>，可能是外部声源' +
          '</div>';
      }
    }).join('');

    var suggestionsHtml = diagnosis.suggestions.map(function(s) {
      return '<li>' + s + '</li>';
    }).join('');

    content.innerHTML =
      '<div class="result-title">' + diagnosis.title + '</div>' +
      '<div class="result-desc">' + diagnosis.description + '</div>' +
      '<div class="match-box">' +
        '<div class="match-box-title">峰值匹配详情</div>' +
        peakDetails +
      '</div>' +
      '<div style="font-size:0.85rem;color:#888;margin-bottom:6px;">建议</div>' +
      '<ul class="suggestions">' + suggestionsHtml + '</ul>' +
      '<div class="disclaimer">' +
        '⚠️ 本工具仅供初步排查参考。手机麦克风在 50Hz 以下衰减严重，结果不能替代专业声级计。如需法律用途，请委托专业机构检测。' +
      '</div>';

    resultCard.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

})();
</script>
