<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Transfer - Wideband Capture Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; max-width: 800px; margin: 0 auto; }
        .card { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-send { background: #4caf50; color: #fff; }
        .btn-recv { background: #2196f3; color: #fff; }
        .btn-stop { background: #f44336; color: #fff; }
        input { padding: 8px; width: 200px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }
        .status { font-size: 14px; margin-top: 10px; color: #aaa; }
        .result-box { background: #000; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 18px; min-height: 40px; margin-top: 10px; border: 1px solid #4caf50; color: #4caf50; word-break: break-all;}
        .log-box { background: #000; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; height: 120px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; color: #888; }
    </style>
</head>
<body>

    <h2>🎙️ 接收端 (Receiver)</h2>
    <div class="card">
        <button class="btn-recv" id="btnStartListen">开始监听</button>
        <button class="btn-stop" id="btnStopListen">停止监听</button>
        <div class="status">状态: <span id="recvStatus">等待操作</span></div>
        <div class="status">实时能量: <span id="energyVal">-100 dB</span> | 底噪: <span id="noiseVal">-</span></div>
        <div style="margin-top:10px; color:#aaa; font-size:12px;">👇 接收到的明文消息</div>
        <div class="result-box" id="receivedText">等待接收...</div>
        <div class="log-box" id="recvLog">等待初始化...</div>
    </div>

    <h2>📡 发送端 (Sender)</h2>
    <div class="card">
        <input type="text" id="sendText" value="hello" />
        <button class="btn-send" id="btnSend">发送文本</button>
        <div class="status">状态: <span id="sendStatus">等待操作</span></div>
        <div class="log-box" id="sendLog">等待初始化...</div>
    </div>

<script>
    // ================= 核心配置 =================
    const FREQ_0 = 14000; 
    const FREQ_1 = 15000; 
    const BIT_DURATION_MS = 60; 
    const GUARD_INTERVAL_MS = 10; // 比特间的静音保护间隔
    const PREAMBLE = '10101010'; 
    const TERMINATOR = '10101011'; 
    const SIGNAL_MARGIN_DB = 15; // 信号必须比底噪高出 15dB 才视为有效

    // ================= 调试日志工具 =================
    const recvLogEl = document.getElementById('recvLog');
    const sendLogEl = document.getElementById('sendLog');
    const log = (type, msg) => {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}\n`;
        if (type === 'recv') { recvLogEl.innerText += line; recvLogEl.scrollTop = recvLogEl.scrollHeight; }
        else { sendLogEl.innerText += line; sendLogEl.scrollTop = sendLogEl.scrollHeight; }
        console.log(`[${type}] ${msg}`);
    };

    // ================= 纠错与校验算法 =================
    function crc8(data) {
        let crc = 0x00;
        for (let b of data) {
            crc ^= b;
            for (let i = 0; i < 8; i++) crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) : (crc << 1);
        }
        return crc & 0xFF;
    }

    function buildFrame(text) {
        let bytes = Array.from(text).map(c => c.charCodeAt(0));
        let crc = crc8(bytes);
        bytes.push(crc);
        let frameBytes = [bytes.length - 1, ...bytes]; 
        let bits = frameBytes.map(b => b.toString(2).padStart(8, '0')).join('');
        
        let interleaved = '';
        for (let i = 0; i < 8; i++) {
            for (let j = i; j < bits.length; j += 8) interleaved += bits[j];
        }
        return interleaved + TERMINATOR;
    }

    function parseFrame(bits) {
        if (bits.length % 8 !== 0) return null;
        let deinterleaved = '';
        let rows = bits.length / 8;
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < 8; j++) deinterleaved += bits[i + j * rows];
        }
        
        let bytes = [];
        for (let i = 0; i < deinterleaved.length; i += 8) bytes.push(parseInt(deinterleaved.substr(i, 8), 2));
        
        let len = bytes[0];
        let dataBytes = bytes.slice(1, 1 + len);
        let receivedCrc = bytes[1 + len];
        let calcCrc = crc8(dataBytes);
        
        if (receivedCrc !== calcCrc) {
            log('recv', `⚠️ CRC 校验失败! 收到: ${receivedCrc}, 计算: ${calcCrc}`);
            return null;
        }
        return dataBytes.map(b => String.fromCharCode(b)).join('');
    }

    // ================= 发送端逻辑 (带保护间隔) =================
    document.getElementById('btnSend').onclick = async () => {
        const text = document.getElementById('sendText').value;
        if (!text) return;
        
        const sendStatus = document.getElementById('sendStatus');
        sendStatus.innerText = "正在编码并发送...";
        log('send', `开始发送文本: "${text}"`);
        
        const payloadBits = buildFrame(text);
        const fullStream = PREAMBLE + payloadBits;
        log('send', `完整二进制流 (${fullStream.length} bits)`);
        
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') await ctx.resume();
        
        for (let i = 0; i < fullStream.length; i++) {
            const bit = fullStream[i];
            const freq = bit === '0' ? FREQ_0 : FREQ_1;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            gain.gain.value = 1.0; 
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            await new Promise(resolve => setTimeout(resolve, BIT_DURATION_MS));
            osc.stop();
            
            // 核心：每个比特之间插入静音保护间隔
            if (i < fullStream.length - 1) {
                await new Promise(resolve => setTimeout(resolve, GUARD_INTERVAL_MS));
            }
        }
        
        await new Promise(resolve => setTimeout(resolve, 200));
        ctx.close();
        sendStatus.innerText = "发送完成";
        log('send', "✅ 文本发送完毕");
    };

    // ================= 接收端逻辑 (宽频带捕获 + 动态底噪) =================
    let recvAudioCtx = null, recvAnalyser = null, isListening = false;
    let isSignalActive = false, currentBitBuffer = '', preambleBuffer = '', isSynced = false, activeStartTime = 0;
    let noiseFloor = -100; // 动态底噪

    document.getElementById('btnStartListen').onclick = async () => {
        if (isListening) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            recvAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (recvAudioCtx.state === 'suspended') await recvAudioCtx.resume();
            
            const source = recvAudioCtx.createMediaStreamSource(stream);
            recvAnalyser = recvAudioCtx.createAnalyser();
            recvAnalyser.fftSize = 4096;
            recvAnalyser.smoothingTimeConstant = 0.8; // 提高平滑度，减少毛刺
            source.connect(recvAnalyser);
            
            isListening = true;
            isSignalActive = false; currentBitBuffer = ''; preambleBuffer = ''; isSynced = false;
            document.getElementById('receivedText').innerText = '';
            document.getElementById('recvStatus').innerText = "监听中...";
            log('recv', "✅ 开始监听...");
            analyzeLoop();
        } catch (e) { log('recv', `❌ 麦克风初始化失败: ${e.message}`); }
    };

    document.getElementById('btnStopListen').onclick = () => {
        isListening = false;
        if (recvAudioCtx) recvAudioCtx.close();
        document.getElementById('recvStatus').innerText = "已停止";
        log('recv', "监听已停止");
    };

    function analyzeLoop() {
        if (!isListening || !recvAnalyser) return;
        const dataArray = new Float32Array(recvAnalyser.frequencyBinCount);
        recvAnalyser.getFloatFrequencyData(dataArray);
        
        const bin14k = Math.round(FREQ_0 * recvAnalyser.fftSize / recvAudioCtx.sampleRate);
        const bin15k = Math.round(FREQ_1 * recvAnalyser.fftSize / recvAudioCtx.sampleRate);
        
        // 核心修复：扩大捕获带宽，取前后 15 个 bin 的总和
        const getBandEnergy = (centerBin) => {
            let sum = 0;
            for(let i = -15; i <= 15; i++) sum += dataArray[centerBin + i];
            return sum / 31;
        };
        
        const energy14k = getBandEnergy(bin14k);
        const energy15k = getBandEnergy(bin15k);
        const maxEnergy = Math.max(energy14k, energy15k);
        
        // 动态更新底噪（使用滑动平均）
        if (maxEnergy < noiseFloor + 5) {
            noiseFloor = noiseFloor * 0.95 + maxEnergy * 0.05;
        }
        
        document.getElementById('energyVal').innerText = maxEnergy.toFixed(2) + ' dB';
        document.getElementById('noiseVal').innerText = noiseFloor.toFixed(2) + ' dB';
        
        // 动态阈值判定
        const now = Date.now();
        const isAboveThreshold = maxEnergy > (noiseFloor + SIGNAL_MARGIN_DB);
        
        // 状态机：上升沿触发
        if (isAboveThreshold && !isSignalActive) {
            isSignalActive = true;
            activeStartTime = now;
            let detectedBit = energy14k > energy15k ? '0' : '1';
            processBit(detectedBit);
        } else if (!isAboveThreshold && isSignalActive) {
            isSignalActive = false;
        } else if (isSignalActive && (now - activeStartTime > 150)) {
            isSignalActive = false;
            log('recv', "⚠️ 信号超时，强制复位状态机");
            isSynced = false; currentBitBuffer = ''; preambleBuffer = '';
        }
        
        requestAnimationFrame(analyzeLoop);
    }

    function processBit(bit) {
        if (!isSynced) {
            preambleBuffer += bit;
            if (preambleBuffer.length > 8) preambleBuffer = preambleBuffer.slice(-8);
            let diff = 0;
            for(let i=0; i<8; i++) if(preambleBuffer[i] !== PREAMBLE[i]) diff++;
            if (diff <= 2) {
                isSynced = true; currentBitBuffer = '';
                log('recv', `🎯 成功匹配前导码！开始接收数据帧...`);
                document.getElementById('recvStatus').innerText = "接收数据帧中...";
            }
        } else {
            currentBitBuffer += bit;
            const MIN_FRAME_BITS = 24; 
            if (currentBitBuffer.length >= MIN_FRAME_BITS && currentBitBuffer.slice(-8) === TERMINATOR) {
                let frameBits = currentBitBuffer.slice(0, -8); 
                log('recv', `📦 收到完整数据帧 (${frameBits.length} bits)，正在解析...`);
                let decoded = parseFrame(frameBits);
                if (decoded) {
                    document.getElementById('receivedText').innerText = decoded;
                    log('recv', `🎉 成功解析明文: "${decoded}"`);
                }
                isSynced = false; currentBitBuffer = '';
                document.getElementById('recvStatus').innerText = "监听中...";
            }
        }
    }
</script>
</body>
</html>
