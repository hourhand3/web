<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Transfer - FSK Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; max-width: 800px; margin: 0 auto; }
        .card { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-send { background: #4caf50; color: #fff; }
        .btn-recv { background: #2196f3; color: #fff; }
        .btn-test { background: #ff9800; color: #fff; }
        input { padding: 8px; width: 200px; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }
        .status { font-size: 14px; margin-top: 10px; color: #aaa; }
        .result-box { background: #000; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 18px; min-height: 40px; margin-top: 10px; border: 1px solid #4caf50; color: #4caf50; word-break: break-all;}
        .log-box { background: #000; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; height: 100px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; color: #888; }
    </style>
</head>
<body>

    <h2>🎙️ 接收端 (Receiver)</h2>
    <div class="card">
        <button class="btn-recv" id="btnStartListen">开始监听</button>
        <button class="btn-test" id="btnStopListen" style="background:#f44336;">停止监听</button>
        <div class="status">状态: <span id="recvStatus">等待操作</span></div>
        <div class="status">实时能量: <span id="energyVal">-100 dB</span> | 当前比特: <span id="currentBit">-</span></div>
        
        <div style="margin-top:10px; color:#aaa; font-size:12px;">👇 接收到的明文消息</div>
        <div class="result-box" id="receivedText">等待接收...</div>
        
        <div class="log-box" id="recvLog">等待初始化...</div>
    </div>

    <h2>📡 发送端 (Sender)</h2>
    <div class="card">
        <input type="text" id="sendText" value="Hi" />
        <button class="btn-send" id="btnSend">发送文本</button>
        <div class="status">状态: <span id="sendStatus">等待操作</span></div>
        <div class="log-box" id="sendLog">等待初始化...</div>
    </div>

<script>
    // ================= 核心配置 =================
    const FREQ_0 = 14000; // 代表比特 0
    const FREQ_1 = 15000; // 代表比特 1
    const BIT_DURATION_MS = 50; // 每个比特持续 50ms
    const ENERGY_THRESHOLD = -65; // 信号判定阈值 (dB)

    // ================= 调试日志工具 =================
    const recvLogEl = document.getElementById('recvLog');
    const sendLogEl = document.getElementById('sendLog');
    const log = (type, msg) => {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}\n`;
        if (type === 'recv') { recvLogEl.innerText += line; recvLogEl.scrollTop = recvLogEl.scrollHeight; }
        else { sendLogEl.innerText += line; sendLogEl.scrollTop = sendLogEl.scrollHeight; }
        console.log(`[${type}] ${msg}`);
    };

    // ================= 发送端逻辑 (FSK 编码) =================
    document.getElementById('btnSend').onclick = async () => {
        const text = document.getElementById('sendText').value;
        if (!text) return;
        
        const sendStatus = document.getElementById('sendStatus');
        sendStatus.innerText = "正在发送...";
        log('send', `开始发送文本: "${text}"`);
        
        // 1. 文本转二进制字符串
        let bitStream = '';
        for (let i = 0; i < text.length; i++) {
            bitStream += text.charCodeAt(i).toString(2).padStart(8, '0');
        }
        log('send', `二进制流 (${bitStream.length} bits): ${bitStream}`);
        
        // 2. 初始化音频上下文
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') await ctx.resume();
        
        // 3. 逐个比特播放 FSK 信号
        for (let i = 0; i < bitStream.length; i++) {
            const bit = bitStream[i];
            const freq = bit === '0' ? FREQ_0 : FREQ_1;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            gain.gain.value = 1.0; // 最大音量
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            // 等待一个比特的时间
            await new Promise(resolve => setTimeout(resolve, BIT_DURATION_MS));
            osc.stop();
        }
        
        ctx.close();
        sendStatus.innerText = "发送完成";
        log('send', "✅ 文本发送完毕");
    };

    // ================= 接收端逻辑 (FSK 解码) =================
    let recvAudioCtx = null;
    let recvAnalyser = null;
    let isListening = false;
    let currentBitBuffer = '';
    let receivedMessage = '';

    document.getElementById('btnStartListen').onclick = async () => {
        if (isListening) return;
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            
            recvAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (recvAudioCtx.state === 'suspended') await recvAudioCtx.resume();
            
            const source = recvAudioCtx.createMediaStreamSource(stream);
            recvAnalyser = recvAudioCtx.createAnalyser();
            recvAnalyser.fftSize = 4096;
            source.connect(recvAnalyser);
            
            isListening = true;
            receivedMessage = '';
            currentBitBuffer = '';
            document.getElementById('receivedText').innerText = '';
            document.getElementById('recvStatus').innerText = "监听中...";
            log('recv', "✅ 开始监听，等待 FSK 信号...");
            
            analyzeLoop();
        } catch (e) {
            log('recv', `❌ 麦克风初始化失败: ${e.message}`);
        }
    };

    document.getElementById('btnStopListen').onclick = () => {
        isListening = false;
        if (recvAudioCtx) recvAudioCtx.close();
        document.getElementById('recvStatus').innerText = "已停止";
        log('recv', "监听已停止");
    };

    function analyzeLoop() {
        if (!isListening || !recvAnalyser) return;
        
        const dataArray = new Float32Array(recvAnalyser.frequencyBinCount);
        recvAnalyser.getFloatFrequencyData(dataArray);
        
        // 计算 14kHz 和 15kHz 频段的能量
        const bin14k = Math.round(FREQ_0 * recvAnalyser.fftSize / recvAudioCtx.sampleRate);
        const bin15k = Math.round(FREQ_1 * recvAnalyser.fftSize / recvAudioCtx.sampleRate);
        
        // 取中心频率前后 3 个 bin 的平均值，增加容错率
        const getAvgEnergy = (centerBin) => {
            let sum = 0;
            for(let i = -3; i <= 3; i++) sum += dataArray[centerBin + i];
            return sum / 7;
        };
        
        const energy14k = getAvgEnergy(bin14k);
        const energy15k = getAvgEnergy(bin15k);
        const maxEnergy = Math.max(energy14k, energy15k);
        
        // 更新 UI
        document.getElementById('energyVal').innerText = maxEnergy.toFixed(2) + ' dB';
        
        // 只有当能量超过阈值时，才进行比特判定
        if (maxEnergy > ENERGY_THRESHOLD) {
            let detectedBit = '-';
            if (energy14k > energy15k) {
                detectedBit = '0';
            } else {
                detectedBit = '1';
            }
            document.getElementById('currentBit').innerText = detectedBit;
            
            // 简单的防抖：如果当前比特和上一个不同，或者刚启动，才追加到 buffer
            // 实际工程中需要更复杂的时钟同步，这里用简单的定时器模拟
            processBit(detectedBit);
        } else {
            document.getElementById('currentBit').innerText = '-';
        }
        
        requestAnimationFrame(analyzeLoop);
    }

    // 简单的比特组装逻辑 (带防抖)
    let lastBit = null;
    let bitHoldTimer = null;
    function processBit(bit) {
        // 只有当检测到的比特发生变化，或者这是第一个有效比特时，才认为收到了一个新比特
        // 这能防止同一个 50ms 的信号被记录为多个比特
        if (bit !== lastBit) {
            lastBit = bit;
            currentBitBuffer += bit;
            log('recv', `收到比特: ${bit} (Buffer: ${currentBitBuffer})`);
            
            // 如果凑齐了 8 个比特，转换为字符
            if (currentBitBuffer.length === 8) {
                const charCode = parseInt(currentBitBuffer, 2);
                // 过滤掉不可见字符
                if (charCode >= 32 && charCode <= 126) {
                    receivedMessage += String.fromCharCode(charCode);
                    document.getElementById('receivedText').innerText = receivedMessage;
                    log('recv', `🎉 解析出字符: "${String.fromCharCode(charCode)}"`);
                }
                currentBitBuffer = ''; // 清空 buffer，准备接收下一个字符
            }
        }
    }
</script>
</body>
</html>
