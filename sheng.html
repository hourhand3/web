<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acoustic Transfer - Deep Debug</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
        .card { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-send { background: #4caf50; color: #fff; }
        .btn-recv { background: #2196f3; color: #fff; }
        .btn-test { background: #ff9800; color: #fff; }
        .log-box { background: #000; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
        .status { font-size: 14px; margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>

    <h2>🎙️ 接收端 (Receiver)</h2>
    <div class="card">
        <button class="btn-test" id="btnMicTest">1. 测试麦克风 (自听)</button>
        <button class="btn-recv" id="btnStartListen">2. 开始监听</button>
        <div class="status">状态: <span id="recvStatus">等待操作</span></div>
        <div class="status">实时能量: <span id="energyVal">-100 dB</span></div>
        <div class="log-box" id="recvLog">等待初始化...</div>
    </div>

    <h2>📡 发送端 (Sender)</h2>
    <div class="card">
        <input type="text" id="sendText" value="Hi" style="padding: 8px; width: 200px;" />
        <button class="btn-send" id="btnSend">发送文本</button>
        <button class="btn-test" id="btnTestTone">测试高频音</button>
        <div class="status">状态: <span id="sendStatus">等待操作</span></div>
        <div class="log-box" id="sendLog">等待初始化...</div>
    </div>

<script>
    // ================= 调试日志工具 =================
    const recvLog = document.getElementById('recvLog');
    const sendLog = document.getElementById('sendLog');
    
    function log(type, msg) {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}\n`;
        if (type === 'recv') {
            recvLog.innerText += line;
            recvLog.scrollTop = recvLog.scrollHeight;
        } else {
            sendLog.innerText += line;
            sendLog.scrollTop = sendLog.scrollHeight;
        }
        console.log(`[${type}] ${msg}`);
    }

    // ================= 接收端逻辑 =================
    const recvStatus = document.getElementById('recvStatus');
    const energyVal = document.getElementById('energyVal');
    let audioCtx = null;
    let analyser = null;

    // 1. 麦克风自测功能 (排查硬件链路)
    document.getElementById('btnMicTest').onclick = async () => {
        recvStatus.innerText = "正在测试麦克风...";
        log('recv', "开始麦克风自测...");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                } 
            });
            const testCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = testCtx.createMediaStreamSource(stream);
            source.connect(testCtx.destination); // 直接将麦克风连到扬声器
            
            recvStatus.innerText = "正在播放麦克风声音，请对着麦克风说话...";
            log('recv', "自测成功！如果你能听到自己的声音，说明硬件链路正常。");
            
            setTimeout(() => {
                source.disconnect();
                testCtx.close();
                stream.getTracks().forEach(t => t.stop());
                recvStatus.innerText = "自测结束";
            }, 3000);
        } catch (e) {
            recvStatus.innerText = "麦克风自测失败";
            log('recv', `❌ 自测失败: ${e.name} - ${e.message}`);
        }
    };

    // 2. 开始监听
    document.getElementById('btnStartListen').onclick = async () => {
        recvStatus.innerText = "正在初始化音频上下文...";
        log('recv', "请求麦克风权限 (强制关闭降噪/AEC)...");
        
        try {
            // 关键：强制关闭浏览器的音频增强
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                } 
            });
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // 关键：强制恢复 AudioContext
            if (audioCtx.state === 'suspended') {
                log('recv', "AudioContext 处于挂起状态，正在尝试恢复...");
                await audioCtx.resume();
            }
            
            if (audioCtx.state !== 'running') {
                throw new Error("AudioContext 无法启动，当前状态: " + audioCtx.state);
            }

            log('recv', `✅ AudioContext 启动成功! 采样率: ${audioCtx.sampleRate}Hz`);
            
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;
            source.connect(analyser);
            
            recvStatus.innerText = "监听中...";
            log('recv', "开始实时分析频谱...");
            analyzeLoop();
            
        } catch (e) {
            recvStatus.innerText = "初始化失败";
            log('recv', `❌ 致命错误: ${e.name} - ${e.message}`);
        }
    };

    function analyzeLoop() {
        if (!analyser) return;
        const dataArray = new Float32Array(analyser.frequencyBinCount);
        analyser.getFloatFrequencyData(dataArray);
        
        // 寻找全局最大能量
        let maxVal = -100;
        for (let i = 0; i < dataArray.length; i++) {
            if (dataArray[i] > maxVal) maxVal = dataArray[i];
        }
        
        energyVal.innerText = maxVal.toFixed(2) + " dB";
        
        // 如果能量大于 -60dB，记录一条日志（避免刷屏）
        if (maxVal > -60) {
            log('recv', `🔊 检测到有效声音! 峰值能量: ${maxVal.toFixed(2)} dB`);
        }
        
        requestAnimationFrame(analyzeLoop);
    }

    // ================= 发送端逻辑 =================
    const sendStatus = document.getElementById('sendStatus');
    
    // 发送高频测试音
    document.getElementById('btnTestTone').onclick = () => {
        sendStatus.innerText = "正在播放 14kHz 测试音...";
        log('send', "播放 14kHz 测试音 (持续2秒)");
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.frequency.value = 14000;
        gain.gain.value = 1.0; // 最大音量
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); sendStatus.innerText = "测试音播放完毕"; }, 2000);
    };

    // 发送文本 (简单 FSK)
    document.getElementById('btnSend').onclick = () => {
        const text = document.getElementById('sendText').value;
        sendStatus.innerText = "正在发送...";
        log('send', `开始发送文本: "${text}"`);
        
        // 这里简化为发送一个 14kHz 的长音代表数据，实际应替换为 FSK 编码
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.frequency.value = 14000;
        gain.gain.value = 1.0;
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        
        log('send', "正在输出 14kHz 载波...");
        setTimeout(() => { 
            osc.stop(); 
            ctx.close(); 
            sendStatus.innerText = "发送完成";
            log('send', "发送结束");
        }, 3000);
    };
</script>
</body>
</html>
