<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR码长文本传输工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/index.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#e0e0e0}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0 12px;position:relative}
header h1{font-size:1.8em;background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
header p{color:#94a3b8;font-size:.95em}
.version-tag{position:absolute;top:24px;right:0;background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(59,130,246,.25));border:1px solid rgba(124,58,237,.4);color:#c4b5fd;padding:4px 12px;border-radius:20px;font-size:.78em;font-weight:600;letter-spacing:.5px}
.version-tag .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.mode-switch{display:flex;justify-content:center;gap:0;margin:18px 0 22px}
.mode-btn{padding:11px 36px;border:none;font-size:1em;cursor:pointer;transition:all .3s;font-weight:600;color:#cbd5e1;background:rgba(255,255,255,.07);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
.mode-btn:first-child{border-radius:50px 0 0 50px}
.mode-btn:last-child{border-radius:0 50px 50px 0}
.mode-btn.active{background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;border-color:transparent;box-shadow:0 4px 20px rgba(124,58,237,.4)}
.panel{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px;display:none;animation:fadeUp .4s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:1.1em;font-weight:700;margin-bottom:14px;color:#e2e8f0;display:flex;align-items:center;gap:8px}
textarea.input-area{width:100%;height:180px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:14px;font-size:.95em;color:#e2e8f0;resize:vertical;transition:border-color .3s;font-family:inherit;line-height:1.6}
textarea.input-area:focus{outline:none;border-color:#7c3aed}
textarea.input-area::placeholder{color:#64748b}
.char-info{text-align:right;color:#64748b;font-size:.82em;margin-top:6px}
.settings-row{display:flex;align-items:center;gap:14px;margin:18px 0;flex-wrap:wrap}
.settings-row label{font-weight:600;color:#94a3b8;font-size:.9em}
.settings-row input[type=number]{width:90px;padding:8px 10px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;color:#e2e8f0;font-size:.95em;text-align:center}
.settings-row input[type=number]:focus{outline:none;border-color:#7c3aed}
.hint{color:#64748b;font-size:.82em}
.btn{padding:10px 26px;border:none;border-radius:50px;font-size:.95em;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;box-shadow:0 4px 15px rgba(124,58,237,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(124,58,237,.5)}
.btn-success{background:linear-gradient(135deg,#059669,#34d399);color:#fff;box-shadow:0 4px 15px rgba(5,150,105,.35)}
.btn-success:hover{transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#f87171);color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:18px}
.qr-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;text-align:center;transition:all .3s;cursor:pointer;position:relative}
.qr-card:hover{border-color:#7c3aed;transform:translateY(-3px);box-shadow:0 8px 30px rgba(124,58,237,.25)}
.qr-card .zoom-hint{position:absolute;top:8px;right:8px;background:rgba(124,58,237,.8);color:#fff;font-size:.7em;padding:3px 8px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.qr-card:hover .zoom-hint{opacity:1}
.qr-card img{width:100%;max-width:200px;border-radius:6px;background:#fff;padding:6px;image-rendering:pixelated}
.qr-card .qr-label{margin-top:10px;font-weight:700;color:#a78bfa;font-size:.9em}
.qr-card .qr-size{margin-top:3px;font-size:.75em;color:#64748b}
.receiver-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:800px){.receiver-grid{grid-template-columns:1fr}}
.camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#0a0a1a;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.1)}
.camera-box video{width:100%;height:100%;object-fit:cover}
.camera-box.scanning{border-color:#7c3aed;box-shadow:0 0 20px rgba(124,58,237,.3)}
.camera-box.flash-ok{border-color:#34d399!important;box-shadow:0 0 30px rgba(52,211,153,.6)!important}
.camera-box.flash-dup{border-color:#fbbf24!important;box-shadow:0 0 30px rgba(251,191,36,.6)!important}
.scan-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none}
.scan-overlay.active{display:block}
.scan-overlay::before{content:'';position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#7c3aed,transparent);animation:scanMove 2s ease-in-out infinite;top:0}
@keyframes scanMove{0%,100%{top:10%}50%{top:85%}}
.scan-corners{position:absolute;top:15%;left:15%;right:15%;bottom:15%;border:2px solid rgba(124,58,237,.4);border-radius:8px;display:none}
.scan-corners.active{display:block}
.scan-controls{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat-card{text-align:center;padding:14px 8px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.stat-card .num{font-size:1.7em;font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .lbl{font-size:.78em;color:#64748b;margin-top:4px}
.progress-track{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:12px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,#7c3aed,#3b82f6,#34d399);border-radius:3px;transition:width .5s ease;width:0}
.chunk-badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;max-height:120px;overflow-y:auto}
.badge{padding:3px 10px;border-radius:16px;font-size:.78em;font-weight:600;transition:all .3s}
.badge.done{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.badge.wait{background:rgba(255,255,255,.05);color:#475569;border:1px solid rgba(255,255,255,.06)}
.result-box{margin-top:16px}
.result-box textarea{width:100%;height:180px;background:rgba(0,0,0,.3);border:1.5px solid rgba(52,211,153,.3);border-radius:12px;padding:14px;font-size:.95em;color:#e2e8f0;resize:vertical;font-family:inherit;line-height:1.6}
.result-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.preview-info{display:flex;gap:16px;margin:14px 0;flex-wrap:wrap}
.preview-chip{background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.25);border-radius:10px;padding:8px 16px;font-size:.85em;color:#a78bfa}
.preview-chip strong{color:#c4b5fd}
.log-area{max-height:140px;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:10px;padding:10px;margin-top:10px;font-size:.8em;line-height:1.8;color:#64748b;border:1px solid rgba(255,255,255,.05)}
.log-area .log-item{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-area .log-ok{color:#34d399}
.log-area .log-dup{color:#fbbf24}
.complete-banner{background:linear-gradient(135deg,rgba(5,150,105,.15),rgba(52,211,153,.1));border:1px solid rgba(52,211,153,.3);border-radius:14px;padding:18px;text-align:center;margin:14px 0;animation:fadeUp .5s ease}
.complete-banner .big{font-size:1.3em;font-weight:700;color:#34d399;margin-bottom:4px}
.complete-banner .sub{font-size:.85em;color:#6ee7b7}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn .25s ease}
.modal-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;max-width:90vw;max-height:90vh;overflow:auto;text-align:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.2em;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(239,68,68,.6);transform:rotate(90deg)}
.modal-title{font-size:1.1em;font-weight:700;color:#a78bfa;margin-bottom:16px}
.modal-qr{background:#fff;padding:16px;border-radius:12px;display:inline-block;image-rendering:pixelated}
.modal-qr img{display:block;max-width:none}
.modal-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
.modal-nav button{width:44px;height:44px;border-radius:50%;border:none;background:rgba(124,58,237,.3);color:#fff;font-size:1.3em;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.modal-nav button:hover:not(:disabled){background:rgba(124,58,237,.6);transform:scale(1.1)}
.modal-nav button:disabled{opacity:.3;cursor:not-allowed}
.modal-nav .nav-info{color:#94a3b8;font-weight:600;min-width:100px}
.modal-hint{color:#475569;font-size:.78em;margin-top:12px}
.scan-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(52,211,153,.95);color:#fff;padding:16px 28px;border-radius:16px;font-weight:700;font-size:1.1em;z-index:10;pointer-events:none;transition:transform .2s ease;box-shadow:0 8px 30px rgba(52,211,153,.5)}
.scan-toast.show{transform:translate(-50%,-50%) scale(1)}
.scan-toast.dup{background:rgba(251,191,36,.95);box-shadow:0 8px 30px rgba(251,191,36,.5)}
.sound-toggle{display:flex;align-items:center;gap:8px;margin-top:10px;justify-content:center}
.sound-toggle label{color:#94a3b8;font-size:.85em;cursor:pointer;display:flex;align-items:center;gap:6px}
.sound-toggle input{accent-color:#7c3aed;width:16px;height:16px}
.decoder-info{text-align:center;margin-top:8px;font-size:.78em;color:#64748b}
.decoder-info .tag{display:inline-block;padding:2px 8px;border-radius:8px;background:rgba(124,58,237,.15);color:#a78bfa;margin:0 3px}
.scan-status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-size:.85em;color:#64748b}
.scan-dot{width:8px;height:8px;border-radius:50%;background:#475569}
.scan-dot.active{background:#34d399;animation:pulse 1s infinite}
.notification{position:fixed;top:16px;right:16px;padding:12px 22px;border-radius:12px;color:#fff;font-weight:600;font-size:.9em;z-index:9999;animation:notifIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:340px}
.notification.success{background:linear-gradient(135deg,rgba(5,150,105,.9),rgba(52,211,153,.9))}
.notification.warning{background:linear-gradient(135deg,rgba(217,119,6,.9),rgba(251,191,36,.9))}
.notification.error{background:linear-gradient(135deg,rgba(220,38,38,.9),rgba(248,113,113,.9))}
.notification.info{background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(59,130,246,.9))}
@keyframes notifIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📱 QR码长文本传输工具</h1>
<p>将长文本智能分割为多个二维码 · 扫码自动识别重组 · 纯离线本地处理</p>
<div class="version-tag"><span class="dot"></span><span id="versionDisplay">v2.2</span></div>
</header>
<div class="mode-switch">
<button class="mode-btn active" onclick="switchMode('send')">📤 发送端</button>
<button class="mode-btn" onclick="switchMode('receive')">📥 接收端</button>
</div>

<div id="sendPanel" class="panel active">
<div class="section-title">📝 输入要传输的文本</div>
<textarea class="input-area" id="inputText" placeholder="在此粘贴或输入需要传输的长文本内容...&#10;&#10;支持任意长度文本（小说章节、文章、代码等），系统将自动分割成多个二维码。接收端逐个扫码后即可完整还原。"></textarea>
<div class="char-info">字符数: <span id="charCount">0</span> &nbsp;|&nbsp; 预估字节: <span id="byteCount">0</span></div>
<div class="settings-row">
<label>每块大小(字节):</label>
<input type="number" id="chunkSize" value="200" min="30" max="2000" step="10">
<span class="hint">建议100~500，越小越易扫描</span>
<button class="btn btn-primary" onclick="generateQRCodes()">⚡ 生成二维码</button>
</div>
<div id="previewArea"></div>
<div id="qrResult"></div>
</div>

<div id="receivePanel" class="panel">
<div class="receiver-grid">
<div>
<div class="section-title">📷 扫描二维码</div>
<div class="camera-box" id="cameraBox">
<video id="camVideo" autoplay playsinline muted></video>
<div class="scan-overlay" id="scanOverlay"></div>
<div class="scan-corners" id="scanCorners"></div>
<div class="scan-toast" id="scanToast"></div>
</div>
<div class="scan-controls">
<button class="btn btn-primary" id="btnStart" onclick="startScan()">▶ 开始扫描</button>
<button class="btn btn-danger" id="btnStop" onclick="stopScan()" style="display:none">⏹ 停止</button>
<button class="btn btn-ghost" onclick="resetScan()">🔄 重置</button>
</div>
<div class="sound-toggle">
<label><input type="checkbox" id="soundEnabled" checked> 🔊 扫码成功提示音</label>
</div>
<div class="scan-status">
<span class="scan-dot" id="scanDot"></span>
<span id="scanStatusText">未启动</span>
</div>
<div class="decoder-info" id="decoderInfo"></div>
<div class="section-title" style="margin-top:18px">📋 扫描日志</div>
<div class="log-area" id="logArea"><div class="log-item" style="color:#475569">等待扫描...</div></div>
</div>
<div>
<div class="section-title">📊 扫描进度</div>
<div class="stats-grid">
<div class="stat-card"><div class="num" id="statScanned">0</div><div class="lbl">已扫描</div></div>
<div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">总块数</div></div>
<div class="stat-card"><div class="num" id="statRemain">—</div><div class="lbl">剩余</div></div>
</div>
<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
<div class="chunk-badges" id="chunkBadges"><span style="color:#475569;font-size:.85em">等待首次扫描...</span></div>
<div id="completeBanner"></div>
<div class="result-box" id="resultBox" style="display:none">
<div class="section-title">✅ 重组结果</div>
<textarea class="input-area" id="resultText" readonly style="border-color:rgba(52,211,153,.3)"></textarea>
<div class="result-actions">
<button class="btn btn-success" onclick="copyResult()">📋 一键复制全部</button>
<button class="btn btn-ghost" onclick="downloadResult()">💾 下载为文本</button>
</div>
</div>
</div>
</div>
</div>
</div>

<div class="modal-overlay" id="qrModal">
<div class="modal-box">
<button class="modal-close" onclick="closeModal()">✕</button>
<div class="modal-title" id="modalTitle">第 1 / 1 块</div>
<div class="modal-qr" id="modalQr"></div>
<div class="modal-nav">
<button id="btnPrev" onclick="navModal(-1)">‹</button>
<span class="nav-info" id="modalNavInfo">1 / 1</span>
<button id="btnNext" onclick="navModal(1)">›</button>
</div>
<div class="modal-hint">💡 使用键盘 ← → 切换 · ESC 关闭</div>
</div>
</div>

<canvas id="scanCanvas" style="display:none"></canvas>

<script>
// ============ 版本号 ============
const APP_VERSION = 'v2.2';
const APP_BUILD = '20240615';
console.log(`%c📱 QR码长文本传输工具 ${APP_VERSION} (build ${APP_BUILD})`, 'color:#a78bfa;font-size:14px;font-weight:bold');
console.log(`%c✓ 页面加载成功，所有脚本已就绪`, 'color:#34d399');
document.getElementById('versionDisplay').textContent = APP_VERSION;

// ============ 全局状态 ============
let scanning=false, videoStream=null, scanAnimId=null;
let scannedChunks={}, expectedTotal=0, dupCount=0;
let lastData='', lastTime=0, lastScanT=0;
let qrChunksData=[];
let currentModalIdx=0;
let audioCtx=null;
let decoderType='none';
let barcodeDetector=null;
let decodeBusy=false; // 防止并发解码

function switchMode(m){
  document.querySelectorAll('.mode-btn').forEach((b,i)=>{b.classList.toggle('active',(m==='send'&&i===0)||(m==='receive'&&i===1))});
  document.getElementById('sendPanel').classList.toggle('active',m==='send');
  document.getElementById('receivePanel').classList.toggle('active',m==='receive');
  if(m==='send'&&scanning)stopScan();
}

document.getElementById('inputText').addEventListener('input',function(){
  const t=this.value;
  document.getElementById('charCount').textContent=t.length;
  document.getElementById('byteCount').textContent=new TextEncoder().encode(t).length;
});

function splitText(text,maxB){
  const enc=new TextEncoder(),dec=new TextDecoder();
  const reserve=14;
  const contentMax=maxB-reserve;
  if(contentMax<=0)throw new Error('分块大小太小，请增大数值');
  const bytes=enc.encode(text);
  const chunks=[];
  let s=0;
  while(s<bytes.length){
    let e=Math.min(s+contentMax,bytes.length);
    if(e<bytes.length){while(e>s&&(bytes[e]&0xC0)===0x80)e--;}
    chunks.push(dec.decode(bytes.slice(s,e)));
    s=e;
  }
  const total=chunks.length;
  const maxPrefixLen=enc.encode(`[${total}/${total}]`).length;
  if(maxPrefixLen>reserve){
    const newContentMax=maxB-maxPrefixLen;
    if(newContentMax<=0)throw new Error('分块大小太小');
    chunks.length=0;
    s=0;
    while(s<bytes.length){
      let e=Math.min(s+newContentMax,bytes.length);
      if(e<bytes.length){while(e>s&&(bytes[e]&0xC0)===0x80)e--;}
      chunks.push(dec.decode(bytes.slice(s,e)));
      s=e;
    }
  }
  const t2=chunks.length;
  return chunks.map((c,i)=>`[${i+1}/${t2}]${c}`);
}

function generateQRCodes(){
  const text=document.getElementById('inputText').value.trim();
  if(!text){notify('请先输入文本内容','warning');return;}
  const cs=parseInt(document.getElementById('chunkSize').value);
  if(cs<30){notify('分块大小不能小于30字节','warning');return;}
  try{
    const encoded=splitText(text,cs);
    qrChunksData=encoded;
    showPreview(encoded,text);
    renderQRGrid(encoded);
    notify(`成功生成 ${encoded.length} 个二维码`,'success');
  }catch(e){notify(e.message,'error');}
}

function showPreview(chunks,origText){
  const pa=document.getElementById('previewArea');
  const totalBytes=new TextEncoder().encode(origText).length;
  pa.innerHTML=`<div class="preview-info">
    <div class="preview-chip">原文 <strong>${origText.length}</strong> 字符 / <strong>${totalBytes}</strong> 字节</div>
    <div class="preview-chip">分为 <strong>${chunks.length}</strong> 块</div>
    <div class="preview-chip">每块约 <strong>${Math.ceil(totalBytes/chunks.length)}</strong> 字节</div>
  </div>`;
}

function renderQRGrid(chunks){
  const c=document.getElementById('qrResult');
  c.innerHTML=`<div class="section-title">📱 二维码 (共 ${chunks.length} 个) · 点击可放大查看</div>`;
  const grid=document.createElement('div');
  grid.className='qr-grid';
  chunks.forEach((chunk,i)=>{
    const card=document.createElement('div');
    card.className='qr-card';
    card.onclick=()=>openModal(i);
    try{
      const qr=qrcode(0,'M');
      qr.addData(chunk,'Byte');
      qr.make();
      const url=qr.createDataURL(8,2);
      const byteLen=new TextEncoder().encode(chunk).length;
      card.innerHTML=`<span class="zoom-hint">🔍 点击放大</span><img src="${url}" alt="QR ${i+1}"><div class="qr-label">第 ${i+1} / ${chunks.length} 块</div><div class="qr-size">${byteLen} 字节</div>`;
    }catch(e){
      card.innerHTML=`<div style="padding:20px;color:#f87171">生成失败</div><div class="qr-label">第 ${i+1} / ${chunks.length} 块</div>`;
    }
    grid.appendChild(card);
  });
  c.appendChild(grid);
}

// ========= 放大模态框 =========
function openModal(idx){currentModalIdx=idx;renderModal();document.getElementById('qrModal').classList.add('active');}
function closeModal(){document.getElementById('qrModal').classList.remove('active');}
function renderModal(){
  const total=qrChunksData.length;
  const chunk=qrChunksData[currentModalIdx];
  document.getElementById('modalTitle').textContent=`第 ${currentModalIdx+1} / ${total} 块`;
  document.getElementById('modalNavInfo').textContent=`${currentModalIdx+1} / ${total}`;
  document.getElementById('btnPrev').disabled=currentModalIdx===0;
  document.getElementById('btnNext').disabled=currentModalIdx===total-1;
  const qr=qrcode(0,'M');
  qr.addData(chunk,'Byte');
  qr.make();
  const url=qr.createDataURL(14,2);
  const byteLen=new TextEncoder().encode(chunk).length;
  document.getElementById('modalQr').innerHTML=`<img src="${url}" alt="QR ${currentModalIdx+1}" style="width:100%;max-width:520px;height:auto"><div style="margin-top:10px;color:#64748b;font-size:.85em">${byteLen} 字节</div>`;
}
function navModal(dir){
  const newIdx=currentModalIdx+dir;
  if(newIdx<0||newIdx>=qrChunksData.length)return;
  currentModalIdx=newIdx;
  renderModal();
}

document.addEventListener('keydown',function(e){
  if(!document.getElementById('qrModal').classList.contains('active'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();navModal(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();navModal(1);}
  else if(e.key==='Escape'){e.preventDefault();closeModal();}
});

// ========= 提示音 =========
function playBeep(type){
  if(!document.getElementById('soundEnabled').checked)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    if(type==='ok'){
      osc.type='sine';
      osc.frequency.setValueAtTime(880,audioCtx.currentTime);
      osc.frequency.setValueAtTime(1320,audioCtx.currentTime+0.08);
      gain.gain.setValueAtTime(0.25,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2);
      osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.2);
    }else if(type==='dup'){
      osc.type='square';
      osc.frequency.setValueAtTime(300,audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
      osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.15);
    }else if(type==='complete'){
      osc.type='sine';
      osc.frequency.setValueAtTime(660,audioCtx.currentTime);
      osc.frequency.setValueAtTime(880,audioCtx.currentTime+0.12);
      osc.frequency.setValueAtTime(1320,audioCtx.currentTime+0.24);
      gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
      osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.4);
    }
  }catch(e){}
}

function showScanToast(text,isDup){
  const t=document.getElementById('scanToast');
  t.textContent=text;
  t.classList.toggle('dup',!!isDup);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1200);
}

// ========= 解码器初始化 =========
function initDecoder(){
  // 优先尝试原生 BarcodeDetector（Chrome/Edge Android 支持）
  if('BarcodeDetector' in window){
    try{
      barcodeDetector=new BarcodeDetector({formats:['qr_code']});
      decoderType='barcodeDetector';
      document.getElementById('decoderInfo').innerHTML='解码引擎: <span class="tag">BarcodeDetector 原生</span> + <span class="tag">jsQR 备用</span>';
      addLog('✓ 使用原生 BarcodeDetector 解码器（识别率最高）','ok');
      return;
    }catch(e){
      console.warn('BarcodeDetector 初始化失败:',e);
    }
  }
  // 回退到 jsQR
  decoderType='jsqr';
  document.getElementById('decoderInfo').innerHTML='解码引擎: <span class="tag">jsQR</span>';
  addLog('✓ 使用 jsQR 解码器','info');
}

// ========= 从视频帧解码 =========
async function decodeFrame(video){
  if(video.readyState<video.HAVE_CURRENT_DATA)return null;
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh)return null;

  // 方案1: BarcodeDetector（原生API，可直接传 video 元素，识别率最高）
  if(decoderType==='barcodeDetector'&&barcodeDetector){
    try{
      const results=await barcodeDetector.detect(video);
      if(results&&results.length>0){
        for(const r of results){
          if(r.rawValue)return r.rawValue;
        }
      }
    }catch(e){
      // 静默失败，回退到 jsQR
    }
  }

  // 方案2: jsQR（使用原始视频分辨率，与第一版一致）
  const canvas=document.getElementById('scanCanvas');
  canvas.width=vw;
  canvas.height=vh;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,vw,vh);
  try{
    const imgData=ctx.getImageData(0,0,vw,vh);
    const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});
    if(code&&code.data)return code.data;
  }catch(e){}

  return null;
}

// ========= 扫描循环（保持第一版的 requestAnimationFrame 方式） =========
function scanLoop(){
  if(!scanning)return;
  const now=Date.now();
  // 节流：300ms 一次，避免 CPU 过载
  if(now-lastScanT>=300 && !decodeBusy){
    lastScanT=now;
    const v=document.getElementById('camVideo');
    if(v.readyState>=v.HAVE_CURRENT_DATA){
      decodeBusy=true;
      decodeFrame(v).then(result=>{
        decodeBusy=false;
        if(result)processQR(result);
      }).catch(()=>{decodeBusy=false;});
    }
  }
  scanAnimId=requestAnimationFrame(scanLoop);
}

// ========= 摄像头控制 =========
async function startScan(){
  try{
    const constraints={
      video:{
        facingMode:'environment',
        width:{ideal:1280, min:640},
        height:{ideal:720, min:480}
      }
    };
    const stream=await navigator.mediaDevices.getUserMedia(constraints);
    videoStream=stream;
    const v=document.getElementById('camVideo');
    v.srcObject=stream;
    await v.play();

    // 初始化解码器
    initDecoder();

    scanning=true;
    lastScanT=0;
    decodeBusy=false;
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnStop').style.display='inline-flex';
    document.getElementById('cameraBox').classList.add('scanning');
    document.getElementById('scanOverlay').classList.add('active');
    document.getElementById('scanCorners').classList.add('active');
    document.getElementById('scanDot').classList.add('active');
    document.getElementById('scanStatusText').textContent='扫描中...';
    addLog('扫描已启动，请将二维码对准摄像头','info');
    addLog(`摄像头分辨率: ${v.videoWidth}×${v.videoHeight}`,'info');

    // 启动扫描循环（与第一版相同的 requestAnimationFrame 方式）
    scanAnimId=requestAnimationFrame(scanLoop);

  }catch(e){
    notify('无法访问摄像头: '+e.message,'error');
    addLog('摄像头访问失败: '+e.message,'err');
  }
}

function stopScan(){
  scanning=false;
  if(scanAnimId){cancelAnimationFrame(scanAnimId);scanAnimId=null;}
  if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null;}
  document.getElementById('btnStart').style.display='inline-flex';
  document.getElementById('btnStop').style.display='none';
  document.getElementById('cameraBox').classList.remove('scanning');
  document.getElementById('scanOverlay').classList.remove('active');
  document.getElementById('scanCorners').classList.remove('active');
  document.getElementById('scanDot').classList.remove('active');
  document.getElementById('scanStatusText').textContent='已停止';
  addLog('扫描已停止','info');
}

function processQR(data){
  const now=Date.now();
  if(data===lastData&&now-lastTime<2000)return;
  lastData=data;lastTime=now;
  const m=data.match(/^\[(\d+)\/(\d+)\](.*)/s);
  if(!m){return;}
  const idx=parseInt(m[1]),tot=parseInt(m[2]),content=m[3];
  if(expectedTotal>0&&tot!==expectedTotal){
    addLog(`⚠ 第${idx}块总数不匹配(期望${expectedTotal},实际${tot})`,'err');
    notify('二维码来源不一致！','error');
    return;
  }
  if(scannedChunks[idx]){
    dupCount++;
    addLog(`⚠ 第 ${idx}/${tot} 块 — 重复扫描，已忽略`,'dup');
    notify(`第 ${idx} 块已扫过（重复）`,'warning');
    flashCamera('dup');
    showScanToast(`#${idx} 已扫过`,true);
    playBeep('dup');
    updateBadges();
    return;
  }
  scannedChunks[idx]=content;
  expectedTotal=tot;
  addLog(`✓ 第 ${idx}/${tot} 块 — 扫描成功`,'ok');
  notify(`✓ 第 ${idx}/${tot} 块`,'success');
  flashCamera('ok');
  showScanToast(`✓ 第 ${idx}/${tot} 块`,false);
  playBeep('ok');
  updateProgress();
  if(Object.keys(scannedChunks).length===expectedTotal){
    reassemble();
  }
}

function flashCamera(type){
  const box=document.getElementById('cameraBox');
  const cls=type==='dup'?'flash-dup':'flash-ok';
  box.classList.add(cls);
  setTimeout(()=>box.classList.remove(cls),500);
}

function updateProgress(){
  const n=Object.keys(scannedChunks).length;
  document.getElementById('statScanned').textContent=n;
  document.getElementById('statTotal').textContent=expectedTotal||'—';
  document.getElementById('statRemain').textContent=expectedTotal?(expectedTotal-n):'—';
  const pct=expectedTotal?(n/expectedTotal*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  updateBadges();
}

function updateBadges(){
  const c=document.getElementById('chunkBadges');
  if(!expectedTotal){c.innerHTML='<span style="color:#475569;font-size:.85em">等待首次扫描...</span>';return;}
  let html='';
  for(let i=1;i<=expectedTotal;i++){
    if(scannedChunks[i])html+=`<span class="badge done">#${i} ✓</span>`;
    else html+=`<span class="badge wait">#${i}</span>`;
  }
  c.innerHTML=html;
}

function reassemble(){
  let full='';
  for(let i=1;i<=expectedTotal;i++)full+=scannedChunks[i]||'';
  document.getElementById('resultText').value=full;
  document.getElementById('resultBox').style.display='block';
  document.getElementById('completeBanner').innerHTML=`<div class="complete-banner">
    <div class="big">🎉 全部扫描完成！</div>
    <div class="sub">已成功接收 ${expectedTotal} 个分块，共 ${full.length} 字符，文本已完整重组</div>
  </div>`;
  addLog(`🎉 全部 ${expectedTotal} 块扫描完成，文本已重组 (${full.length} 字符)`,'ok');
  notify('🎉 所有二维码已扫描完成！','success');
  playBeep('complete');
  if(scanning)stopScan();
}

function copyResult(){
  const t=document.getElementById('resultText').value;
  if(!t){notify('没有可复制的内容','warning');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>notify('已复制到剪贴板 ✓','success')).catch(()=>fallbackCopy(t));
  }else{fallbackCopy(t);}
}
function fallbackCopy(t){
  const ta=document.getElementById('resultText');
  ta.select();ta.setSelectionRange(0,999999);
  try{document.execCommand('copy');notify('已复制到剪贴板 ✓','success');}
  catch(e){notify('复制失败，请手动选择复制','error');}
}

function downloadResult(){
  const t=document.getElementById('resultText').value;
  if(!t){notify('没有可下载的内容','warning');return;}
  const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='decoded_text_'+Date.now()+'.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  notify('文件已下载 ✓','success');
}

function resetScan(){
  scannedChunks={};expectedTotal=0;dupCount=0;lastData='';lastTime=0;
  document.getElementById('statScanned').textContent='0';
  document.getElementById('statTotal').textContent='—';
  document.getElementById('statRemain').textContent='—';
  document.getElementById('progressBar').style.width='0%';
  document.getElementById('chunkBadges').innerHTML='<span style="color:#475569;font-size:.85em">等待首次扫描...</span>';
  document.getElementById('resultBox').style.display='none';
  document.getElementById('completeBanner').innerHTML='';
  document.getElementById('logArea').innerHTML='<div class="log-item" style="color:#475569">等待扫描...</div>';
  document.getElementById('scanStatusText').textContent='未启动';
  notify('扫描状态已重置','info');
}

function addLog(msg,type){
  const la=document.getElementById('logArea');
  const cls=type==='ok'?'log-ok':type==='dup'?'log-dup':type==='err'?'log-dup':'';
  const time=new Date().toLocaleTimeString();
  const div=document.createElement('div');
  div.className='log-item '+cls;
  div.textContent=`[${time}] ${msg}`;
  la.appendChild(div);
  la.scrollTop=la.scrollHeight;
}

let notifTimer=null;
function notify(msg,type){
  document.querySelectorAll('.notification').forEach(n=>n.remove());
  const d=document.createElement('div');
  d.className='notification '+type;
  d.textContent=msg;
  document.body.appendChild(d);
  if(notifTimer)clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>d.remove(),2500);
}
</script>
