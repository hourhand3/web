<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕光通信 - LT喷泉码 + 空间并行</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a; color: #e0e0e0; padding: 10px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 15px; color: #4CAF50; font-size: 1.5em; }
        .mode-switch {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;
        }
        .mode-btn {
            padding: 8px 20px; border: 2px solid #4CAF50; background: transparent;
            color: #4CAF50; border-radius: 4px; cursor: pointer; font-size: 14px;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #4CAF50; color: white; }
        .mode-btn:hover { background: #45a049; color: white; }
        .panels { display: flex; gap: 15px; flex-wrap: wrap; }
        .panel {
            flex: 1; min-width: 350px; background: #2a2a2a;
            border-radius: 8px; padding: 15px;
        }
        .panel h2 { margin-bottom: 12px; color: #66bb6a; font-size: 1.1em; }
        .input-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; color: #b0b0b0; font-size: 13px; }
        input[type="text"], textarea, select {
            width: 100%; padding: 6px; background: #1a1a1a;
            border: 1px solid #444; border-radius: 4px; color: #e0e0e0; font-size: 13px;
        }
        textarea { resize: vertical; min-height: 60px; font-family: monospace; }
        .params-row {
            display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .params-row .input-group { flex: 1; min-width: 100px; }
        .button-group { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        button {
            padding: 8px 16px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        button.primary { background: #4CAF50; color: white; }
        button.primary:hover { background: #45a049; }
        button.secondary { background: #666; color: white; }
        button.secondary:hover { background: #555; }
        button.danger { background: #f44336; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .canvas-wrap {
            display: flex; justify-content: center; background: #000;
            border-radius: 4px; padding: 10px; margin-bottom: 10px;
        }
        canvas { border: 1px solid #333; max-width: 100%; }
        .video-wrap {
            position: relative; display: flex; justify-content: center;
            background: #000; border-radius: 4px; padding: 10px; margin-bottom: 10px;
        }
        video { max-width: 100%; border: 1px solid #333; }
        .overlay-canvas {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            pointer-events: none;
        }
        .status-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px; margin-bottom: 10px;
        }
        .status-card {
            background: #1a1a1a; padding: 10px; border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        .status-card h3 { margin-bottom: 6px; color: #66bb6a; font-size: 0.9em; }
        .status-item {
            display: flex; justify-content: space-between;
            margin-bottom: 3px; font-size: 12px;
        }
        .status-item span:first-child { color: #888; }
        .status-item span:last-child { color: #4CAF50; font-family: monospace; }
        .progress-bar {
            width: 100%; height: 20px; background: #1a1a1a;
            border-radius: 4px; overflow: hidden; margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #4CAF50, #66bb6a);
            transition: width 0.3s; display: flex; align-items: center;
            justify-content: center; font-size: 11px; color: white;
        }
        .result-box {
            background: #1a1a1a; padding: 10px; border-radius: 4px;
            min-height: 60px; font-family: monospace; font-size: 13px;
            white-space: pre-wrap; word-break: break-all;
            border: 1px solid #333;
        }
        .log {
            background: #1a1a1a; padding: 8px; border-radius: 4px;
            max-height: 150px; overflow-y: auto; font-family: monospace;
            font-size: 11px;
        }
        .log-entry { margin-bottom: 2px; color: #b0b0b0; }
        .log-entry.info { color: #66bb6a; }
        .log-entry.warn { color: #ffa726; }
        .log-entry.error { color: #f44336; }
        .hidden { display: none !important; }
        .hint {
            font-size: 11px; color: #888; margin-top: 5px;
            padding: 5px; background: #1a1a1a; border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔦 屏幕光通信 - LT喷泉码 + 空间并行</h1>
        
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="send">📡 发送模式</button>
            <button class="mode-btn" data-mode="recv">📷 接收模式</button>
            <button class="mode-btn" data-mode="both">🔄 同屏模式</button>
        </div>

        <div class="panels">
            <!-- 发送面板 -->
            <div class="panel" id="sendPanel">
                <h2>📡 发送端</h2>
                <div class="input-group">
                    <label>要发送的文本：</label>
                    <textarea id="textInput" placeholder="输入要传输的文本...">Hello, 光通信测试！这是一段用于验证LT喷泉码的文本。</textarea>
                </div>
                <div class="params-row">
                    <div class="input-group">
                        <label>区域数：</label>
                        <select id="zoneCount">
                            <option value="4" selected>4 (2×2)</option>
                            <option value="9">9 (3×3)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>符号时长：</label>
                        <select id="symbolDuration">
                            <option value="40">40ms</option>
                            <option value="80" selected>80ms</option>
                            <option value="120">120ms</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>分片大小：</label>
                        <select id="fragmentSize">
                            <option value="8">8字节</option>
                            <option value="16" selected>16字节</option>
                            <option value="32">32字节</option>
                        </select>
                    </div>
                </div>
                <div class="button-group">
                    <button id="startBtn" class="primary">▶ 开始发送</button>
                    <button id="pauseBtn" class="secondary" disabled>⏸ 暂停</button>
                    <button id="resetBtn" class="secondary">↺ 重置</button>
                </div>
                <div class="canvas-wrap">
                    <canvas id="sendCanvas" width="400" height="400"></canvas>
                </div>
                <div class="status-grid" id="sendStatus"></div>
                <div class="input-group">
                    <label>发送日志：</label>
                    <div class="log" id="sendLog"></div>
                </div>
            </div>

            <!-- 接收面板 -->
            <div class="panel" id="recvPanel">
                <h2>📷 接收端</h2>
                <div class="params-row">
                    <div class="input-group">
                        <label>采样区域偏移X：</label>
                        <input type="text" id="offsetX" value="0" style="width:60px">
                    </div>
                    <div class="input-group">
                        <label>采样区域偏移Y：</label>
                        <input type="text" id="offsetY" value="0" style="width:60px">
                    </div>
                    <div class="input-group">
                        <label>采样区域缩放：</label>
                        <input type="text" id="scaleFactor" value="1.0" style="width:60px">
                    </div>
                </div>
                <div class="button-group">
                    <button id="startRecvBtn" class="primary">📷 开始接收</button>
                    <button id="stopRecvBtn" class="secondary" disabled>⏹ 停止</button>
                    <button id="resetRecvBtn" class="secondary">↺ 重置解码</button>
                </div>
                <div class="hint">💡 提示：将摄像头对准发送端屏幕，确保4个定位标记（白色小方块）可见。调整偏移和缩放使采样框对齐发送区域。</div>
                <div class="video-wrap">
                    <video id="recvVideo" autoplay playsinline width="400" height="300"></video>
                    <canvas id="overlayCanvas" class="overlay-canvas" width="400" height="300"></canvas>
                </div>
                <div class="input-group">
                    <label>解码进度：</label>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width:0%">0%</div>
                    </div>
                </div>
                <div class="status-grid" id="recvStatus"></div>
                <div class="input-group">
                    <label>还原结果：</label>
                    <div class="result-box" id="resultBox">等待接收...</div>
                </div>
                <div class="input-group">
                    <label>接收日志：</label>
                    <div class="log" id="recvLog"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ================================================================
    //  全局状态
    // ================================================================
    const State = {
        // 发送端
        send: {
            running: false, paused: false,
            text: '', bytes: [], fragments: [],
            encoder: null, zones: [], animId: null, lastTick: 0
        },
        // 接收端
        recv: {
            running: false, stream: null, animId: null,
            decoder: null, zones: [],
            // 每个区域的采样状态
            samplers: []
        },
        // 参数
        params: {
            zoneCount: 4, symbolDuration: 80, fragmentSize: 16,
            gridSize: 2
        }
    };

    // ================================================================
    //  工具函数
    // ================================================================
    function textToBytes(text) {
        return Array.from(new TextEncoder().encode(text));
    }
    function bytesToText(bytes) {
        // 去除末尾0填充
        let end = bytes.length;
        while (end > 0 && bytes[end - 1] === 0) end--;
        return new TextDecoder().decode(new Uint8Array(bytes.slice(0, end)));
    }
    function log(elId, msg, type = 'info') {
        const el = document.getElementById(elId);
        const d = document.createElement('div');
        d.className = 'log-entry ' + type;
        d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        el.appendChild(d);
        el.scrollTop = el.scrollHeight;
    }

    // ================================================================
    //  LCG 伪随机数生成器 (保证收发端一致)
    // ================================================================
    class LCG {
        constructor(seed) { this.state = seed >>> 0; }
        next() {
            this.state = (1664525 * this.state + 1013904223) >>> 0;
            return this.state;
        }
        nextFloat() { return this.next() / 4294967296; }
        nextInt(max) { return Math.floor(this.nextFloat() * max); }
    }

    // ================================================================
    //  鲁棒孤子分布 (Robust Soliton Distribution)
    // ================================================================
    class RobustSoliton {
        constructor(K, c = 0.03, delta = 0.5) {
            this.K = K;
            this.probs = this._compute(c, delta);
        }
        _compute(c, delta) {
            const K = this.K;
            const R = c * Math.log(K / delta) * Math.sqrt(K);
            const rho = new Float64Array(K + 1);
            rho[1] = 1 / K;
            for (let d = 2; d <= K; d++) rho[d] = 1 / (d * (d - 1));
            const tau = new Float64Array(K + 1);
            const threshold = Math.max(1, Math.floor(K / R));
            for (let d = 1; d < threshold; d++) tau[d] = 1 / (d * K);
            tau[threshold] = Math.log(R / delta) / K;
            const combined = new Float64Array(K + 1);
            let Z = 0;
            for (let d = 1; d <= K; d++) {
                combined[d] = rho[d] + tau[d];
                Z += combined[d];
            }
            for (let d = 1; d <= K; d++) combined[d] /= Z;
            // 累积分布
            const cum = new Float64Array(K + 1);
            cum[0] = 0;
            for (let d = 1; d <= K; d++) cum[d] = cum[d - 1] + combined[d];
            return cum;
        }
        sample(lcg) {
            const r = lcg.nextFloat();
            for (let d = 1; d <= this.K; d++) {
                if (r < this.probs[d]) return d;
            }
            return this.K;
        }
    }

    // ================================================================
    //  LT 编码器
    // ================================================================
    class LTEncoder {
        constructor(fragments) {
            this.fragments = fragments;
            this.K = fragments.length;
            this.dist = new RobustSoliton(this.K);
            this.seedCounter = 0;
        }
        generate() {
            const seed = this.seedCounter++;
            const lcg = new LCG(seed + 12345); // 偏移避免seed=0的问题
            const degree = this.dist.sample(lcg);
            const indices = new Set();
            while (indices.size < degree) indices.add(lcg.nextInt(this.K));
            const fsize = this.fragments[0].length;
            const data = new Uint8Array(fsize);
            for (const idx of indices) {
                const f = this.fragments[idx];
                for (let i = 0; i < fsize; i++) data[i] ^= f[i];
            }
            return { seed, degree, indices: Array.from(indices), data: Array.from(data) };
        }
    }

    // ================================================================
    //  LT 解码器 (Belief Propagation / 置信传播)
    // ================================================================
    class LTDecoder {
        constructor(K, fragmentSize) {
            this.K = K;
            this.fsize = fragmentSize;
            this.originals = new Array(K).fill(null);
            this.decoded = 0;
            this.packets = []; // {seed, degree, indices, data}
            this.seen = new Set();
        }
        addPacket(seed, degree, indices, data) {
            if (this.seen.has(seed)) return false;
            this.seen.add(seed);
            this.packets.push({ seed, degree, indices: [...indices], data: [...data] });
            this._propagate();
            return true;
        }
        _propagate() {
            let changed = true;
            while (changed) {
                changed = false;
                for (const pkt of this.packets) {
                    const unknowns = pkt.indices.filter(i => this.originals[i] === null);
                    if (unknowns.length === 0) continue;
                    if (unknowns.length === 1) {
                        const target = unknowns[0];
                        const frag = new Uint8Array(this.fsize);
                        for (let i = 0; i < this.fsize; i++) frag[i] = pkt.data[i];
                        for (const idx of pkt.indices) {
                            if (idx !== target && this.originals[idx] !== null) {
                                for (let i = 0; i < this.fsize; i++) {
                                    frag[i] ^= this.originals[idx][i];
                                }
                            }
                        }
                        this.originals[target] = frag;
                        this.decoded++;
                        changed = true;
                    }
                }
            }
        }
        isComplete() { return this.decoded >= this.K; }
        getResult() {
            if (!this.isComplete()) return null;
            const bytes = [];
            for (const f of this.originals) {
                if (f) for (let i = 0; i < f.length; i++) bytes.push(f[i]);
            }
            return bytesToText(bytes);
        }
    }

    // ================================================================
    //  数据包封装 & 解析
    //  格式: 包头(1B) + 序号(2B) + 数据(K B) + 校验(1B)
    // ================================================================
    function encodePacket(encoded) {
        const pkt = [];
        pkt.push(0xAA); // 包头 10101010
        pkt.push((encoded.seed >> 8) & 0xFF);
        pkt.push(encoded.seed & 0xFF);
        for (const b of encoded.data) pkt.push(b);
        let cksum = 0;
        for (let i = 0; i < pkt.length; i++) cksum ^= pkt[i];
        pkt.push(cksum);
        return pkt;
    }

    function decodePacket(bits) {
        // bits: 比特数组, 长度 = (3 + K + 1) * 8
        if (bits.length < 32) return null;
        // 解析字节
        const bytes = [];
        for (let i = 0; i + 7 < bits.length; i += 8) {
            let b = 0;
            for (let j = 0; j < 8; j++) b = (b << 1) | (bits[i + j] & 1);
            bytes.push(b);
        }
        if (bytes.length < 4) return null;
        // 校验包头
        if (bytes[0] !== 0xAA) return null;
        // 校验XOR
        let cksum = 0;
        for (let i = 0; i < bytes.length - 1; i++) cksum ^= bytes[i];
        if (cksum !== bytes[bytes.length - 1]) return null;
        // 解析序号
        const seed = (bytes[1] << 8) | bytes[2];
        // 数据
        const data = bytes.slice(3, bytes.length - 1);
        return { seed, data };
    }

    // ================================================================
    //  曼彻斯特编码: 0→[暗,亮] 1→[亮,暗]
    // ================================================================
    function manchesterEncode(bytes) {
        const out = [];
        for (const byte of bytes) {
            for (let bit = 7; bit >= 0; bit--) {
                const v = (byte >> bit) & 1;
                if (v === 0) { out.push(0, 1); }
                else { out.push(1, 0); }
            }
        }
        return out;
    }

    // ================================================================
    //  发送端
    // ================================================================
    const sendCanvas = document.getElementById('sendCanvas');
    const sendCtx = sendCanvas.getContext('2d');

    class SendZone {
        constructor(id, x, y, size) {
            this.id = id; this.x = x; this.y = y; this.size = size;
            this.brightnessSeq = [];
            this.seqIdx = 0;
            this.display = 0;
            this.sentCount = 0;
            this.currentSeed = -1;
        }
        loadPacket(pktBytes) {
            this.brightnessSeq = manchesterEncode(pktBytes);
            this.seqIdx = 0;
            this.sentCount++;
        }
        tick() {
            if (this.brightnessSeq.length === 0) return true;
            this.display = this.brightnessSeq[this.seqIdx];
            this.seqIdx++;
            if (this.seqIdx >= this.brightnessSeq.length) {
                this.brightnessSeq = [];
                this.seqIdx = 0;
                return true;
            }
            return false;
        }
    }

    function initSendZones() {
        const N = State.params.zoneCount;
        const gs = State.params.gridSize;
        const pad = 15, gap = 8;
        const sz = (400 - 2 * pad - (gs - 1) * gap) / gs;
        State.send.zones = [];
        let id = 0;
        for (let r = 0; r < gs; r++) {
            for (let c = 0; c < gs; c++) {
                const x = pad + c * (sz + gap);
                const y = pad + r * (sz + gap);
                State.send.zones.push(new SendZone(id++, x, y, sz));
            }
        }
        updateSendStatus();
    }

    function updateSendStatus() {
        const el = document.getElementById('sendStatus');
        el.innerHTML = '';
        State.send.zones.forEach((z, i) => {
            const card = document.createElement('div');
            card.className = 'status-card';
            card.innerHTML = `
                <h3>区域 ${i + 1}</h3>
                <div class="status-item"><span>分片序号:</span><span id="sz-seed-${i}">-</span></div>
                <div class="status-item"><span>已发送:</span><span id="sz-cnt-${i}">0</span></div>
                <div class="status-item"><span>亮度:</span><span id="sz-br-${i}">0</span></div>
            `;
            el.appendChild(card);
        });
    }

    function drawSendCanvas() {
        sendCtx.fillStyle = '#000';
        sendCtx.fillRect(0, 0, 400, 400);
        State.send.zones.forEach(z => {
            sendCtx.fillStyle = z.display ? '#fff' : '#111';
            sendCtx.fillRect(z.x, z.y, z.size, z.size);
            sendCtx.strokeStyle = '#4CAF50';
            sendCtx.lineWidth = 2;
            sendCtx.strokeRect(z.x, z.y, z.size, z.size);
            // 区域编号
            sendCtx.fillStyle = z.display ? '#000' : '#4CAF50';
            sendCtx.font = '14px monospace';
            sendCtx.textAlign = 'center';
            sendCtx.textBaseline = 'middle';
            sendCtx.fillText(`Z${z.id + 1}`, z.x + z.size / 2, z.y + z.size / 2);
        });
        // 四角定位标记
        const m = 8;
        sendCtx.fillStyle = '#fff';
        sendCtx.fillRect(0, 0, m, m);
        sendCtx.fillRect(400 - m, 0, m, m);
        sendCtx.fillRect(0, 400 - m, m, m);
        sendCtx.fillRect(400 - m, 400 - m, m, m);
    }

    function sendTick() {
        if (!State.send.running || State.send.paused) return;
        State.send.zones.forEach(z => {
            const needNew = z.tick();
            if (needNew || z.brightnessSeq.length === 0) {
                const enc = State.send.encoder.generate();
                const pkt = encodePacket(enc);
                z.currentSeed = enc.seed;
                z.loadPacket(pkt);
            }
            // 更新UI
            const si = document.getElementById(`sz-seed-${z.id}`);
            const ci = document.getElementById(`sz-cnt-${z.id}`);
            const bi = document.getElementById(`sz-br-${z.id}`);
            if (si) si.textContent = z.currentSeed;
            if (ci) ci.textContent = z.sentCount;
            if (bi) bi.textContent = z.display;
        });
        drawSendCanvas();
    }

    let sendInterval = null;
    function startSend() {
        const text = document.getElementById('textInput').value;
        if (!text) { log('sendLog', '请输入文本', 'warn'); return; }
        const fsize = State.params.fragmentSize;
        State.send.text = text;
        State.send.bytes = textToBytes(text);
        log('sendLog', `文本: ${text.length}字符, ${State.send.bytes.length}字节`);
        // 分片
        State.send.fragments = [];
        for (let i = 0; i < State.send.bytes.length; i += fsize) {
            const f = State.send.bytes.slice(i, i + fsize);
            while (f.length < fsize) f.push(0);
            State.send.fragments.push(f);
        }
        if (State.send.fragments.length === 0) State.send.fragments.push(new Array(fsize).fill(0));
        log('sendLog', `分片: ${State.send.fragments.length}片 × ${fsize}字节`);
        State.send.encoder = new LTEncoder(State.send.fragments);
        initSendZones();
        State.send.running = true;
        State.send.paused = false;
        const T = State.params.symbolDuration;
        sendInterval = setInterval(sendTick, T);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        log('sendLog', '发送已开始', 'info');
    }

    function pauseSend() {
        State.send.paused = !State.send.paused;
        document.getElementById('pauseBtn').textContent = State.send.paused ? '▶ 继续' : '⏸ 暂停';
        log('sendLog', State.send.paused ? '已暂停' : '已继续');
    }

    function resetSend() {
        State.send.running = false;
        State.send.paused = false;
        if (sendInterval) clearInterval(sendInterval);
        State.send.zones = [];
        State.send.encoder = null;
        sendCtx.fillStyle = '#000';
        sendCtx.fillRect(0, 0, 400, 400);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('pauseBtn').textContent = '⏸ 暂停';
        document.getElementById('sendStatus').innerHTML = '';
        log('sendLog', '已重置');
    }

    // ================================================================
    //  接收端
    // ================================================================
    const recvVideo = document.getElementById('recvVideo');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const analysisCanvas = document.createElement('canvas');
    const analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });

    class RecvSampler {
        constructor(id) {
            this.id = id;
            // 采样区域在video中的位置（相对坐标0-1）
            this.relX = 0; this.relY = 0; this.relW = 0; this.relH = 0;
            // 亮度历史
            this.brightnessHistory = [];
            this.threshold = 128;
            // 曼彻斯特解码状态
            this.symbolBuffer = []; // 当前符号周期内的亮度采样
            this.symbolTimer = 0; // 当前符号已积累的帧数
            this.bitBuffer = []; // 已解码的比特
            this.lastSymbol = -1; // 上一个符号值
            // 数据包解析状态
            this.packetBits = [];
            this.packetExpectedLen = 0;
            this.state = 'SEARCH'; // SEARCH | RECV
            // 统计
            this.collectedSeeds = new Set();
            this.currentBit = '-';
            this.frameCount = 0;
            this.lastBrightness = 0;
        }
    }

    function initRecvZones() {
        const N = State.params.zoneCount;
        const gs = State.params.gridSize;
        State.recv.zones = [];
        State.recv.samplers = [];
        // 计算每个区域在Canvas中的相对位置
        const pad = 15, gap = 8;
        const canvasSize = 400;
        const sz = (canvasSize - 2 * pad - (gs - 1) * gap) / canvasSize;
        const padR = pad / canvasSize;
        const gapR = gap / canvasSize;
        let id = 0;
        for (let r = 0; r < gs; r++) {
            for (let c = 0; c < gs; c++) {
                const rx = padR + c * (sz + gapR);
                const ry = padR + r * (sz + gapR);
                const sampler = new RecvSampler(id);
                sampler.relX = rx;
                sampler.relY = ry;
                sampler.relW = sz;
                sampler.relH = sz;
                State.recv.samplers.push(sampler);
                id++;
            }
        }
        // 初始化LT解码器
        const fsize = State.params.fragmentSize;
        const text = document.getElementById('textInput').value;
        const bytes = textToBytes(text || 'dummy');
        const numFragments = Math.max(1, Math.ceil(bytes.length / fsize));
        State.recv.decoder = new LTDecoder(numFragments, fsize);
        updateRecvStatus();
    }

    function updateRecvStatus() {
        const el = document.getElementById('recvStatus');
        el.innerHTML = '';
        State.recv.samplers.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'status-card';
            card.innerHTML = `
                <h3>区域 ${i + 1}</h3>
                <div class="status-item"><span>亮度:</span><span id="rz-br-${i}">-</span></div>
                <div class="status-item"><span>阈值:</span><span id="rz-th-${i}">-</span></div>
                <div class="status-item"><span>已收集:</span><span id="rz-col-${i}">0</span></div>
                <div class="status-item"><span>状态:</span><span id="rz-st-${i}">SEARCH</span></div>
            `;
            el.appendChild(card);
        });
    }

    /**
     * 计算图像区域的平均亮度
     */
    function getRegionBrightness(video, relX, relY, relW, relH, offsetX, offsetY, scale) {
        const vw = video.videoWidth || video.width;
        const vh = video.videoHeight || video.height;
        // 应用偏移和缩放
        const cx = 0.5 + (relX + relW / 2 - 0.5) * scale + offsetX;
        const cy = 0.5 + (relY + relH / 2 - 0.5) * scale + offsetY;
        const w = relW * scale;
        const h = relH * scale;
        // 取中心50%面积
        const innerW = w * 0.5;
        const innerH = h * 0.5;
        const sx = Math.max(0, (cx - innerW / 2) * vw);
        const sy = Math.max(0, (cy - innerH / 2) * vh);
        const sw = Math.min(vw - sx, innerW * vw);
        const sh = Math.min(vh - sy, innerH * vh);
        if (sw <= 0 || sh <= 0) return -1;
        analysisCanvas.width = Math.max(1, Math.floor(sw));
        analysisCanvas.height = Math.max(1, Math.floor(sh));
        analysisCtx.drawImage(video, sx, sy, sw, sh, 0, 0, analysisCanvas.width, analysisCanvas.height);
        const imgData = analysisCtx.getImageData(0, 0, analysisCanvas.width, analysisCanvas.height);
        let sum = 0, count = 0;
        for (let i = 0; i < imgData.data.length; i += 4) {
            // 亮度 = 0.299R + 0.587G + 0.114B
            sum += 0.299 * imgData.data[i] + 0.587 * imgData.data[i + 1] + 0.114 * imgData.data[i + 2];
            count++;
        }
        return count > 0 ? sum / count : -1;
    }

    /**
     * 自适应阈值
     */
    function adaptiveThreshold(sampler, brightness) {
        sampler.brightnessHistory.push(brightness);
        if (sampler.brightnessHistory.length > 20) sampler.brightnessHistory.shift();
        if (sampler.brightnessHistory.length < 3) return 128;
        let min = Infinity, max = -Infinity;
        for (const v of sampler.brightnessHistory) {
            if (v < min) min = v;
            if (v > max) max = v;
        }
        const range = max - min;
        if (range < 20) return -1; // 无信号
        return (max + min) / 2;
    }

    /**
     * 绘制叠加层（采样框）
     */
    function drawOverlay() {
        const vw = recvVideo.videoWidth || recvVideo.width;
        const vh = recvVideo.videoHeight || recvVideo.height;
        const dispW = recvVideo.clientWidth;
        const dispH = recvVideo.clientHeight;
        overlayCanvas.width = dispW;
        overlayCanvas.height = dispH;
        overlayCtx.clearRect(0, 0, dispW, dispH);
        const scaleX = dispW / vw;
        const scaleY = dispH / vh;
        const offsetX = parseFloat(document.getElementById('offsetX').value) || 0;
        const offsetY = parseFloat(document.getElementById('offsetY').value) || 0;
        const scale = parseFloat(document.getElementById('scaleFactor').value) || 1;
        State.recv.samplers.forEach((s, i) => {
            const cx = 0.5 + (s.relX + s.relW / 2 - 0.5) * scale + offsetX;
            const cy = 0.5 + (s.relY + s.relH / 2 - 0.5) * scale + offsetY;
            const w = s.relW * scale;
            const h = s.relH * scale;
            const dx = (cx - w / 2) * dispW;
            const dy = (cy - h / 2) * dispH;
            const dw = w * dispW;
            const dh = h * dispH;
            overlayCtx.strokeStyle = '#4CAF50';
            overlayCtx.lineWidth = 2;
            overlayCtx.strokeRect(dx, dy, dw, dh);
            overlayCtx.fillStyle = '#4CAF50';
            overlayCtx.font = '12px monospace';
            overlayCtx.fillText(`Z${i + 1}`, dx + 3, dy + 14);
        });
    }

    /**
     * 曼彻斯特解码 + 数据包解析
     * 每T ms产生一个符号，每2个符号产生1个比特
     */
    function processSymbol(sampler, symbolValue) {
        sampler.symbolBuffer.push(symbolValue);
        if (sampler.symbolBuffer.length === 2) {
            const s0 = sampler.symbolBuffer[0];
            const s1 = sampler.symbolBuffer[1];
            sampler.symbolBuffer = [];
            let bit = -1;
            if (s0 === 0 && s1 === 1) bit = 0;
            else if (s0 === 1 && s1 === 0) bit = 1;
            // else: 无效，跳过
            if (bit >= 0) {
                sampler.bitBuffer.push(bit);
                processBits(sampler);
            }
        }
    }

    function processBits(sampler) {
        const fsize = State.params.fragmentSize;
        const pktBytes = 3 + fsize + 1; // 包头+序号+数据+校验
        const pktBits = pktBytes * 8;

        if (sampler.state === 'SEARCH') {
            // 搜索包头 10101010 = 0xAA
            const headerBits = [1, 0, 1, 0, 1, 0, 1, 0];
            const buf = sampler.bitBuffer;
            // 在缓冲区中搜索
            while (buf.length >= 8) {
                let found = true;
                for (let i = 0; i < 8; i++) {
                    if (buf[i] !== headerBits[i]) { found = false; break; }
                }
                if (found) {
                    // 找到包头，开始接收数据包
                    sampler.state = 'RECV';
                    sampler.packetBits = buf.slice(8); // 包头之后的比特
                    buf.splice(0, 8);
                    break;
                } else {
                    buf.shift();
                }
            }
            // 限制缓冲区大小
            if (sampler.bitBuffer.length > pktBits * 3) {
                sampler.bitBuffer = sampler.bitBuffer.slice(-pktBits);
            }
        }

        if (sampler.state === 'RECV') {
            if (sampler.packetBits.length >= pktBits) {
                const bits = sampler.packetBits.slice(0, pktBits);
                sampler.packetBits = sampler.packetBits.slice(pktBits);
                // 解析数据包（包含包头）
                const fullBits = [1, 0, 1, 0, 1, 0, 1, 0, ...bits];
                const pkt = decodePacket(fullBits);
                if (pkt) {
                    // 重新用种子生成indices
                    const lcg = new LCG(pkt.seed + 12345);
                    const dist = new RobustSoliton(State.recv.decoder.K);
                    const degree = dist.sample(lcg);
                    const indices = new Set();
                    while (indices.size < degree) indices.add(lcg.nextInt(State.recv.decoder.K));
                    const added = State.recv.decoder.addPacket(pkt.seed, degree, Array.from(indices), pkt.data);
                    if (added) {
                        sampler.collectedSeeds.add(pkt.seed);
                        log('recvLog', `Z${sampler.id + 1}: 收到分片 seed=${pkt.seed}, degree=${degree}`);
                        checkDecodeComplete();
                    }
                }
                // 继续搜索下一个包头
                sampler.state = 'SEARCH';
            }
        }
    }

    function checkDecodeComplete() {
        const dec = State.recv.decoder;
        const total = dec.K;
        const done = dec.decoded;
        const pct = Math.floor(done / total * 100);
        const fill = document.getElementById('progressFill');
        fill.style.width = pct + '%';
        fill.textContent = `${done}/${total} (${pct}%)`;
        if (dec.isComplete()) {
            const result = dec.getResult();
            document.getElementById('resultBox').textContent = result || '(解码失败)';
            log('recvLog', `✅ 解码成功! 文本: ${result}`, 'info');
            // 播放提示音
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                osc.frequency.value = 880;
                osc.connect(actx.destination);
                osc.start();
                setTimeout(() => { osc.stop(); actx.close(); }, 200);
            } catch (e) {}
        }
    }

    /**
     * 接收端主循环
     */
    let lastRecvTime = 0;
    function recvLoop(timestamp) {
        if (!State.recv.running) return;
        const T = State.params.symbolDuration;
        const offsetX = parseFloat(document.getElementById('offsetX').value) || 0;
        const offsetY = parseFloat(document.getElementById('offsetY').value) || 0;
        const scale = parseFloat(document.getElementById('scaleFactor').value) || 1;

        State.recv.samplers.forEach((s, i) => {
            const br = getRegionBrightness(recvVideo, s.relX, s.relY, s.relW, s.relH, offsetX, offsetY, scale);
            if (br < 0) return;
            s.lastBrightness = br;
            s.frameCount++;
            const th = adaptiveThreshold(s, br);
            if (th < 0) return; // 无信号
            s.threshold = th;
            const bit = br > th ? 1 : 0;
            s.currentBit = bit;
            // 符号计时：每T ms产生一个符号
            s.symbolTimer += 33; // 约30fps
            if (s.symbolTimer >= T) {
                s.symbolTimer -= T;
                processSymbol(s, bit);
            }
            // 更新UI
            const brEl = document.getElementById(`rz-br-${i}`);
            const thEl = document.getElementById(`rz-th-${i}`);
            const colEl = document.getElementById(`rz-col-${i}`);
            const stEl = document.getElementById(`rz-st-${i}`);
            if (brEl) brEl.textContent = Math.round(br);
            if (thEl) thEl.textContent = Math.round(th);
            if (colEl) colEl.textContent = s.collectedSeeds.size;
            if (stEl) stEl.textContent = s.state;
        });
        drawOverlay();
        State.recv.animId = requestAnimationFrame(recvLoop);
    }

    async function startRecv() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'environment' },
                audio: false
            });
            State.recv.stream = stream;
            recvVideo.srcObject = stream;
            await recvVideo.play();
            initRecvZones();
            State.recv.running = true;
            document.getElementById('startRecvBtn').disabled = true;
            document.getElementById('stopRecvBtn').disabled = false;
            log('recvLog', '摄像头已启动', 'info');
            State.recv.animId = requestAnimationFrame(recvLoop);
        } catch (e) {
            log('recvLog', '摄像头权限被拒绝: ' + e.message, 'error');
            alert('无法访问摄像头，请确保在HTTPS环境下运行，并授予摄像头权限。');
        }
    }

    function stopRecv() {
        State.recv.running = false;
        if (State.recv.animId) cancelAnimationFrame(State.recv.animId);
        if (State.recv.stream) {
            State.recv.stream.getTracks().forEach(t => t.stop());
            State.recv.stream = null;
        }
        recvVideo.srcObject = null;
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        document.getElementById('startRecvBtn').disabled = false;
        document.getElementById('stopRecvBtn').disabled = true;
        log('recvLog', '已停止');
    }

    function resetRecv() {
        const fsize = State.params.fragmentSize;
        const text = document.getElementById('textInput').value;
        const bytes = textToBytes(text || 'dummy');
        const numFragments = Math.max(1, Math.ceil(bytes.length / fsize));
        State.recv.decoder = new LTDecoder(numFragments, fsize);
        State.recv.samplers.forEach(s => {
            s.bitBuffer = [];
            s.symbolBuffer = [];
            s.packetBits = [];
            s.state = 'SEARCH';
            s.collectedSeeds.clear();
            s.symbolTimer = 0;
        });
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('progressFill').textContent = '0%';
        document.getElementById('resultBox').textContent = '等待接收...';
        updateRecvStatus();
        log('recvLog', '解码器已重置');
    }

    // ================================================================
    //  模式切换
    // ================================================================
    function setMode(mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
        const sp = document.getElementById('sendPanel');
        const rp = document.getElementById('recvPanel');
        if (mode === 'send') {
            sp.classList.remove('hidden');
            rp.classList.add('hidden');
        } else if (mode === 'recv') {
            sp.classList.add('hidden');
            rp.classList.remove('hidden');
        } else {
            sp.classList.remove('hidden');
            rp.classList.remove('hidden');
        }
    }

    // ================================================================
    //  参数同步
    // ================================================================
    function syncParams() {
        State.params.zoneCount = parseInt(document.getElementById('zoneCount').value);
        State.params.symbolDuration = parseInt(document.getElementById('symbolDuration').value);
        State.params.fragmentSize = parseInt(document.getElementById('fragmentSize').value);
        State.params.gridSize = Math.round(Math.sqrt(State.params.zoneCount));
    }

    // ================================================================
    //  事件绑定
    // ================================================================
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });
    document.getElementById('startBtn').addEventListener('click', () => { syncParams(); startSend(); });
    document.getElementById('pauseBtn').addEventListener('click', pauseSend);
    document.getElementById('resetBtn').addEventListener('click', resetSend);
    document.getElementById('startRecvBtn').addEventListener('click', () => { syncParams(); startRecv(); });
    document.getElementById('stopRecvBtn').addEventListener('click', stopRecv);
    document.getElementById('resetRecvBtn').addEventListener('click', resetRecv);

    // ================================================================
    //  初始化
    // ================================================================
    sendCtx.fillStyle = '#000';
    sendCtx.fillRect(0, 0, 400, 400);
    sendCtx.fillStyle = '#4CAF50';
    sendCtx.font = '18px sans-serif';
    sendCtx.textAlign = 'center';
    sendCtx.textBaseline = 'middle';
    sendCtx.fillText('等待开始...', 200, 200);
    log('sendLog', '系统就绪。输入文本后点击"开始发送"。');
    log('recvLog', '系统就绪。点击"开始接收"启动摄像头。');
    setMode('both');
    </script>
</body>
</html>
