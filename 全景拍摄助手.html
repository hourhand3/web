<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全景拍摄助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111; color: #eee; overflow: hidden;
    height: 100dvh; display: flex; flex-direction: column;
  }
  #camera-wrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 画面中央准星 */
  #guide-cross {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; transform: translate(-50%, -50%);
    pointer-events: none; transition: all 0.2s;
    z-index: 10; opacity: 0.6;
  }
  #guide-cross::before, #guide-cross::after {
    content: ""; position: absolute; background: #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  #guide-cross::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #guide-cross::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #guide-cross.aligned::before, #guide-cross.aligned::after { background: #4caf50; }

  /* 动态引导线（从目标点指向准星的尾巴，代表你需要转动的方向） */
  #guide-line {
    position: absolute; height: 4px; background: #fff;
    transform-origin: 0 50%; border-radius: 2px;
    pointer-events: none; z-index: 15;
    box-shadow: 0 0 6px rgba(0,0,0,0.5); display: none;
  }
  #guide-line::after {
    content: ""; position: absolute; right: -6px; top: -6px;
    border-top: 8px solid transparent; border-bottom: 8px solid transparent;
    border-left: 12px solid #fff;
  }

  /* 目标点及外圈 */
  #target-dot {
    position: absolute; left: 50%; top: 50%;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(33, 150, 243, 0.95);
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 20;
    transition: width 0.2s, height 0.2s, background 0.2s;
    box-shadow: 0 0 10px rgba(33, 150, 243, 0.6);
  }
  #target-ring {
    position: absolute; left: 50%; top: 50%;
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 19;
    transition: width 0.2s, height 0.2s, border-color 0.2s;
  }
  #target-dot.near {
    width: 16px; height: 16px; background: #4caf50;
    box-shadow: 0 0 15px rgba(76,175,80,0.8);
  }
  #target-ring.near { width: 40px; height: 40px; border-color: #4caf50; }
  #target-ring.hidden { display: none; }

  /* 顶部状态栏 */
  #status {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 14px; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    z-index: 30;
  }
  #status .count { font-weight: 600; }
  #status .hint {
    font-size: 14px; font-weight: bold; text-align: right; max-width: 65%;
    color: #ffd400; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  }
  #status .hint.aligned { color: #4caf50; }

  /* 调试面板 */
  #debug-info {
    position: absolute; left: 8px; bottom: 8px;
    font: 11px/1.4 monospace; color: #9f9;
    background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 4px;
    white-space: pre; display: none; pointer-events: none; z-index: 40;
  }
  body.debug #debug-info { display: block; }

  /* 底部控制 */
  #controls {
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: #1a1a1a; display: flex; flex-direction: column; gap: 10px;
    z-index: 50;
  }
  .mode-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #bbb; }
  .mode-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #ffd400; }
  .mode-row .sub { font-size: 11px; opacity: .65; }

  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #btn-shoot { background: #ffd400; color: #111; }
  #btn-save-all { background: #4caf50; color: #fff; }
  #btn-skip { background: #555; color: #eee; flex: 0 0 auto; padding: 14px 14px; }
  #btn-reset { background: #333; color: #eee; flex: 0 0 auto; padding: 14px 14px; }

  #thumbs {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 0;
    min-height: 56px; align-items: center;
  }
  #thumbs:empty::after {
    content: "尚未拍摄"; font-size: 12px; color: #555; padding-left: 4px;
  }
  #thumbs img {
    width: 50px; height: 50px; object-fit: cover; border-radius: 6px;
    flex: 0 0 auto; border: 1px solid #333;
  }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
    border-radius: 20px; font-size: 13px; max-width: 85vw; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 100;
  }
  #toast.show { opacity: 1; }

  /* 弹窗 */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 200;
  }
  #modal.show { display: flex; }
  #modal .card {
    background: #222; border-radius: 14px; padding: 22px; max-width: 380px;
    width: 100%; font-size: 14px; line-height: 1.6;
  }
  #modal h3 { font-size: 16px; margin-bottom: 10px; color: #ffd400; }
  #modal p { color: #ccc; margin-bottom: 8px; }
  #modal .note { font-size: 12px; color: #999; margin-top: 8px; }
  #modal .actions { display: flex; gap: 10px; margin-top: 16px; }
  #modal .actions button { padding: 12px; font-size: 15px; }
  #modal .cancel { background: #444; color: #eee; }
  #modal .confirm { background: #4caf50; color: #fff; }

  /* 快门闪光 */
  #shutter-flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; transition: opacity .08s; z-index: 150;
  }
  #shutter-flash.flash { opacity: .7; }
</style>
</head>
<body>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  
  <!-- 中央准星 -->
  <div id="guide-cross"></div>

  <!-- 引导线与目标点 -->
  <div id="guide-line"></div>
  <div id="target-ring" class="hidden"></div>
  <div id="target-dot" class="hidden"></div>

  <div id="status">
    <span class="count">已拍 <b id="shot-count">0</b> 张</span>
    <span class="hint" id="orient-hint">初始化中…</span>
  </div>
  
  <div id="debug-info"></div>
</div>

<div id="controls">
  <div class="mode-row">
    <input type="checkbox" id="mode-batch" checked>
    <label for="mode-batch">
      全部拍完后一次性保存
      <span class="sub">（关闭则每拍一张立即保存）</span>
    </label>
  </div>

  <div id="thumbs"></div>

  <div class="btn-row">
    <button id="btn-shoot" disabled>强制拍摄</button>
    <button id="btn-save-all" disabled>保存全部</button>
    <button id="btn-skip">跳过</button>
    <button id="btn-reset">重置</button>
  </div>
</div>

<div id="toast"></div>

<div id="modal">
  <div class="card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="actions">
      <button class="cancel" id="modal-cancel">取消</button>
      <button class="confirm" id="modal-confirm">开始保存</button>
    </div>
  </div>
</div>

<div id="shutter-flash"></div>

<script>
(function () {
  'use strict';

  const VERSION = '2.1.0';
  const DEBUG = /[?&]debug=1/.test(location.search);
  if (DEBUG) document.body.classList.add('debug');

  function log(...a) { if (DEBUG) console.log(`[pano v${VERSION}]`, ...a); }

  // ================= 核心配置 =================
  // 如果发现水平转动的方向相反，把这里改成 1
  const HEADING_SIGN = -1; 
  const PITCH_SIGN = 1;
  
  const NEAR_DEG = 15;          // 误差在 15 度以内算对准（进入吸附区）
  const AUTO_SHOOT_DELAY = 600; // 吸附后停留 600ms 自动拍摄
  const AUTO_SHOOT = true;      // 是否开启自动拍摄

  // 引导球面半径（屏幕上像素距离，决定了视觉上的远近）
  const SPHERE_RADIUS = 220; 
  // ============================================

  // ---------- DOM ----------
  const video       = document.getElementById('video');
  const shotCountEl = document.getElementById('shot-count');
  const thumbsEl    = document.getElementById('thumbs');
  const btnShoot    = document.getElementById('btn-shoot');
  const btnSaveAll  = document.getElementById('btn-save-all');
  const btnSkip     = document.getElementById('btn-skip');
  const btnReset    = document.getElementById('btn-reset');
  const modeBatch   = document.getElementById('mode-batch');
  const toastEl     = document.getElementById('toast');
  const modal       = document.getElementById('modal');
  const modalTitle  = document.getElementById('modal-title');
  const modalBody   = document.getElementById('modal-body');
  const modalCancel = document.getElementById('modal-cancel');
  const modalConfirm= document.getElementById('modal-confirm');
  
  const targetDot   = document.getElementById('target-dot');
  const targetRing  = document.getElementById('target-ring');
  const guideLine   = document.getElementById('guide-line');
  const crosshair   = document.getElementById('guide-cross');
  const orientHint  = document.getElementById('orient-hint');
  const debugInfo   = document.getElementById('debug-info');
  const flashEl     = document.getElementById('shutter-flash');

  document.title = `全景助手 v${VERSION}`;

  // ---------- 状态 ----------
  const shots = [];
  let stream = null;

  let hasOrientation = false;
  let rawHeading = 0, rawPitch = 0;
  let smoothHeading = 0, smoothPitch = 0;
  let hasSmoothInit = false;
  let orientEventCount = 0;
  let guideIndex = 0;
  let lockStart = 0;
  let isAutoShooting = false;

  // 目标点序列：更符合人操作直觉的顺序
  // 先水平一圈(12个)，再低头一圈(4个)，再抬头一圈(4个)
  function buildGuideTargets() {
    const t = [];
    for (let i = 0; i < 12; i++) t.push({ heading: i * 30, pitch: 0 });
    for (let i = 0; i < 4; i++) t.push({ heading: i * 90, pitch: -45 }); // 脚
    for (let i = 0; i < 4; i++) t.push({ heading: i * 90, pitch: 45 });  // 天
    return t;
  }
  const guideTargets = buildGuideTargets();

  // ---------- 工具 ----------
  function showToast(msg, duration = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), duration);
  }
  function flash() {
    flashEl.classList.add('flash');
    setTimeout(() => flashEl.classList.remove('flash'), 90);
  }
  function updateCount() { shotCountEl.textContent = shots.length; }
  function pad(n) { return String(n).padStart(3, '0'); }
  function makeFileName(idx) {
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    return `pano_${pad(idx + 1)}_${ts}.jpg`;
  }
  function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  function angleDiff(a, b) { return ((a - b + 540) % 360) - 180; }
  function smoothAngle(oldVal, newVal, k) { return oldVal + angleDiff(newVal, oldVal) * k; }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  // ---------- 摄像头 ----------
  async function initCamera() {
    if (stream) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      btnShoot.disabled = false;
      orientHint.textContent = '请按提示寻找目标点';
    } catch (err) {
      console.error(err);
      orientHint.textContent = '无法访问摄像头';
      showToast('无法访问摄像头：' + (err.message || err.name));
    }
  }

  // ---------- 方向传感器 ----------
  function onOrientation(e) {
    hasOrientation = true;
    orientEventCount++;

    if (typeof e.webkitCompassHeading === 'number') {
      rawHeading = e.webkitCompassHeading;
    } else if (typeof e.alpha === 'number') {
      rawHeading = (360 - e.alpha) % 360;
    }
    if (typeof e.beta === 'number') {
      rawPitch = 90 - e.beta;
      if (rawPitch > 90) rawPitch = 90;
      if (rawPitch < -90) rawPitch = -90;
    }

    const h = (rawHeading * HEADING_SIGN + 360) % 360;
    const p = rawPitch * PITCH_SIGN;

    if (!hasSmoothInit) {
      smoothHeading = h;
      smoothPitch = p;
      hasSmoothInit = true;
    } else {
      smoothHeading = smoothAngle(smoothHeading, h, 0.2);
      smoothPitch += (p - smoothPitch) * 0.2;
    }

    updateUI();
  }

  async function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent === 'undefined') return;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === 'granted') {
          window.addEventListener('deviceorientation', onOrientation, true);
        }
      } catch (e) { console.warn(e); }
    } else {
      window.addEventListener('deviceorientation', onOrientation, true);
    }
  }

  // ---------- UI 与 引导核心逻辑 ----------
  function updateUI() {
    if (!hasOrientation) return;

    if (guideIndex >= guideTargets.length) {
      targetDot.classList.add('hidden');
      targetRing.classList.add('hidden');
      guideLine.style.display = 'none';
      orientHint.textContent = '全部目标已拍完！';
      orientHint.classList.remove('aligned');
      return;
    }

    const t = guideTargets[guideIndex];
    const hDiff = angleDiff(t.heading, smoothHeading);
    const pDiff = t.pitch - smoothPitch;
    
    // 判断是否进入了微观的“吸附区”
    const near = Math.abs(hDiff) < NEAR_DEG && Math.abs(pDiff) < NEAR_DEG;

    // 屏幕坐标系计算（球面投影）
    // hDiff < 0 (目标在右侧)，点在屏幕右侧
    // hDiff > 0 (目标在左侧)，点在屏幕左侧
    // 视野角度设定为 FOV_H = 70度 (手机广角)，垂直 FOV_V = 50度
    const fovH = 70, fovV = 50;
    
    // 计算目标点应当在屏幕上的坐标 (中心点为 50, 50)
    // 注意这里加入了 SPHERE_RADIUS 的缩放，让转动的幅度看起来更自然
    let cx = 50 - (hDiff / fovH) * 100;
    let cy = 50 - (pDiff / fovV) * 100;

    // 如果偏差极大，超出屏幕过多，限制在边缘
    cx = Math.max(-20, Math.min(120, cx));
    cy = Math.max(-20, Math.min(120, cy));

    // 如果进入了吸附区，强制动画平移中心
    if (near) {
      cx = 50; 
      cy = 50;
    }

    // 更新目标点位置
    targetDot.classList.remove('hidden');
    targetRing.classList.remove('hidden');
    targetDot.style.left = cx + '%';
    targetDot.style.top  = cy + '%';
    targetRing.style.left = cx + '%';
    targetRing.style.top  = cy + '%';

    // 更新引导线（仅在未吸附且目标在视野内或边缘时显示）
    if (!near) {
      // 屏幕中心像素位置
      const rect = video.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      // 目标点在屏幕上的像素位置
      const tx = (cx / 100) * rect.width;
      const ty = (cy / 100) * rect.height;

      const dx = tx - centerX;
      const dy = ty - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // 如果目标在屏幕内部（距离小于300px），画出指示线
      if (dist < 300) {
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);
        guideLine.style.display = 'block';
        // 线条从目标点出发，指向中心
        // 为了不让线条盖住准星，计算线条长度
        const len = Math.max(0, dist - 30); 
        guideLine.style.left = tx + 'px';
        guideLine.style.top  = ty + 'px';
        guideLine.style.width = len + 'px';
        guideLine.style.transform = `rotate(${angle + 180}deg)`; // 指向中心
        guideLine.style.background = '#fff';
        guideLine.style.height = '3px';
      } else {
        guideLine.style.display = 'none';
      }
    } else {
      guideLine.style.display = 'none';
    }

    // 状态更新
    if (near) {
      targetDot.classList.add('near');
      targetRing.classList.add('near');
      crosshair.classList.add('aligned');
      orientHint.classList.add('aligned');
      
      const now = performance.now();
      if (!lockStart) {
        lockStart = now;
        vibrate(50);
        orientHint.textContent = '已对准，请保持…';
      } else if (AUTO_SHOOT && !isAutoShooting && (now - lockStart >= AUTO_SHOOT_DELAY)) {
        isAutoShooting = true;
        vibrate(100);
        orientHint.textContent = '自动拍摄！';
        capture(true);
      } else if (!AUTO_SHOOT) {
        orientHint.textContent = '已对准，点击拍摄';
      } else {
        const left = Math.max(0, AUTO_SHOOT_DELAY - (now - lockStart)) / 1000;
        orientHint.textContent = `保持不动… ${left.toFixed(1)}s`;
      }
    } else {
      lockStart = 0;
      isAutoShooting = false;
      targetDot.classList.remove('near');
      targetRing.classList.remove('near');
      crosshair.classList.remove('aligned');
      orientHint.classList.remove('aligned');
      
      // 生成直观的转动指引
      let hTxt = '';
      if (Math.abs(hDiff) > NEAR_DEG) {
        hTxt = hDiff > 0 ? '向左转' : '向右转';
      } else {
        hTxt = '水平已对齐';
      }
      
      let pTxt = '';
      if (Math.abs(pDiff) > NEAR_DEG) {
        pTxt = pDiff > 0 ? '抬头' : '低头';
      } else {
        pTxt = '';
      }

      orientHint.textContent = `${hTxt} ${pTxt} (剩 ${guideTargets.length - guideIndex})`;
    }

    if (DEBUG) {
      debugInfo.textContent =
        `v${VERSION}  ev:${orientEventCount}\n` +
        `rawH:${rawHeading.toFixed(1)} rawP:${rawPitch.toFixed(1)}\n` +
        `smH:${smoothHeading.toFixed(1)} smP:${smoothPitch.toFixed(1)}\n` +
        `hD:${hDiff.toFixed(1)} pD:${pDiff.toFixed(1)}\n` +
        `idx:${guideIndex}/${guideTargets.length}\n` +
        `near:${near} lock:${lockStart?'Y':'N'}`;
    }
  }

  function advanceGuide() {
    if (guideIndex < guideTargets.length) guideIndex++;
    lockStart = 0;
    isAutoShooting = false;
    updateUI();
  }

  function skipGuide() {
    if (guideIndex >= guideTargets.length) return;
    advanceGuide();
    showToast(`已跳过，进度 ${guideIndex}/${guideTargets.length}`);
  }

  // ---------- 拍摄 ----------
  async function capture(isAuto = false) {
    if (!stream) return;
    flash();

    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { isAutoShooting = false; return; }

    const canvas = document.createElement('canvas');
    canvas.width = vw; canvas.height = vh;
    canvas.getContext('2d').drawImage(video, 0, 0, vw, vh);

    canvas.toBlob((blob) => {
      if (!blob) { isAutoShooting = false; return; }
      const name = makeFileName(shots.length);
      const url = URL.createObjectURL(blob);
      shots.push({ blob, url, name });

      const img = document.createElement('img');
      img.src = url; img.alt = name;
      thumbsEl.appendChild(img);
      thumbsEl.scrollLeft = thumbsEl.scrollWidth;

      updateCount();
      btnSaveAll.disabled = shots.length === 0;

      if (!modeBatch.checked) {
        downloadBlob(blob, name);
        if (!isAuto) showToast(`第 ${shots.length} 张已保存`);
      } else if (isAuto) {
        showToast(`自动拍摄：第 ${shots.length} 张`, 1000);
      }

      if (isAuto) {
        advanceGuide();
      }
    }, 'image/jpeg', 0.92);
  }

  // ---------- 保存与重置 ----------
  function openSaveConfirm() {
    if (shots.length === 0) { showToast('还没有拍摄照片'); return; }
    modalTitle.textContent = `即将保存 ${shots.length} 张照片`;
    modalBody.innerHTML = `<p>照片将保存到下载目录。</p><p class="note">文件已按顺序编号。</p>`;
    modal.classList.add('show');
  }

  async function saveAll() {
    modal.classList.remove('show');
    showToast(`开始保存 ${shots.length} 张…`, 3000);
    for (let i = 0; i < shots.length; i++) {
      downloadBlob(shots[i].blob, shots[i].name);
      await new Promise(r => setTimeout(r, 350));
    }
  }

  function reset() {
    shots.forEach(s => URL.revokeObjectURL(s.url));
    shots.length = 0;
    thumbsEl.innerHTML = '';
    guideIndex = 0;
    lockStart = 0;
    isAutoShooting = false;
    updateCount();
    btnSaveAll.disabled = true;
    updateUI();
    showToast('已重置');
  }

  // ---------- 事件绑定 ----------
  btnShoot.addEventListener('click', () => capture(false));
  btnSaveAll.addEventListener('click', openSaveConfirm);
  btnSkip.addEventListener('click', skipGuide);
  btnReset.addEventListener('click', reset);
  modalConfirm.addEventListener('click', saveAll);
  modalCancel.addEventListener('click', () => modal.classList.remove('show'));

  document.addEventListener('touchmove', (e) => {
    if (!thumbsEl.contains(e.target)) e.preventDefault();
  }, { passive: false });

  // ---------- 启动 ----------
  (async function start() {
    await initCamera();
    await requestOrientationPermission();
    setInterval(updateUI, 100);
  })();

})();
</script>
</body>
</html>
