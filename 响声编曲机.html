<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔔 响声编曲机 · 自然音色版</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #12141a; color: #e8eaf0; min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.lead { color: #9aa3b8; margin: 0 0 20px; font-size: 14px; line-height: 1.7; max-width: 800px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #2c3040; background: #1c2029; color: #e8eaf0;
    cursor: pointer; transition: .15s;
  }
  button:hover { background: #252a36; border-color: #3a4055; }
  button.primary { background: #3b5bfd; border-color: #3b5bfd; color: #fff; font-weight: 600; }
  button.primary:hover { background: #5470ff; }
  button.accent { background: #1d3a2e; border-color: #2e6b50; color: #7ef0be; }
  button.accent:hover { background: #234a3a; }
  label { font-size: 13px; color: #9aa3b8; display: flex; align-items: center; gap: 6px; }
  select { background: #1c2029; color: #e8eaf0; border: 1px solid #2c3040; border-radius: 8px; padding: 6px 8px; font: inherit; }
  input[type=range] { width: 110px; accent-color: #3b5bfd; }
  .hint { font-size: 12.5px; color: #6f7891; margin-bottom: 12px; line-height: 1.7; }
  .status { font-size: 13px; min-height: 20px; margin: 6px 0 16px; color: #7ef0be; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 760px; }
  @media (max-width: 560px) { .slots { grid-template-columns: repeat(2, 1fr); } }
  .slot {
    position: relative; aspect-ratio: 1 / 1.06;
    border-radius: 14px; border: 1px solid #262b38; background: #171a22;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer; transition: .12s; user-select: none;
  }
  .slot:hover { border-color: #3a4055; background: #1c2029; }
  .slot.filled { background: #17202e; border-color: #2d4460; }
  .slot.recording { border-color: #ff4d6d; animation: pulse .45s infinite alternate; }
  .slot.hit { box-shadow: 0 0 0 3px #3b5bfd, 0 0 26px #3b5bfd99; transform: translateY(-2px); }
  @keyframes pulse { to { background: #2a1620; } }
  .note { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .det { font-size: 11px; letter-spacing: .3px; }
  .det.ok { color: #5fd0a0; }
  .det.warn { color: #ffb648; }
  .det.none { color: #6f7891; }
  .state { font-size: 10.5px; color: #6f7891; }
  .slot button { position: absolute; top: 6px; padding: 2px 7px; font-size: 12px; border-radius: 8px; line-height: 1.4; }
  .slot .rec { right: 6px; }
  .slot .clr { left: 6px; opacity: 0; transition: .15s; }
  .slot.filled .clr, .slot:hover .clr { opacity: .8; }
  .slot.moved { animation: flash .7s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px #5fd0a0; } 100% { box-shadow: 0 0 0 0 transparent; } }
</style>
</head>
<body>

<h1>🔔 响声编曲机 · 自然音色版</h1>
<p class="lead">
  录下短促的响声，程序自动检测音高并分配到最合适的音上。
  播放时通过<b>共振滤波 + 混响 + 失谐叠加</b>把打击声"乐器化"，让旋律更容易听出来。
</p>

<div class="controls">
  <button id="demoBtn">✨ 填充示例响声</button>
  <button id="detectBtn">🔍 检测音高</button>
  <button id="autoBtn" class="accent">🎯 自动分配音位</button>
  <button id="clearBtn">🗑 全部清空</button>
</div>
<div class="controls">
  <label>曲子 <select id="tuneSel"></select></label>
  <label>速度 <input type="range" id="tempo" min="60" max="220" value="120"><span id="tempoVal">120</span></label>
  <button id="playBtn" class="primary">▶ 播放</button>
</div>

<div class="status" id="status"></div>

<div class="hint">
  点格子上的 <b>🎤</b> 录 0.5 秒；点格子本身试听；空格子点一下直接开始录。<br>
  录完会自动检测音高。点「🎯 自动分配音位」按实际音高重排，让每个响声的变调幅度最小。
</div>

<div id="slots" class="slots"></div>

<script>
/* ===================== 音频环境 ===================== */
const AC = new (window.AudioContext || window.webkitAudioContext)();

// 主输出链：干声/混响都汇入 master → 压缩器 → 输出
const master = AC.createGain();
master.gain.value = 0.85;
const comp = AC.createDynamicsCompressor();
comp.threshold.value = -14;
comp.ratio.value = 3;
comp.attack.value = 0.003;
comp.release.value = 0.25;
master.connect(comp).connect(AC.destination);

// 生成一段简单的脉冲响应，作为混响空间
function makeImpulse(duration, decay) {
  const rate = AC.sampleRate;
  const length = Math.floor(rate * duration);
  const impulse = AC.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

const reverb = AC.createConvolver();
reverb.buffer = makeImpulse(1.8, 2.6);
const reverbGain = AC.createGain();
reverbGain.gain.value = 0.28;
reverb.connect(reverbGain).connect(master);

// 所有音符的混响发送统一走这个总线
const reverbBus = AC.createGain();
reverbBus.gain.value = 1.0;
reverbBus.connect(reverb);

// 全局输出再加一层柔和的低通，去掉过亮的毛刺
const softener = AC.createBiquadFilter();
softener.type = 'lowpass';
softener.frequency.value = 7500;
softener.Q.value = 0.5;

// 说明：实际链接在 trigger 内组装

const activeSources = new Set();

async function unlock() {
  if (AC.state === 'suspended') { try { await AC.resume(); } catch (e) {} }
}

/* ===================== 音名工具 ===================== */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function nameToMidi(name) {
  const m = /^([A-G])(#|b)?(-?\d+)$/.exec(name.trim());
  if (!m) throw new Error('无法识别的音名: ' + name);
  let semi = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]];
  if (m[2] === '#') semi++;
  if (m[2] === 'b') semi--;
  return semi + (parseInt(m[3], 10) + 1) * 12;
}
const freqToMidi = f => 69 + 12 * Math.log2(f / 440);
function midiToName(m) {
  const r = Math.round(m);
  return NOTE_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1);
}

/* ===================== 音高检测（YIN） ===================== */
function analyze(buffer) {
  const sr = buffer.sampleRate;
  const nch = buffer.numberOfChannels;
  const chans = [];
  for (let c = 0; c < nch; c++) chans.push(buffer.getChannelData(c));

  const factor = Math.max(1, Math.round(sr / 11025));
  const n = Math.floor(buffer.length / factor);
  if (n < 256) return null;
  const mono = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const base = i * factor;
    let s = 0;
    for (let k = 0; k < factor; k++) {
      let v = 0;
      for (let c = 0; c < nch; c++) v += chans[c][base + k];
      s += v / nch;
    }
    mono[i] = s / factor;
  }
  const sr2 = sr / factor;

  const win = Math.max(1, Math.floor(sr2 * 0.01));
  let bestPos = 0, bestE = -1;
  for (let p = 0; p + win <= n; p += win) {
    let e = 0;
    for (let i = p; i < p + win; i++) e += mono[i] * mono[i];
    if (e > bestE) { bestE = e; bestPos = p; }
  }
  if (bestE < 1e-8) return null;

  const N = Math.min(2048, n - bestPos);
  if (N < 256) return null;
  const x = mono.subarray(bestPos, bestPos + N);

  const minFreq = 80, maxFreq = 1100;
  const tauMin = Math.max(2, Math.floor(sr2 / maxFreq));
  const tauMax = Math.min(N - 2, Math.ceil(sr2 / minFreq));
  if (tauMax <= tauMin) return null;

  const d = new Float32Array(tauMax + 1);
  const limit = N - tauMax;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    let sum = 0;
    for (let i = 0; i < limit; i++) {
      const diff = x[i] - x[i + tau];
      sum += diff * diff;
    }
    d[tau] = sum;
  }

  const cmnd = new Float32Array(tauMax + 1);
  let running = 0;
  cmnd[tauMin] = 1;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    running += d[tau];
    cmnd[tau] = running > 0 ? d[tau] * (tau - tauMin + 1) / running : 1;
  }

  const THRESH = 0.15;
  let tauEst = -1;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    if (cmnd[tau] < THRESH) {
      while (tau + 1 <= tauMax && cmnd[tau + 1] < cmnd[tau]) tau++;
      tauEst = tau;
      break;
    }
  }
  if (tauEst < 0) {
    let bi = tauMin;
    for (let tau = tauMin; tau <= tauMax; tau++) if (cmnd[tau] < cmnd[bi]) bi = tau;
    if (cmnd[bi] > 0.5) return null;
    tauEst = bi;
  }

  let better = tauEst;
  if (tauEst > tauMin && tauEst < tauMax) {
    const y0 = cmnd[tauEst - 1], y1 = cmnd[tauEst], y2 = cmnd[tauEst + 1];
    const den = y0 - 2 * y1 + y2;
    if (Math.abs(den) > 1e-12) better = tauEst + (y0 - y2) / (2 * den);
  }

  const freq = sr2 / better;
  if (!isFinite(freq) || freq < minFreq || freq > maxFreq) return null;

  return { freq, clarity: Math.max(0, Math.min(1, 1 - cmnd[tauEst])) };
}

function detectSlot(s) {
  if (!s.buffer) { s.detectedMidi = undefined; s.clarity = 0; return; }
  const r = analyze(s.buffer);
  if (r) {
    const raw = freqToMidi(r.freq);
    s.detectedMidi = raw;                  // 保留浮点精度
    s.detectedRounded = Math.round(raw);   // 用于显示与匹配
    s.clarity = r.clarity;
  } else {
    s.detectedMidi = null;
    s.detectedRounded = null;
    s.clarity = 0;
  }
}

/* ===================== 槽位定义 ===================== */
const SLOT_DEFS = ['C4','D4','E4','F4','G4','A4','B4','C5'];
let slots = SLOT_DEFS.map(n => ({
  name: n, midi: nameToMidi(n),
  buffer: null, detectedMidi: undefined, detectedRounded: null, clarity: 0
}));

const slotsEl = document.getElementById('slots');
const statusEl = document.getElementById('status');
function setStatus(t) { statusEl.textContent = t; }

function render() {
  slotsEl.innerHTML = '';
  slots.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slot' + (s.buffer ? ' filled' : '');
    el.dataset.i = i;

    let detTxt = '—', detCls = 'det none';
    if (s.buffer) {
      if (s.detectedRounded != null) {
        detTxt = '♪ ' + midiToName(s.detectedRounded);
        const raw = Math.abs(s.detectedRounded - s.midi);
        const pc = ((raw % 12) + 12) % 12;
        const pcDist = Math.min(pc, 12 - pc);
        const lowConf = s.clarity < 0.4;
        detCls = (pcDist > 1.6 || lowConf) ? 'det warn' : 'det ok';
        if (lowConf) detTxt += '?';
      } else {
        detTxt = '♪ 无音高';
        detCls = 'det none';
      }
    }

    el.innerHTML = `
      <button class="clr" title="删除这个声音">✕</button>
      <button class="rec" title="录 0.5 秒">🎤</button>
      <div class="note">${s.name}</div>
      <div class="${detCls}">${detTxt}</div>
      <div class="state">${s.buffer ? s.buffer.duration.toFixed(2) + 's' : '空'}</div>
    `;
    slotsEl.appendChild(el);
  });
}

/* ===================== 选样：用「检测到的真实音高」匹配 ===================== */
function pickSample(midi) {
  let bestIdx = -1, bestDist = Infinity;
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (!s.buffer) continue;
    const effective = (s.detectedMidi != null) ? s.detectedMidi : s.midi;
    const d = Math.abs(effective - midi);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  if (bestIdx < 0) return null;
  const s = slots[bestIdx];
  return {
    index: bestIdx,
    slotMidi: s.midi,
    srcMidi: (s.detectedMidi != null) ? s.detectedMidi : s.midi,
    buffer: s.buffer
  };
}

/* ===================== 核心：带「乐器化」处理的发音 ===================== */
function trigger(midi, when, dur) {
  const pick = pickSample(midi);
  if (!pick) return -1;

  const buffer = pick.buffer;

  // 变调速率：限制在比较自然的范围内，避免过大失真
  let rate = Math.pow(2, (midi - pick.srcMidi) / 12);
  rate = Math.min(2.4, Math.max(0.42, rate));

  const natural = buffer.duration / rate;          // 变调后的自然时长
  // 音符实际发音时长：比乐谱稍长一点，但不超过自然时长的上限
  const noteDur = Math.max(0.12, Math.min(dur * 1.18, natural + 0.28));

  /* ---- 1. 音量包络（ADSR 简化版） ---- */
  const env = AC.createGain();
  const attack = Math.min(0.012, noteDur * 0.12);
  const release = Math.min(0.16, noteDur * 0.55);
  const sustainEnd = when + noteDur - release;

  env.gain.setValueAtTime(0, when);
  env.gain.linearRampToValueAtTime(0.92, when + attack);
  if (sustainEnd > when + attack + 0.008) {
    env.gain.setValueAtTime(0.92, sustainEnd);
  }
  env.gain.linearRampToValueAtTime(0, when + noteDur);

  /* ---- 2. 共振滤波器：在目标音高附近抬升，让"音高感"更明显 ---- */
  const targetFreq = 440 * Math.pow(2, (midi - 69) / 12);
  const peak1 = AC.createBiquadFilter();
  peak1.type = 'peaking';
  peak1.frequency.value = Math.min(6000, Math.max(180, targetFreq));
  peak1.Q.value = 1.1;
  peak1.gain.value = 9;      // 基频处抬升

  const peak2 = AC.createBiquadFilter();
  peak2.type = 'peaking';
  peak2.frequency.value = Math.min(8000, Math.max(360, targetFreq * 2.4));
  peak2.Q.value = 0.9;
  peak2.gain.value = 5;      // 泛音处轻微抬升，更有"亮"度

  /* ---- 3. 主采样源 ---- */
  const src = AC.createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = rate;

  // 采样太短时做循环延音，让长音符不至于干瘪
  const needLoop = natural < noteDur * 0.85 && buffer.duration > 0.06;
  if (needLoop) {
    src.loop = true;
    src.loopStart = buffer.duration * 0.18;
    src.loopEnd = Math.max(buffer.duration * 0.9, src.loopStart + 0.02);
  }

  const srcGain = AC.createGain();
  srcGain.gain.value = 1.0;
  src.connect(srcGain).connect(peak1);

  /* ---- 4. 失谐副声部：轻微失谐 + 延迟，增加厚度和"琴弦感" ---- */
  const dSrc = AC.createBufferSource();
  dSrc.buffer = buffer;
  dSrc.playbackRate.value = rate * Math.pow(2, 0.045 / 12);   // +4.5 音分
  if (needLoop) {
    dSrc.loop = true;
    dSrc.loopStart = src.loopStart;
    dSrc.loopEnd = src.loopEnd;
  }
  const dGain = AC.createGain();
  dGain.gain.value = 0.38;
  // 稍微延后一点起音，形成自然的"群感"
  const dWhen = when + Math.min(0.014, noteDur * 0.12);
  dGain.gain.setValueAtTime(0, dWhen);
  dGain.gain.linearRampToValueAtTime(0.38, dWhen + 0.02);
  dGain.gain.setValueAtTime(0.38, sustainEnd);
  dGain.gain.linearRampToValueAtTime(0, when + noteDur);

  dSrc.connect(dGain).connect(peak1);

  /* ---- 5. 链路汇总 ---- */
  peak1.connect(peak2).connect(env);
  env.connect(master);           // 干声
  env.connect(reverbBus);        // 混响发送

  /* ---- 6. 启停 ---- */
  const stopAt = when + noteDur + 0.06;
  src.start(when);
  src.stop(stopAt);
  dSrc.start(dWhen);
  dSrc.stop(stopAt);

  activeSources.add(src);
  activeSources.add(dSrc);
  src.onended = () => {
    activeSources.delete(src);
    activeSources.delete(dSrc);
  };

  return pick.index;
}

/* ===================== 录音 ===================== */
let micStream = null;
let recording = false;

async function getMic() {
  if (micStream) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  return micStream;
}

function processBuffer(buf) {
  const ch0 = buf.getChannelData(0);
  const thresh = 0.015;
  let start = 0, end = ch0.length - 1;
  while (start < ch0.length && Math.abs(ch0[start]) < thresh) start++;
  while (end > start && Math.abs(ch0[end]) < thresh) end--;
  if (end - start < 100) return buf;

  const padStart = 64, padEnd = 1200;
  start = Math.max(0, start - padStart);
  const len = Math.min(buf.length - start, (end - start) + padEnd);

  const out = AC.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    out.copyToChannel(buf.getChannelData(c).subarray(start, start + len), c);
  }

  let peak = 0;
  for (let c = 0; c < out.numberOfChannels; c++) {
    const d = out.getChannelData(c);
    for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  }
  if (peak > 1e-3 && peak < 0.98) {
    const gain = 0.98 / peak;
    for (let c = 0; c < out.numberOfChannels; c++) {
      const d = out.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] *= gain;
    }
  }
  return out;
}

async function recordInto(i) {
  if (recording) return;
  const card = slotsEl.querySelector(`.slot[data-i="${i}"]`);
  let stream;
  try {
    stream = await getMic();
  } catch (err) {
    alert('拿不到麦克风权限：' + err.message + '\n可以先点「填充示例响声」玩玩。');
    return;
  }

  recording = true;
  card && card.classList.add('recording');
  setStatus('录音中…（0.5 秒）');

  const chunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });

  rec.start();
  await new Promise(r => setTimeout(r, 500));
  rec.stop();
  await stopped;

  recording = false;
  card && card.classList.remove('recording');

  try {
    const arr = await new Blob(chunks, { type: rec.mimeType || 'audio/webm' }).arrayBuffer();
    const decoded = await AC.decodeAudioData(arr);
    const s = slots[i];
    s.buffer = processBuffer(decoded);
    detectSlot(s);
    render();

    const detTxt = s.detectedRounded != null
      ? `检测到音高：${midiToName(s.detectedRounded)}（约 ${Math.round(440 * Math.pow(2, (s.detectedMidi - 69) / 12))} Hz，置信度 ${(s.clarity*100).toFixed(0)}%）`
      : '没能检测出稳定音高（噪声类声音很正常）';
    setStatus(detTxt);

    trigger(s.midi, AC.currentTime + 0.06, 0.7);
  } catch (err) {
    alert('音频解码失败：' + err.message);
    setStatus('');
  }
}

/* ===================== 检测 / 自动分配 ===================== */
function detectAll() {
  let n = 0;
  slots.forEach(s => { if (s.buffer) { detectSlot(s); n++; } });
  if (!n) { setStatus('还没有任何声音可检测。'); return; }
  render();
  setStatus(`已检测 ${n} 个声音的音高。`);
}

function autoAssign() {
  const filledIdx = [];
  slots.forEach((s, i) => { if (s.buffer) filledIdx.push(i); });
  if (!filledIdx.length) {
    setStatus('还没有任何声音，先录几个或点「填充示例响声」。');
    return;
  }

  for (const i of filledIdx) {
    if (slots[i].detectedMidi === undefined) detectSlot(slots[i]);
  }

  const lo = Math.min(...slots.map(s => s.midi));
  const hi = Math.max(...slots.map(s => s.midi));
  const items = filledIdx.map(i => {
    const s = slots[i];
    let folded = null;
    if (s.detectedMidi != null && s.clarity >= 0.35) {
      folded = s.detectedMidi;
      while (folded < lo) folded += 12;
      while (folded > hi) folded -= 12;
    }
    return { from: i, folded };
  });

  const pairs = [];
  for (const it of items) {
    slots.forEach((slot, j) => {
      const base = it.folded != null ? it.folded : slot.midi;
      pairs.push({ from: it.from, to: j, cost: Math.abs(base - slot.midi) });
    });
  }
  pairs.sort((a, b) => a.cost - b.cost);

  const usedFrom = new Set(), usedTo = new Set();
  const assign = new Array(slots.length).fill(null);
  for (const p of pairs) {
    if (usedFrom.has(p.from) || usedTo.has(p.to)) continue;
    usedFrom.add(p.from); usedTo.add(p.to);
    assign[p.to] = p.from;
  }

  const nb = new Array(slots.length).fill(null);
  const nd = new Array(slots.length).fill(undefined);
  const nr = new Array(slots.length).fill(null);
  const nc = new Array(slots.length).fill(0);
  const movedTo = new Set();
  for (let j = 0; j < slots.length; j++) {
    if (assign[j] == null) continue;
    const src = slots[assign[j]];
    nb[j] = src.buffer;
    nd[j] = src.detectedMidi;
    nr[j] = src.detectedRounded;
    nc[j] = src.clarity;
    if (assign[j] !== j) movedTo.add(j);
  }
  for (let j = 0; j < slots.length; j++) {
    slots[j].buffer = nb[j];
    slots[j].detectedMidi = nd[j];
    slots[j].detectedRounded = nr[j];
    slots[j].clarity = nc[j];
  }

  render();
  movedTo.forEach(j => {
    const el = slotsEl.querySelector(`.slot[data-i="${j}"]`);
    if (el) el.classList.add('moved');
  });

  const noPitch = items.filter(it => it.folded == null).length;
  setStatus(
    `已按音高重排 ${items.length} 个声音` +
    (noPitch ? `（其中 ${noPitch} 个没检测到音高，随意安放）` : '') +
    '。试试播放吧。'
  );
}

/* ===================== 示例响声 ===================== */
// 故意打乱顺序，展示自动分配如何按音高重排
const DEMO_MIDIS = [67, 60, 72, 64, 69, 62, 71, 65];

function makeDemoSound(i) {
  const sr = AC.sampleRate;
  const midi = DEMO_MIDIS[i % DEMO_MIDIS.length];
  const f0 = 440 * Math.pow(2, (midi - 69) / 12);
  const dur = 0.38;
  const len = Math.floor(sr * dur);
  const buf = AC.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const style = i % 3;
  const atk = 0.004;

  for (let k = 0; k < len; k++) {
    const t = k / sr;
    // 更柔和的衰减，接近拨弦/木琴的感觉
    const env = Math.exp(-t * 5.5) * Math.min(1, t / atk);
    let v;
    if (style === 0) {
      v = Math.sin(2 * Math.PI * f0 * t)
        + 0.45 * Math.sin(2 * Math.PI * 2 * f0 * t)
        + 0.20 * Math.sin(2 * Math.PI * 3 * f0 * t);
    } else if (style === 1) {
      v = Math.sin(2 * Math.PI * f0 * t) * 0.9
        + 0.32 * Math.sin(2 * Math.PI * 2 * f0 * t)
        + 0.15 * Math.sin(2 * Math.PI * 4 * f0 * t);
    } else {
      v = Math.sin(2 * Math.PI * f0 * t) * 0.95
        + 0.18 * Math.sin(2 * Math.PI * 3 * f0 * t);
    }
    d[k] = v * env * 0.55;
  }
  return buf;
}

             G4:0.75 G4:0.25 A4:1 G4:1 D5:1 C5:2
             G4:0.75 G4:0.25 G5:1 E5:1 C5:1 B4:1 A4:1
             F5:0.75 F5:0.25 E5:1 C5:1 D5:1 C5:2`

    melody: `D4:1 A3:1 B3:1 F#3:1 G3:1 D3:1 G3:1 A3:1
             D4:1 A3:1 B3:1 F#3:1 G3:1 D3:1 G3:1 A3:1`
  }
};

function parseMelody(str) {
  return str.trim().split(/\s+/).map(tok => {
    const [n, d] = tok.split(':');
    return { midi: n === '-' ? -1 : nameToMidi(n), beats: d ? parseFloat(d) : 1 };
  });
}

/* ===================== 播放调度 ===================== */
const playBtn = document.getElementById('playBtn');
const tuneSel = document.getElementById('tuneSel');
const tempoEl = document.getElementById('tempo');
const tempoVal = document.getElementById('tempoVal');

const playState = { active: false, raf: 0, timer: 0, events: [] };
let currentHighlight = -1;

function stopPlayback() {
  playState.active = false;
  cancelAnimationFrame(playState.raf);
  clearTimeout(playState.timer);
  playBtn.textContent = '▶ 播放';
  for (const s of activeSources) { try { s.stop(); } catch (e) {} }
  activeSources.clear();
  currentHighlight = -1;
  slotsEl.querySelectorAll('.slot.hit').forEach(el => el.classList.remove('hit'));
}

async function togglePlay() {
  await unlock();
  if (playState.active) { stopPlayback(); return; }

  if (!slots.some(s => s.buffer)) {
    setStatus('还没有任何声音，先录几个，或者点「填充示例响声」。');
    return;
  }

  const bpm = +tempoEl.value;
  const beat = 60 / bpm;
  const notes = parseMelody(TUNES[tuneSel.value].melody);

  let t = AC.currentTime + 0.2;
  playState.events = [];

  for (const n of notes) {
    const dur = n.beats * beat;
    if (n.midi >= 0) {
      const slotIndex = trigger(n.midi, t, dur * 0.98);
      playState.events.push({ start: t, end: t + dur * 0.98, slotIndex });
    }
    t += dur;
  }

  playState.active = true;
  playBtn.textContent = '⏹ 停止';
  setStatus('');
  playState.raf = requestAnimationFrame(updateHighlight);

  const totalMs = (t - AC.currentTime + 0.35) * 1000;
  playState.timer = setTimeout(() => { if (playState.active) stopPlayback(); }, totalMs);
}

function updateHighlight() {
  if (!playState.active) return;
  const now = AC.currentTime;
  let idx = -1;
  for (const ev of playState.events) {
    if (now >= ev.start && now < ev.end) { idx = ev.slotIndex; break; }
  }
  if (idx !== currentHighlight) {
    slotsEl.querySelectorAll('.slot.hit').forEach(el => el.classList.remove('hit'));
    if (idx >= 0) {
      const el = slotsEl.querySelector(`.slot[data-i="${idx}"]`);
      if (el) el.classList.add('hit');
    }
    currentHighlight = idx;
  }
  playState.raf = requestAnimationFrame(updateHighlight);
}

/* ===================== 界面事件 ===================== */
slotsEl.addEventListener('click', async (e) => {
  const card = e.target.closest('.slot');
  if (!card) return;
  const i = +card.dataset.i;
  await unlock();

  if (e.target.closest('.rec')) { recordInto(i); return; }
  if (e.target.closest('.clr')) {
    slots[i].buffer = null;
    slots[i].detectedMidi = undefined;
    slots[i].detectedRounded = null;
    slots[i].clarity = 0;
    render();
    return;
  }

  if (slots[i].buffer) {
    trigger(slots[i].midi, AC.currentTime + 0.01, 0.7);
  } else {
    recordInto(i);
  }
});

document.getElementById('demoBtn').addEventListener('click', async () => {
  await unlock();
  slots.forEach((s, i) => {
    s.buffer = makeDemoSound(i);
    detectSlot(s);
  });
  render();
  setStatus('示例响声已就位（顺序打乱）。点「🎯 自动分配音位」看看它怎么重排。');
});

document.getElementById('detectBtn').addEventListener('click', async () => {
  await unlock();
  detectAll();
});

document.getElementById('autoBtn').addEventListener('click', async () => {
  await unlock();
  autoAssign();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('清空所有录音？')) return;
  slots.forEach(s => {
    s.buffer = null; s.detectedMidi = undefined;
    s.detectedRounded = null; s.clarity = 0;
  });
  render();
  setStatus('');
});

playBtn.addEventListener('click', togglePlay);
tempoEl.addEventListener('input', () => { tempoVal.textContent = tempoEl.value; });

Object.entries(TUNES).forEach(([k, v]) => {
  const o = document.createElement('option');
  o.value = k;
  o.textContent = v.label;
  tuneSel.appendChild(o);
});
tuneSel.value = 'twinkle';
tempoEl.value = TUNES.twinkle.bpm;
tempoVal.textContent = tempoEl.value;

tuneSel.addEventListener('change', () => {
  const bpm = TUNES[tuneSel.value].bpm;
  tempoEl.value = bpm;
  tempoVal.textContent = bpm;
});

render();
