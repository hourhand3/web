<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>呼吸心率自测</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }

  .hint-box {
    background: var(--panel);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .hint-box strong { color: var(--text); }

  .duration-row {
    display: flex; gap: 10px; margin-bottom: 24px;
  }
  .duration-btn {
    flex: 1;
    padding: 12px 0;
    background: var(--panel);
    border: 1px solid transparent;
    color: var(--text);
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
  }
  .duration-btn.selected {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
  }

  .primary-btn {
    display: block;
    width: 100%;
    padding: 18px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin-top: auto;
  }
  .primary-btn:active { opacity: 0.85; }
  .primary-btn:disabled { background: #475569; color: #94a3b8; }

  #screen-countdown { align-items: center; justify-content: center; text-align: center; }
  .countdown-label { font-size: 16px; color: var(--muted); margin-bottom: 24px; }
  .countdown-num {
    font-size: 120px;
    font-weight: 200;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 32px;
    font-variant-numeric: tabular-nums;
  }
  .countdown-hint {
    font-size: 15px;
    color: var(--text);
    line-height: 1.8;
    max-width: 280px;
  }

  #screen-measuring { align-items: center; justify-content: center; text-align: center; }
  .measuring-label { font-size: 16px; color: var(--muted); margin-bottom: 16px; }
  .measuring-timer {
    font-size: 88px;
    font-weight: 200;
    color: var(--green);
    line-height: 1;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .measuring-hint { font-size: 14px; color: var(--muted); }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .result-card {
    background: var(--panel);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
  }
  .result-card .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .result-card .value {
    font-size: 40px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .result-card .unit { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .result-card.breath .value { color: var(--green); }
  .result-card.heart .value { color: var(--red); }

  .quality-note {
    font-size: 13px;
    color: var(--muted);
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .quality-note.warn { color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

  /* ===== 波形区域 ===== */
  .waveform-wrap {
    background: var(--panel);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 20px;
    position: relative;
  }
  .waveform-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .window-btns { display: flex; gap: 6px; flex: 1; }
  .win-btn {
    flex: 1;
    padding: 6px 0;
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .win-btn.selected {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .fullscreen-btn {
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }

  #waveform {
    width: 100%;
    height: 240px;
    display: block;
    border-radius: 8px;
    background: #0b1220;
    touch-action: none;
    cursor: default;
  }
  #waveform.grabbable { cursor: grab; }
  #waveform.grabbing { cursor: grabbing; }

  /* 全屏模式 */
  .waveform-wrap.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 30;
    border-radius: 0;
    background: var(--bg);
    padding: 16px 12px;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  .waveform-wrap.fullscreen .waveform-toolbar { margin-bottom: 12px; }
  .waveform-wrap.fullscreen #waveform {
    flex: 1;
    height: auto;
    min-height: 0;
  }

  .btn-row { display: flex; gap: 12px; margin-top: auto; }
  .btn-row .primary-btn { margin-top: 0; }
  .btn-row .secondary-btn {
    flex: 0 0 40%;
    padding: 18px;
    background: var(--panel);
    color: var(--text);
    border: none;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid #1e293b;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    z-index: 10;
  }
  #version { font-family: ui-monospace, monospace; }
  #debugToggle {
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  #debugPanel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60vh;
    background: #0b1220;
    border-top: 1px solid #334155;
    display: none;
    flex-direction: column;
    z-index: 20;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.5);
  }
  #debugPanel.open { display: flex; }
  .debug-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #1e293b;
    font-size: 13px;
    color: var(--muted);
  }
  .debug-header span:first-child { flex: 1; }
  .debug-header button {
    background: transparent;
    border: 1px solid #334155;
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  #debugLog {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-line { margin-bottom: 2px; }
  .log-line .t { color: #64748b; }
  .log-line .cat { color: #7dd3fc; }
  .log-line .msg { color: #e2e8f0; }
  .log-line .data { color: #94a3b8; }
</style>
</head>
<body>

<div id="app">

  <div class="screen active" id="screen-idle">
    <h1>呼吸心率自测</h1>
    <p class="subtitle">将手机平放在仰卧者的胸口，测量指定时间段内的平均呼吸频率与心率。</p>

    <div class="hint-box">
      <strong>使用前请确认：</strong><br>
      1. 手机屏幕朝上或朝下均可，放在胸口中央。<br>
      2. 保持平躺、安静呼吸，测量期间不要移动身体。<br>
      3. 听到结束提示音后拿起手机查看结果。<br>
      4. 本工具仅供日常趋势参考，不能替代医疗设备。
    </div>

    <div class="duration-row" id="durationRow">
      <button class="duration-btn" data-sec="15">15 秒</button>
      <button class="duration-btn selected" data-sec="30">30 秒</button>
      <button class="duration-btn" data-sec="60">60 秒</button>
    </div>

    <button class="primary-btn" id="startBtn">开始自测</button>
  </div>

  <div class="screen" id="screen-countdown">
    <div class="countdown-label">请将手机放到胸口</div>
    <div class="countdown-num" id="countdownNum">5</div>
    <div class="countdown-hint">倒计时结束后开始记录，请保持平躺、安静呼吸。</div>
  </div>

  <div class="screen" id="screen-measuring">
    <div class="measuring-label">测量中</div>
    <div class="measuring-timer" id="measureTimer">30</div>
    <div class="measuring-hint">请保持不动，结束后会有提示音。</div>
  </div>

  <div class="screen" id="screen-done">
    <h1 style="margin-bottom:16px;">测量结果</h1>

    <div class="result-grid">
      <div class="result-card breath">
        <div class="label">呼吸频率</div>
        <div class="value" id="breathValue">--</div>
        <div class="unit">次 / 分钟</div>
      </div>
      <div class="result-card heart">
        <div class="label">心率</div>
        <div class="value" id="heartValue">--</div>
        <div class="unit">BPM</div>
      </div>
    </div>

    <div class="quality-note" id="qualityNote">正在分析...</div>

    <div class="waveform-wrap" id="waveformWrap">
      <div class="waveform-toolbar">
        <div class="window-btns" id="windowBtns">
          <button class="win-btn selected" data-win="0">全部</button>
          <button class="win-btn" data-win="20">20s</button>
          <button class="win-btn" data-win="10">10s</button>
          <button class="win-btn" data-win="5">5s</button>
        </div>
        <button class="fullscreen-btn" id="fullscreenBtn" title="全屏查看">⛶</button>
      </div>
      <canvas id="waveform"></canvas>
    </div>

    <div class="btn-row">
      <button class="secondary-btn" id="againBtn">再测一次</button>
      <button class="primary-btn" id="homeBtn">返回首页</button>
    </div>
  </div>

</div>

<footer>
  <span id="version"></span>
  <button id="debugToggle">调试</button>
</footer>

<div id="debugPanel">
  <div class="debug-header">
    <span>调试日志</span>
    <button id="debugCopy">复制</button>
    <button id="debugClear">清空</button>
    <button id="debugClose">关闭</button>
  </div>
  <div id="debugLog"></div>
</div>

<script>
'use strict';

/* ============================================================
 * 版本信息
 * ============================================================ */
const APP_VERSION = '1.2.0';
const BUILD_DATE  = '2026-10-17';
document.getElementById('version').textContent = `v${APP_VERSION} · ${BUILD_DATE}`;

/* ============================================================
 * 配置
 * ============================================================ */
const CONFIG = {
  countdownSec: 5,
  measureSec: 30,
  breathLowPassHz: 0.5,
  breathBaselineHz: 0.02,
  heartHighPassHz: 1.0,
  heartLowPassHz: 10.0,
  minSamplesForValid: 100,
  heartMinIntervalMs: 350,
};

/* ============================================================
 * 调试日志
 * ============================================================ */
const logs = [];
const debugLogEl = document.getElementById('debugLog');
const debugPanel = document.getElementById('debugPanel');

function log(category, message, data) {
  const entry = { t: performance.now(), category, message, data };
  logs.push(entry);

  const line = document.createElement('div');
  line.className = 'log-line';
  const t = (entry.t / 1000).toFixed(2) + 's';
  const dataStr = data ? ' ' + JSON.stringify(data) : '';
  line.innerHTML =
    `<span class="t">[${t}]</span> ` +
    `<span class="cat">[${category}]</span> ` +
    `<span class="msg">${escapeHtml(message)}</span>` +
    `<span class="data">${escapeHtml(dataStr)}</span>`;
  debugLogEl.appendChild(line);
  debugLogEl.scrollTop = debugLogEl.scrollHeight;

  console.log(`[${category}] ${message}`, data || '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('debugToggle').addEventListener('click', () => {
  debugPanel.classList.toggle('open');
});
document.getElementById('debugClose').addEventListener('click', () => {
  debugPanel.classList.remove('open');
});
document.getElementById('debugClear').addEventListener('click', () => {
  logs.length = 0;
  debugLogEl.innerHTML = '';
});
document.getElementById('debugCopy').addEventListener('click', async () => {
  const text = logs.map(l => {
    const t = (l.t / 1000).toFixed(2) + 's';
    const data = l.data ? ' ' + JSON.stringify(l.data) : '';
    return `[${t}] [${l.category}] ${l.message}${data}`;
  }).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    alert('日志已复制到剪贴板');
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents(debugLogEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    alert('请手动复制选中的文本');
  }
});

/* ============================================================
 * 音频
 * ============================================================ */
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  log('audio', 'AudioContext 已初始化', { state: audioCtx.state });
}

function beep(freq, duration, volume) {
  if (!audioCtx) { log('audio', 'beep 跳过：audioCtx 未初始化'); return; }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.type = 'sine';
  osc.frequency.value = freq;
  const t0 = audioCtx.currentTime;
  gain.gain.setValueAtTime(volume || 0.25, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

  osc.start(t0);
  osc.stop(t0 + duration);
}

/* ============================================================
 * 状态机
 * ============================================================ */
let state = 'idle';
let samples = [];
let measureStartTime = 0;
let measureDurationSec = CONFIG.measureSec;
let wakeLock = null;
let countdownTimer = null;
let measureInterval = null;

const screens = {
  idle:       document.getElementById('screen-idle'),
  countdown:  document.getElementById('screen-countdown'),
  measuring:  document.getElementById('screen-measuring'),
  done:       document.getElementById('screen-done'),
};

function setState(newState) {
  state = newState;
  Object.entries(screens).forEach(([k, el]) => {
    el.classList.toggle('active', k === newState);
  });
  log('state', '切换到 ' + newState);
}

/* ============================================================
 * 时长选择
 * ============================================================ */
document.getElementById('durationRow').addEventListener('click', e => {
  const btn = e.target.closest('.duration-btn');
  if (!btn) return;
  document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  measureDurationSec = parseInt(btn.dataset.sec, 10);
  log('config', '测量时长设为 ' + measureDurationSec + ' 秒');
});

/* ============================================================
 * 开始流程
 * ============================================================ */
document.getElementById('startBtn').addEventListener('click', startFlow);

async function startFlow() {
  log('flow', '用户点击开始');

  initAudio();

  try {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const perm = await DeviceMotionEvent.requestPermission();
      log('permission', 'DeviceMotion 权限', { result: perm });
      if (perm !== 'granted') {
        alert('需要允许访问运动传感器才能测量，请在设置中开启后重试。');
        return;
      }
    } else {
      log('permission', '无需显式请求 DeviceMotion 权限');
    }
  } catch (e) {
    log('permission', '权限请求异常', { error: e.message });
    alert('无法获取传感器权限：' + e.message);
    return;
  }

  if (!('DeviceMotionEvent' in window)) {
    alert('当前浏览器不支持 DeviceMotion，请使用 iOS Safari 或 Android Chrome。');
    return;
  }

  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      log('wakeLock', '屏幕常亮已启用');
    } else {
      log('wakeLock', '当前浏览器不支持 Wake Lock');
    }
  } catch (e) {
    log('wakeLock', 'Wake Lock 失败', { error: e.message });
  }

  enterCountdown();
}

function enterCountdown() {
  setState('countdown');
  beep(800, 0.1);

  let remaining = CONFIG.countdownSec;
  const numEl = document.getElementById('countdownNum');
  numEl.textContent = remaining;

  countdownTimer = setInterval(() => {
    remaining--;
    numEl.textContent = Math.max(remaining, 0);
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      startMeasuring();
    }
  }, 1000);
}

function startMeasuring() {
  setState('measuring');
  beep(600, 0.15);
  log('flow', '测量开始', { durationSec: measureDurationSec });

  samples = [];
  measureStartTime = performance.now();
  window.addEventListener('devicemotion', onMotion);

  const totalMs = measureDurationSec * 1000;
  const timerEl = document.getElementById('measureTimer');
  timerEl.textContent = measureDurationSec;

  measureInterval = setInterval(() => {
    const elapsed = performance.now() - measureStartTime;
    const remaining = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));
    timerEl.textContent = remaining;
    if (elapsed >= totalMs) {
      clearInterval(measureInterval);
      stopMeasuring();
    }
  }, 150);
}

function onMotion(event) {
  const a = event.accelerationIncludingGravity;
  if (!a || a.x === null || a.y === null || a.z === null) return;
  samples.push({ t: performance.now(), x: a.x, y: a.y, z: a.z });
}

function stopMeasuring() {
  window.removeEventListener('devicemotion', onMotion);
  log('flow', '测量结束', { sampleCount: samples.length });

  beep(660, 0.25, 0.3);
  setTimeout(() => beep(880, 0.35, 0.3), 350);

  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
    log('wakeLock', '屏幕常亮已释放');
  }

  const result = analyze(samples);

  // 先切到 done，让 canvas 父元素可见，再在下一帧绘制
  setState('done');
  requestAnimationFrame(() => renderResult(result));
}

/* ============================================================
 * 滤波
 * ============================================================ */
function lowPassArray(input, ts, fc) {
  const n = input.length;
  const out = new Array(n);
  if (n === 0) return out;
  const RC = 1 / (2 * Math.PI * fc);
  let prev = input[0];
  out[0] = prev;
  for (let i = 1; i < n; i++) {
    const dt = (ts[i] - ts[i-1]) / 1000;
    if (dt <= 0) { out[i] = prev; continue; }
    const alpha = dt / (RC + dt);
    prev = prev + alpha * (input[i] - prev);
    out[i] = prev;
  }
  return out;
}

function highPassArray(input, ts, fc) {
  const n = input.length;
  const out = new Array(n);
  if (n === 0) return out;
  const RC = 1 / (2 * Math.PI * fc);
  let prevIn = input[0];
  let prevOut = 0;
  out[0] = 0;
  for (let i = 1; i < n; i++) {
    const dt = (ts[i] - ts[i-1]) / 1000;
    if (dt <= 0) { out[i] = prevOut; continue; }
    const alpha = RC / (RC + dt);
    const y = alpha * (prevOut + input[i] - prevIn);
    prevIn = input[i];
    prevOut = y;
    out[i] = y;
  }
  return out;
}

/* ============================================================
 * 通用工具
 * ============================================================ */
function arrayMin(arr) {
  let m = Infinity;
  for (let i = 0; i < arr.length; i++) if (arr[i] < m) m = arr[i];
  return m;
}
function arrayMax(arr) {
  let m = -Infinity;
  for (let i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i];
  return m;
}
function average(arr) {
  let s = 0;
  for (let i = 0; i < arr.length; i++) s += arr[i];
  return arr.length ? s / arr.length : 0;
}
function stddev(arr, mean) {
  if (arr.length < 2) return 0;
  let s = 0;
  for (let i = 0; i < arr.length; i++) s += (arr[i] - mean) ** 2;
  return Math.sqrt(s / (arr.length - 1));
}
function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

/* ============================================================
 * 信号处理辅助
 * ============================================================ */
function movingAverage(signal, window) {
  const n = signal.length;
  const out = new Array(n);
  const half = Math.floor(window / 2);
  for (let i = 0; i < n; i++) {
    const start = Math.max(0, i - half);
    const end   = Math.min(n - 1, i + half);
    let sum = 0;
    for (let j = start; j <= end; j++) sum += signal[j];
    out[i] = sum / (end - start + 1);
  }
  return out;
}

function filterByIQR(arr, multiplier) {
  if (arr.length < 5) return [...arr];
  const sorted = [...arr].sort((a, b) => a - b);
  const q1 = sorted[Math.floor(sorted.length * 0.25)];
  const q3 = sorted[Math.floor(sorted.length * 0.75)];
  const iqr = q3 - q1;
  const lo = q1 - multiplier * iqr;
  const hi = q3 + multiplier * iqr;
  return arr.filter(v => v >= lo && v <= hi);
}

function autocorrelationBpm(signal, ts) {
  const n = signal.length;
  if (n < 100) return 0;

  const dt = (ts[n - 1] - ts[0]) / (n - 1) / 1000;
  if (!(dt > 0)) return 0;

  const mean = average(signal);
  const centered = signal.map(v => v - mean);

  let zeroEnergy = 0;
  for (let i = 0; i < n; i++) zeroEnergy += centered[i] * centered[i];
  if (zeroEnergy < 1e-9) return 0;

  const minLag = Math.max(1, Math.round(0.35 / dt));
  const maxLag = Math.min(n - 2, Math.round(1.6 / dt));
  if (maxLag <= minLag) return 0;

  const ac = new Array(maxLag + 1).fill(0);
  for (let lag = 0; lag <= maxLag; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += centered[i] * centered[i + lag];
    ac[lag] = sum / zeroEnergy;
  }

  let bestLag = -1;
  let bestVal = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    const isLocalMax =
      ac[lag] > ac[lag - 1] &&
      (lag === maxLag || ac[lag] >= ac[lag + 1]);
    if (isLocalMax) {
      if (ac[lag] > bestVal) {
        bestVal = ac[lag];
        bestLag = lag;
      }
      if (ac[lag] > 0.35) break;
    }
  }

  if (bestLag <= 0) return 0;
  return 60 / (bestLag * dt);
}

/* ============================================================
 * 分析入口
 * ============================================================ */
function analyze(rawSamples) {
  const t0 = performance.now();
  log('analyze', '开始分析', { sampleCount: rawSamples.length });

  if (rawSamples.length < CONFIG.minSamplesForValid) {
    log('analyze', '样本不足');
    return {
      ok: false,
      error: '样本数量不足，请重试',
      sampleCount: rawSamples.length,
      duration: 0,
      sampleRate: 0,
      breathRate: 0,
      heartRate: 0,
      breathSignal: [],
      heartSignal: [],
      quality: 'bad'
    };
  }

  const ts = rawSamples.map(s => s.t);
  const xs = rawSamples.map(s => s.x);
  const ys = rawSamples.map(s => s.y);
  const zs = rawSamples.map(s => s.z);

  const durationSec = (ts[ts.length - 1] - ts[0]) / 1000;
  const sampleRate = rawSamples.length / durationSec;

  log('analyze', '采样统计', {
    durationSec: +durationSec.toFixed(2),
    sampleRate: +sampleRate.toFixed(2)
  });

  // ---------- 呼吸通道 ----------
  const xsLp = lowPassArray(xs, ts, CONFIG.breathLowPassHz);
  const ysLp = lowPassArray(ys, ts, CONFIG.breathLowPassHz);
  const zsLp = lowPassArray(zs, ts, CONFIG.breathLowPassHz);

  const xsBase = lowPassArray(xsLp, ts, CONFIG.breathBaselineHz);
  const ysBase = lowPassArray(ysLp, ts, CONFIG.breathBaselineHz);
  const zsBase = lowPassArray(zsLp, ts, CONFIG.breathBaselineHz);

  const breathSignal = new Array(rawSamples.length);
  for (let i = 0; i < rawSamples.length; i++) {
    const dx = xsLp[i] - xsBase[i];
    const dy = ysLp[i] - ysBase[i];
    const dz = zsLp[i] - zsBase[i];
    breathSignal[i] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  }

  const breathPeaks = detectBreathPeaks(breathSignal, ts);
  const breathRate = computeBreathRate(breathPeaks);
  log('analyze', '呼吸峰值', {
    peakCount: breathPeaks.length,
    rate: +breathRate.toFixed(1)
  });

  // ---------- 心跳通道 ----------
  const xsHp = highPassArray(xs, ts, CONFIG.heartHighPassHz);
  const ysHp = highPassArray(ys, ts, CONFIG.heartHighPassHz);
  const zsHp = highPassArray(zs, ts, CONFIG.heartHighPassHz);

  const xsBp = lowPassArray(xsHp, ts, CONFIG.heartLowPassHz);
  const ysBp = lowPassArray(ysHp, ts, CONFIG.heartLowPassHz);
  const zsBp = lowPassArray(zsHp, ts, CONFIG.heartLowPassHz);

  const heartSignal = new Array(rawSamples.length);
  for (let i = 0; i < rawSamples.length; i++) {
    heartSignal[i] = Math.sqrt(
      xsBp[i]*xsBp[i] + ysBp[i]*ysBp[i] + zsBp[i]*zsBp[i]
    );
  }

  const heartResult = detectHeartRate(heartSignal, ts);
  log('analyze', '心跳结果', heartResult);

  const elapsed = performance.now() - t0;
  log('analyze', '分析完成', { elapsedMs: +elapsed.toFixed(1) });

  return {
    ok: true,
    sampleCount: rawSamples.length,
    duration: durationSec,
    sampleRate,
    breathRate: Math.round(breathRate),
    heartRate: heartResult.bpm,
    heartQuality: heartResult.quality,
    heartNote: heartResult.note,
    breathSignal,
    heartSignal,
    ts,
    quality: heartResult.quality === '良好' ? 'good' : 'warn'
  };
}

/* ============================================================
 * 呼吸峰值检测
 * ============================================================ */
function detectBreathPeaks(signal, ts) {
  const min = arrayMin(signal);
  const max = arrayMax(signal);
  const range = max - min;
  if (range < 1e-6) return [];

  const low  = min + 0.2 * range;
  const high = min + 0.4 * range;

  const peaks = [];
  let above = false;
  for (let i = 0; i < signal.length; i++) {
    if (!above && signal[i] > high) {
      peaks.push(ts[i]);
      above = true;
    } else if (above && signal[i] < low) {
      above = false;
    }
  }
  return peaks;
}

function computeBreathRate(peaks) {
  if (peaks.length < 2) return 0;
  const intervals = [];
  for (let i = 1; i < peaks.length; i++) {
    intervals.push((peaks[i] - peaks[i-1]) / 1000);
  }
  const valid = intervals.filter(iv => iv > 0.5 && iv < 15);
  if (valid.length === 0) return 0;
  const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
  return 60 / avg;
}

/* ============================================================
 * 心率检测（间隔均匀性先验）
 * ============================================================ */
function detectHeartRate(signal, ts) {
  const n = signal.length;
  if (n < 100) {
    return { bpm: 0, quality: '样本不足', peakCount: 0 };
  }

  const smoothed = movingAverage(signal, 5);

  const mean = average(smoothed);
  const std  = stddev(smoothed, mean);
  if (std < 1e-6) {
    return { bpm: 0, quality: '信号过弱', peakCount: 0 };
  }

  const highTh = mean + 0.7 * std;
  const lowTh  = mean + 0.2 * std;

  const peaks = [];
  let above = false;
  let lastPeakT = -Infinity;

  for (let i = 0; i < n; i++) {
    if (!above && smoothed[i] > highTh) {
      const t = ts[i];
      if (t - lastPeakT >= CONFIG.heartMinIntervalMs) {
        peaks.push(t);
        lastPeakT = t;
      }
      above = true;
    } else if (above && smoothed[i] < lowTh) {
      above = false;
    }
  }

  if (peaks.length < 5) {
    return {
      bpm: 0, quality: '峰值不足', peakCount: peaks.length
    };
  }

  const rawIntervals = [];
  for (let i = 1; i < peaks.length; i++) {
    rawIntervals.push((peaks[i] - peaks[i - 1]) / 1000);
  }
  const cleanIntervals = filterByIQR(rawIntervals, 1.5);

  if (cleanIntervals.length < 3) {
    return {
      bpm: 0, quality: '间隔过于离散', peakCount: peaks.length,
      rawIntervalCount: rawIntervals.length,
      cleanIntervalCount: cleanIntervals.length
    };
  }

  const medInterval = median(cleanIntervals);
  const bpmPeak = 60 / medInterval;

  const meanInterval = average(cleanIntervals);
  const stdInterval  = stddev(cleanIntervals, meanInterval);
  const cv = meanInterval > 0 ? stdInterval / meanInterval : 1;

  const bpmAutocorr = autocorrelationBpm(signal, ts);

  let finalBpm = bpmPeak;
  let quality = '良好';
  let note = '';

  const autocorrValid = bpmAutocorr >= 35 && bpmAutocorr <= 180;
  const peakValid     = bpmPeak     >= 40 && bpmPeak     <= 180;

  if (autocorrValid && peakValid) {
    const diff = Math.abs(bpmPeak - bpmAutocorr) / bpmAutocorr;
    if (diff > 0.20) {
      finalBpm = bpmAutocorr;
      quality = '参考值（通道不一致）';
      note = `峰值法 ${bpmPeak.toFixed(0)}，自相关 ${bpmAutocorr.toFixed(0)}，差异过大，取自相关值`;
    } else {
      finalBpm = (bpmPeak + bpmAutocorr) / 2;
      quality = '良好';
    }
  } else if (autocorrValid) {
    finalBpm = bpmAutocorr;
    quality = '参考值（仅自相关可用）';
    note = `峰值法异常（${bpmPeak.toFixed(0)} BPM）`;
  } else if (!peakValid) {
    finalBpm = bpmPeak;
    quality = '数值异常（参考）';
  }

  if (cv > 0.25 && quality === '良好') {
    quality = '间隔不均（参考）';
    note = `间隔变异系数 ${cv.toFixed(2)} 偏高，可能含杂波`;
  }

  return {
    bpm: Math.round(finalBpm),
    peakCount: peaks.length,
    rawIntervalCount: rawIntervals.length,
    cleanIntervalCount: cleanIntervals.length,
    medianInterval: +medInterval.toFixed(3),
    cv: +cv.toFixed(3),
    bpmPeak: +bpmPeak.toFixed(1),
    bpmAutocorr: +bpmAutocorr.toFixed(1),
    quality,
    note
  };
}

/* ============================================================
 * 结果渲染
 * ============================================================ */
let lastResult = null;
const waveView = { windowSec: 0, startSec: 0 };

function renderResult(result) {
  const breathEl = document.getElementById('breathValue');
  const heartEl  = document.getElementById('heartValue');
  const qualityEl = document.getElementById('qualityNote');

  if (!result.ok) {
    lastResult = null;
    breathEl.textContent = '--';
    heartEl.textContent  = '--';
    qualityEl.textContent = result.error;
    qualityEl.classList.add('warn');
    const ctx = document.getElementById('waveform').getContext('2d');
    ctx.clearRect(0, 0, 9999, 9999);
    return;
  }

  lastResult = result;
  waveView.windowSec = 0;
  waveView.startSec = 0;
  updateWindowBtns();

  breathEl.textContent = result.breathRate > 0 ? result.breathRate : '--';
  heartEl.textContent  = result.heartRate  > 0 ? result.heartRate  : '--';

  qualityEl.classList.toggle('warn', result.quality !== 'good');

  const baseInfo =
    `采样 ${result.sampleCount} 个点 · ${result.duration.toFixed(1)} 秒 · ` +
    `采样率约 ${result.sampleRate.toFixed(0)} Hz。`;

  if (result.quality === 'good') {
    qualityEl.textContent = baseInfo + ' 呼吸与心率均为该时段平均值，仅供参考。';
  } else {
    const q = result.heartQuality || '';
    const n = result.heartNote ? ' ' + result.heartNote + '。' : '';
    qualityEl.textContent =
      baseInfo + ` 心率信号质量较低（${q}）。${n}建议重新放置手机后重测。`;
  }

  drawWaveforms();
}

/* ============================================================
 * 波形绘制（含时间窗口与拖动）
 * ============================================================ */
function updateWindowBtns() {
  document.querySelectorAll('#windowBtns .win-btn').forEach(b => {
    const win = parseInt(b.dataset.win, 10) || 0;
    b.classList.toggle('selected', win === waveView.windowSec);
  });
  const canvas = document.getElementById('waveform');
  canvas.classList.toggle('grabbable', waveView.windowSec > 0);
}

function clampView() {
  if (!lastResult || !lastResult.ok) { waveView.startSec = 0; return; }
  const dur = lastResult.duration;
  if (waveView.windowSec <= 0) { waveView.startSec = 0; return; }
  const win = Math.min(waveView.windowSec, dur);
  waveView.startSec = Math.max(0, Math.min(waveView.startSec, dur - win));
}

function computeViewRange() {
  const ts = lastResult.ts;
  const n = ts.length;
  const t0 = ts[0];
  const t1 = ts[n - 1];
  const duration = (t1 - t0) / 1000;

  let win = waveView.windowSec > 0 ? Math.min(waveView.windowSec, duration) : duration;
  let start = waveView.windowSec > 0 ? waveView.startSec : 0;
  start = Math.max(0, Math.min(start, duration - win));

  const targetStart = t0 + start * 1000;
  const targetEnd   = t0 + (start + win) * 1000;

  let i0 = 0, i1 = n - 1;
  for (let i = 0; i < n; i++) { if (ts[i] >= targetStart) { i0 = i; break; } }
  for (let i = n - 1; i >= 0; i--) { if (ts[i] <= targetEnd) { i1 = i; break; } }
  if (i1 <= i0) { i0 = 0; i1 = n - 1; }
  return { i0, i1, duration, viewStart: start, viewEnd: start + win };
}

function drawWaveforms() {
  if (!lastResult || !lastResult.ok) return;

  const canvas = document.getElementById('waveform');
  const rect = canvas.getBoundingClientRect();
  const cssW = rect.width  || canvas.clientWidth || 320;
  const cssH = rect.height || 240;
  const dpr = window.devicePixelRatio || 1;

  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = cssW, H = cssH, halfH = H / 2;
  ctx.clearRect(0, 0, W, H);

  // 中线
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, halfH);
  ctx.lineTo(W, halfH);
  ctx.stroke();

  const range = computeViewRange();

  drawSignal(ctx, lastResult.breathSignal, range.i0, range.i1, 0, 0,     W, halfH, '#4ade80', '呼吸波形');
  drawSignal(ctx, lastResult.heartSignal,  range.i0, range.i1, 0, halfH, W, halfH, '#f87171', '心跳波形');

  // 时间标签
  ctx.fillStyle = '#64748b';
  ctx.font = '11px -apple-system, sans-serif';
  const label = waveView.windowSec > 0
    ? `${range.viewStart.toFixed(1)}s – ${range.viewEnd.toFixed(1)}s / 共 ${range.duration.toFixed(1)}s`
    : `全部 ${range.duration.toFixed(1)}s`;
  const tw = ctx.measureText(label).width;
  ctx.fillText(label, W - tw - 8, H - 6);

  log('render', '波形已绘制', {
    canvasW: canvas.width, canvasH: canvas.height, dpr,
    windowSec: waveView.windowSec,
    visibleSamples: range.i1 - range.i0 + 1
  });
}

function drawSignal(ctx, signal, i0, i1, x0, y0, w, h, color, label) {
  if (!signal || i1 - i0 < 1) return;

  // 窗口内局部归一化
  let min = Infinity, max = -Infinity;
  for (let i = i0; i <= i1; i++) {
    if (signal[i] < min) min = signal[i];
    if (signal[i] > max) max = signal[i];
  }
  const range = (max - min) || 1;

  const padTop = 22;
  const padBottom = 18;
  const plotH = h - padTop - padBottom;

  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  const count = i1 - i0;
  for (let k = 0; k <= count; k++) {
    const i = i0 + k;
    const x = x0 + (k / count) * w;
    const norm = (signal[i] - min) / range;
    const y = y0 + padTop + (1 - norm) * plotH;
    if (k === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillText(label, x0 + 10, y0 + 16);
}

/* ============================================================
 * 波形交互：窗口切换 / 拖动 / 全屏
 * ============================================================ */
const waveformWrap = document.getElementById('waveformWrap');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const canvasEl = document.getElementById('waveform');

document.getElementById('windowBtns').addEventListener('click', e => {
  const btn = e.target.closest('.win-btn');
  if (!btn) return;
  const win = parseInt(btn.dataset.win, 10) || 0;
  waveView.windowSec = win;
  if (lastResult && lastResult.ok) {
    if (win > 0) {
      // 居中显示
      waveView.startSec = Math.max(0, (lastResult.duration - win) / 2);
    } else {
      waveView.startSec = 0;
    }
  }
  clampView();
  updateWindowBtns();
  drawWaveforms();
  log('view', '时间窗口切换', {
    windowSec: waveView.windowSec,
    startSec: +waveView.startSec.toFixed(2)
  });
});

// 拖动平移
let isDragging = false;
let dragStartX = 0;
let dragStartStartSec = 0;

canvasEl.addEventListener('pointerdown', e => {
  if (!lastResult || !lastResult.ok) return;
  if (waveView.windowSec <= 0) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartStartSec = waveView.startSec;
  canvasEl.classList.add('grabbing');
  try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
});

canvasEl.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const rect = canvasEl.getBoundingClientRect();
  const win = Math.min(waveView.windowSec, lastResult.duration);
  const pxPerSec = rect.width / win;
  waveView.startSec = dragStartStartSec - dx / pxPerSec;
  clampView();
  drawWaveforms();
});

function endDrag(e) {
  if (!isDragging) return;
  isDragging = false;
  canvasEl.classList.remove('grabbing');
  try { canvasEl.releasePointerCapture(e.pointerId); } catch (_) {}
  log('view', '拖动结束', { startSec: +waveView.startSec.toFixed(2) });
}

canvasEl.addEventListener('pointerup', endDrag);
canvasEl.addEventListener('pointercancel', endDrag);

// 全屏
function enterFullscreen() {
  waveformWrap.classList.add('fullscreen');
  document.body.style.overflow = 'hidden';
  fullscreenBtn.textContent = '✕';
  fullscreenBtn.title = '退出全屏';
  requestAnimationFrame(() => drawWaveforms());
  log('view', '进入全屏');
}

function exitFullscreen() {
  waveformWrap.classList.remove('fullscreen');
  document.body.style.overflow = '';
  fullscreenBtn.textContent = '⛶';
  fullscreenBtn.title = '全屏查看';
  requestAnimationFrame(() => {
    if (lastResult && lastResult.ok) drawWaveforms();
  });
  log('view', '退出全屏');
}

fullscreenBtn.addEventListener('click', () => {
  if (waveformWrap.classList.contains('fullscreen')) exitFullscreen();
  else enterFullscreen();
});

// 窗口尺寸变化时重绘（如设备旋转）
window.addEventListener('resize', () => {
  if (lastResult && lastResult.ok) {
    requestAnimationFrame(() => drawWaveforms());
  }
});

/* ============================================================
 * 按钮事件
 * ============================================================ */
document.getElementById('againBtn').addEventListener('click', () => {
  if (waveformWrap.classList.contains('fullscreen')) exitFullscreen();
  setState('idle');
});
document.getElementById('homeBtn').addEventListener('click', () => {
  if (waveformWrap.classList.contains('fullscreen')) exitFullscreen();
  setState('idle');
});

/* ============================================================
 * 启动
 * ============================================================ */
log('init', '应用已加载', {
  version: APP_VERSION,
  build: BUILD_DATE,
  ua: navigator.userAgent,
  hasDeviceMotion: 'DeviceMotionEvent' in window,
  hasWakeLock: 'wakeLock' in navigator,
  isSecureContext: window.isSecureContext,
});
</script>
</body>
</html>
